t accessibility\nTest important flows with TalkBack, larger font/display sizes, Accessibility Scanner, and Compose semantics tests. Check that elements are understandable, navigation order is logical, and actions can be completed. For example:\n```kotlin\ncomposeTestRule\n    .onNodeWithContentDescription(\"Delete item\")\n    .assertExists()\n```\n\n:::summary\n**Easy interview answer:**\n> I use meaningful descriptions and Compose semantics, provide adequate touch targets, support larger text, maintain contrast, and avoid using color as the only signal. I prefer standard Material components, add semantics to custom controls, and test flows with TalkBack, accessibility tools, and Compose UI tests. Accessibility is part of development, not a final add-on.\n:::"},{"id":"android-r8-reflection-obfuscation","section":"Android","difficulty":"Senior","tags":["R8","ProGuard","Optimization","Reflection"],"question":"How does R8 obfuscation affect reflection, and how would you debug a release-only failure?","answer":"R8 can perform **shrinking, optimization, and obfuscation**. For example, it may rename `UserRepository` or `getUserDetails()` to short names. This can reduce APK size and make implementation details harder to understand from compiled output. Release stack traces may look obfuscated; use the generated `mapping.txt` with retrace to recover original names.\n\n### Why can reflection fail?\nA direct reference such as `PaymentHandler()` is visible to static analysis. A reflective lookup may not be:\n```kotlin\nClass.forName(\"com.example.PaymentHandler\")\n```\n\nIf R8 cannot see that reflective use, it may consider the class or members unused and remove or rename them. The app may work in debug but fail in a minified release build with exceptions such as `ClassNotFoundException`, `NoSuchMethodException`, or `NoSuchFieldException`.\n\n### How would I debug it?\n1. Reproduce with a release-like build where minification is enabled.\n2. Inspect the runtime exception and identify the reflective class/member lookup.\n3. Inspect R8 outputs such as `mapping.txt`; `usage.txt` may show removed code when configured.\n4. Add a **targeted keep rule** for only the class or members that reflection requires, or use `@Keep` where appropriate.\n5. Rebuild and test the minified variant.\n\nFor example:\n```proguard\n-keep class com.example.PaymentHandler { *; }\n```\n\nAvoid broad rules such as `-keep class ** { *; }`: keeping everything reduces shrinking and optimization benefits. If a library relies on reflection, it should provide appropriate consumer R8 rules so applications do not have to guess what must be kept.\n\n:::summary\n**Easy interview answer:**\n> R8 shrinks, optimizes, and obfuscates release code. Reflection can hide references from static analysis, so R8 may remove or rename a class that is loaded dynamically. If debug works but minified release fails, I reproduce with R8 enabled, inspect the exception and mapping/removal outputs, then add the narrowest keep rule or annotation needed. I avoid keeping entire packages unnecessarily, and libraries should ship consumer rules for their reflective requirements.\n:::"},{"id":"android-gradle-build-flavors","section":"Android","difficulty":"Standard","tags":["Gradle","Build Flavors","Build Variants"],"question":"What are Build Flavors in Android? How and why do we use them?","answer":"**Build Flavors create different versions of the same Android application from one codebase.** For example, we can have `dev`, `staging`, and `prod` versions without maintaining separate projects.\n\nDefine a flavor dimension and flavors in the app's Gradle configuration:\n```kotlin\nandroid {\n    flavorDimensions += \"environment\"\n\n    productFlavors {\n        create(\"dev\") {\n            dimension = \"environment\"\n            applicationIdSuffix = \".dev\"\n        }\n        create(\"staging\") {\n            dimension = \"environment\"\n            applicationIdSuffix = \".staging\"\n        }\n        create(\"prod\") {\n            dimension = \"environment\"\n        }\n    }\n}\n```\n\n### Environment-specific configuration\nFlavors commonly select different API endpoints or service configuration:\n```kotlin\ncreate(\"dev\") {\n    dimension = \"environment\"\n    buildConfigField(\"String\", \"BASE_URL\", \"\\\"https://dev.api.example.com\\\"\")\n}\n\ncreate(\"prod\") {\n    dimension = \"environment\"\n    buildConfigField(\"String\", \"BASE_URL\", \"\\\"https://api.example.com\\\"\")\n}\n```\n\nThe app can read the selected value from `BuildConfig.BASE_URL`. Flavors can also provide different app names, icons, Firebase configuration, resources, dependencies, or code in source sets such as `src/dev/` and `src/prod/`.\n\n### Build Flavor vs. Build Type\nA **Build Type** describes how the app is built, commonly `debug` or `release`:\n```kotlin\nbuildTypes {\n    debug { isDebuggable = true }\n    release { isMinifyEnabled = true }\n}\n```\n\nA **Product Flavor** describes which product or environment is being built, such as `dev`, `staging`, `prod`, `free`, or `paid`. Gradle combines each flavor with a build type to create build variants, such as `devDebug` or `prodRelease`.\n\n```text\nProduct Flavor + Build Type → Build Variant\n```\n\n### Flavor dimensions\nMultiple dimensions can be combined. For example, an `environment` dimension (`dev`, `prod`) and a `version` dimension (`free`, `paid`) combine with build types to create variants such as `devFreeDebug` and `prodPaidRelease`.\n\n:::summary\n**Easy interview answer:**\n> Build Flavors create different versions of an Android app from one codebase, such as dev, staging, and production with different API URLs or resources. A Product Flavor says which product or environment we are building; a Build Type says how we build it, such as debug or release. Gradle combines them into Build Variants like `devDebug` and `prodRelease`.\n:::"},{"id":"android-workmanager-alarmmanager-jobscheduler","section":"Android","difficulty":"Standard","tags":["WorkManager","AlarmManager","JobScheduler","Background Work"],"question":"WorkManager vs AlarmManager vs JobScheduler","answer":"All three can schedule background work, but they serve different needs.\n\n### WorkManager — reliable work that should eventually happen\nUse `WorkManager` when the work must run after its constraints are met, but the exact execution time is flexible. Examples include uploading logs, syncing data, or backing up files. It supports constraints, retries, periodic and unique work, chaining, and observing work status.\n```kotlin\nclass SyncWorker(\n    context: Context,\n    params: WorkerParameters\n) : CoroutineWorker(context, params) {\n    override suspend fun doWork(): Result {\n        syncData()\n        return Result.success()\n    }\n}\n```\n\n### AlarmManager — time-sensitive alarms\nUse `AlarmManager` for alarms or reminders tied to a particular time, such as a medicine reminder. Exact alarms have additional Android restrictions and may require special permission.\n\n### JobScheduler — lower-level system job API\n`JobScheduler` is an Android framework API for scheduling jobs based on conditions such as network availability, charging, or device idle. It is lower-level and requires more job-handling code.\n\nWorkManager is a higher-level AndroidX API. Depending on Android version and configuration, it delegates scheduling to platform mechanisms such as `JobScheduler` (and other schedulers on older versions). For most app-level sync or upload work, use WorkManager rather than JobScheduler directly.\n\n### Quick comparison\n- Work that should eventually run, retry, or wait for network → **WorkManager**.\n- Alarm or reminder at a specific time → **AlarmManager**.\n- Direct, lower-level Android system job scheduling → **JobScheduler**.\n\n:::summary\n**Easy interview answer:**\n> WorkManager is for reliable background work that should eventually happen, with constraints, retries, chaining, and unique work. AlarmManager is for time-sensitive alarms. JobScheduler is Android's lower-level API for condition-based jobs; WorkManager can use it internally. For most application-level sync and uploads, I choose WorkManager.\n\n**Easy way to remember:**\nMust eventually happen → WorkManager.\nMust happen at a specific time → AlarmManager.\nNeed direct low-level system scheduling → JobScheduler.\n:::"},{"id":"cold-flow-vs-livedata-safe-iterable-map","section":"Android","difficulty":"Senior","tags":["Kotlin","Flow","LiveData","SafeIterableMap","Android Internals"],"question":"What is Cold Flow vs LiveData? Which data structure does LiveData use internally?","answer":"A normal Kotlin `Flow` created with `flow {}` is **cold**: it starts producing values only when collected. Each collector normally starts its own upstream execution:\n```kotlin\nval usersFlow = flow {\n    println(\"Fetching users\")\n    emit(api.getUsers())\n}\n\nusersFlow.collect { users -> println(users) }\n```\n\nCollecting that cold flow twice can run its upstream work twice.\n\n### What about LiveData?\n`LiveData` is an Android **lifecycle-aware observable data holder**. Multiple observers observe the same LiveData object, and lifecycle-bound observers receive updates while active and are removed when their lifecycle is destroyed:\n```kotlin\nval user = MutableLiveData\u003cUser>()\nuser.value = User(\"Rahul\")\n\nviewModel.user.observe(viewLifecycleOwner) { value ->\n    // Update UI\n}\n```\n\nA normal Flow is not lifecycle-aware by itself. In Android UI, use lifecycle-aware collection APIs such as `collectAsStateWithLifecycle()` in Compose or `repeatOnLifecycle` in Views. Flow also provides rich operators and can be used outside Android; LiveData is Android-specific.\n\n### Which data structure does LiveData use internally?\nAndroidX LiveData stores observers in a `SafeIterableMap`, conceptually mapping each `Observer` to an internal `ObserverWrapper` that tracks activity and lifecycle-related information. The map supports safe iteration while observers may be added or removed during notification.\n\n:::summary\n**Easy interview answer:**\n> A cold Flow starts its upstream work when collected, and each collector can trigger a separate execution. LiveData is an Android lifecycle-aware observable; active observers receive updates and lifecycle-bound observers are removed when destroyed. Internally, LiveData stores observers in a `SafeIterableMap`, associating each Observer with an ObserverWrapper so it can safely handle observer changes during iteration.\n:::"},{"id":"android-screenshot-testing-pipeline","section":"Android","difficulty":"Senior","tags":["Screenshot Testing","Compose","CI/CD","Testing"],"question":"How do you set up a pipeline for screenshot testing?","answer":"Screenshot testing renders a screen or component, captures an image, and compares it with an approved **baseline/golden image**.\n\n### 1. Create screenshot tests and baselines\nRender important Compose components or screens with deterministic test data. Capture an approved baseline and commit it, or store it somewhere CI can access consistently. Tools can include Compose Preview Screenshot Testing, Paparazzi, or another screenshot-testing framework.\n\n### 2. Run comparisons in CI\nRun screenshot tests as part of pull-request checks:\n```text\nPR → build/test target → render UI → capture screenshot\n   → compare with baseline → pass or fail\n```\n\nThe exact Gradle task depends on the selected framework.\n\n### 3. Make failures actionable\nWhen images differ, CI should upload the **expected image, actual image, and diff image** as artifacts. That lets developers inspect the visual change instead of seeing only a generic test failure.\n\nIf a UI change is intentional, review the diff first, then update and commit the baseline. Do not blindly update screenshots just to make CI green.\n\n### 4. Keep rendering deterministic\nUse a consistent device configuration, screen size, density, font scale, locale, theme, Android/API configuration, and test data. This reduces environment-related flakes.\n\nTest meaningful variations for important screens, such as light/dark theme, large text, long text, loading/error/success states, and different screen sizes. Focus on high-value screens and components so baseline maintenance stays manageable.\n\n:::summary\n**Easy interview answer:**\n> I create baseline screenshots for important screens or Compose components, then run screenshot tests on every PR. CI renders the UI and compares actual images with the baselines. On failure, it uploads expected, actual, and diff images for review. Intentional visual changes require review and an approved baseline update. I keep device settings and test data deterministic to reduce flaky results.\n:::"},{"id":"android-cicd-pipeline-setup","section":"Android","difficulty":"Senior","tags":["CI/CD","Gradle","Testing","Google Play"],"question":"How do you set up CI/CD pipelines in Android?","answer":"CI/CD automates **building, testing, and releasing** the Android app when code is pushed or a pull request is created. Common tools include GitHub Actions, GitLab CI, Jenkins, Bitbucket Pipelines, and CircleCI.\n\n### CI — validate changes before merge\nFor each pull request, run fast checks such as build, lint/static analysis, unit tests, and any required screenshot or UI tests:\n```text\nPull request → Build → Lint → Unit tests → Screenshot/UI tests → Pass or fail\n```\n\nFor example:\n```shell\n./gradlew lint\n./gradlew test\n./gradlew assembleDebug\n```\n\nFail required checks so broken changes are fixed before merge. Keep PR pipelines fast; move expensive tests to nightly or release pipelines when appropriate.\n\n### CD — create and deliver release artifacts\nAfter code is merged to a release branch, run the required checks, build a release artifact, sign it, and publish it to a testing track or production:\n```shell\n./gradlew bundleRelease\n```\n\nThis produces an Android App Bundle for distribution. A staged rollout can move from internal testing through QA and closed/open testing to production.\n\n### Protect signing credentials\nNever commit keystores, passwords, signing keys, or Play credentials to Git. Store them in the CI secret manager and make them available only to the appropriate release job.\n\n### Cache dependencies\nCache Gradle dependencies and other appropriate build outputs to reduce repeated downloads and shorten builds.\n\n### Include screenshot tests\nRun screenshot tests as a PR check when useful. If a comparison fails, upload expected, actual, and diff images as CI artifacts so the visual change can be reviewed.\n\n:::summary\n**Easy interview answer:**\n> On each PR, I run the Android build, lint, unit tests, and required screenshot or UI checks; failed checks block merging. After merge, a release pipeline builds and signs the AAB using secrets stored securely in CI, then publishes it to an appropriate Google Play track. I cache Gradle dependencies to reduce build time and keep PR checks fast.\n:::"},{"id":"android-room-datastore-sharedpreferences","section":"Android","difficulty":"Standard","tags":["Room","DataStore","SharedPreferences","Persistence"],"question":"Room Database vs DataStore — how is DataStore different from SharedPreferences?","answer":"These solve different problems:\n```text\nRoom              → structured or relational data\nDataStore         → small application settings/state\nSharedPreferences → older key-value storage\n```\n\n### Room — structured data and queries\nRoom is built on SQLite and is useful for larger datasets that need queries, relationships, transactions, partial updates, or offline caching, such as users, articles, messages, or transactions. It can expose database updates as Flow and act as a local source of truth.\n```kotlin\n@Entity\ndata class User(\n    @PrimaryKey val id: String,\n    val name: String,\n    val email: String\n)\n\n@Dao\ninterface UserDao {\n    @Query(\"SELECT * FROM User\")\n    fun getUsers(): Flow\u003cList\u003cUser>>\n\n    @Insert\n    suspend fun insert(user: User)\n}\n```\n\n### DataStore — small settings\nDataStore is designed for application preferences such as dark mode, language, or onboarding completion. Preferences DataStore uses typed keys and exposes data as Flow:\n```kotlin\nval DARK_MODE = booleanPreferencesKey(\"dark_mode\")\n\ndataStore.edit { preferences ->\n    preferences[DARK_MODE] = true\n}\n\nval darkMode: Flow\u003cBoolean> = dataStore.data.map { preferences ->\n    preferences[DARK_MODE] ?: false\n}\n```\n\nTyped DataStore can store strongly typed settings using a serializer, commonly with Protocol Buffers.\n\n### DataStore vs. SharedPreferences\nSharedPreferences is an older key-value API with synchronous-style reads and no native Flow. DataStore is a modern Jetpack API designed for asynchronous coroutine-based access, exposes Flow for observing changes, and provides transactional updates. It is a good replacement for many SharedPreferences use cases; existing legacy code may still use SharedPreferences.\n\n### What about sensitive data?\nNeither DataStore nor SharedPreferences is automatically secure storage. For sensitive values such as authentication secrets, use an appropriate secure-storage design, often involving Android Keystore.\n\n:::summary\n**Easy interview answer:**\n> I use Room for structured, queryable data such as offline articles or messages; it is backed by SQLite and supports queries and transactions. I use DataStore for small settings such as theme or language. DataStore is the modern coroutine/Flow-based option for many SharedPreferences use cases, with asynchronous access and transactional updates. I don't treat either preference store as secure storage for secrets.\n\n**Easy way to decide:**\nTables, queries, relationships → Room.\nSmall settings/preferences → DataStore.\nExisting legacy key-value preferences → SharedPreferences, with migration considered.\n:::"},{"id":"kotlin-flow-backpressure-strategies","section":"Kotlin","difficulty":"Senior","tags":["Flow","Backpressure","Coroutines"],"question":"How do you implement backpressure in Kotlin Flow?","answer":"Backpressure happens when the **producer emits values faster than the consumer can process them**. Kotlin Flow is sequential by default: `emit()` suspends while the collector processes a value, so the producer naturally waits. This is appropriate when every item matters, such as payment transactions.\n\n### `buffer()` — let producer and consumer work concurrently\n`buffer()` runs upstream and downstream in separate coroutines and lets values wait in a buffer. With the default suspending overflow behavior, values are not intentionally dropped; the producer suspends when the buffer fills.\n```kotlin\nflow\n    .buffer()\n    .collect { event -> upload(event) }\n```\n\nUse it when the consumer is temporarily slower but every value should be retained, such as analytics events awaiting upload.\n\n### `conflate()` — keep the latest pending value\n`conflate()` does not cancel the collector's current processing. While it is busy, intermediate pending values can be replaced by the latest one:\n```kotlin\nprogressFlow\n    .conflate()\n    .collect { progress -> renderProgress(progress) }\n```\n\nFor progress updates, finishing the current update and then processing the latest pending value may be enough.\n\n### `collectLatest()` — cancel previous processing\nWhen a new value arrives, `collectLatest()` cancels the previous collector action and starts processing the new value:\n```kotlin\nsearchQuery.collectLatest { query ->\n    loadSuggestions(query)\n}\n```\n\nThis is useful when old work becomes irrelevant, such as outdated search suggestions. Cancellation is cooperative, so the action needs to respond to cancellation.\n\n### `conflate()` vs. `collectLatest()`\n- `conflate()` → current processing continues; intermediate pending values may be skipped. Example: progress updates.\n- `collectLatest()` → current processing is cancelled when a new value arrives. Example: search results.\n\nUse normal collection or a suspending buffer when **every value must be processed**. Avoid conflation or cancellation for transactions or other operations that must complete.\n\n:::summary\n**Easy interview answer:**\n> Backpressure occurs when the producer is faster than the consumer. Flow handles it naturally because `emit()` suspends. I use `buffer()` when producer and consumer should work concurrently without dropping values, `conflate()` when only the latest pending value matters, and `collectLatest()` when new input makes the current processing obsolete. For important events such as transactions, every value must be processed.\n\n**Easy way to remember:**\nEvery value matters → sequential Flow or `buffer()`.\nLatest pending value matters → `conflate()`.\nOld processing is obsolete → `collectLatest()`.\n:::"},{"id":"android-reducer-mvi-state","section":"Android","difficulty":"Senior","tags":["MVI","Redux","Reducer","State Management"],"question":"What is a Reducer?","answer":"A **Reducer is a function that takes the current state and an action or result, then returns a new state**.\n\nThink of it as:\n```text\nCurrent State + User Action\n          ↓\n       Reducer\n          ↓\n        New State\n```\n\nFor example, a cart has two items totaling 1000. The user adds an item, and the reducer produces a new state with three items and a total of 1500.\n\nIn MVI, the flow can look like:\n```text\nUser clicks Apply Coupon\n        ↓\nApplyCoupon intent\n        ↓\nBusiness logic\n        ↓\nReducer combines old state and result\n        ↓\nNew state\n        ↓\nUI updates\n```\n\nA reducer normally does **not mutate the old state**. It creates a new one, for example:\n```kotlin\nfun reduce(state: CheckoutState, discount: Int): CheckoutState {\n    return state.copy(discount = discount)\n}\n```\n\nThis keeps state changes predictable: `Old State + Change → New State`.\n\n:::summary\n**Easy interview answer:**\n> A reducer takes the current state and an action or result and returns a new state. In MVI or Redux, it makes state updates predictable because changes follow a clear path. Reducers usually return a new immutable state rather than modifying the old one.\n\n**Easy way to remember:**\nOld State + Change → New State.\n:::"},{"id":"android-mvvm-mvi-redux-comparison","section":"Android","difficulty":"Senior","tags":["MVVM","MVI","Redux","State Management","Performance"],"question":"MVI vs MVVM vs MVI + Redux","answer":"The easiest way to compare them is by looking at **how UI state is managed**.\n\n### MVVM\nMVVM is simple and works well for most Android screens:\n```text\nUI → ViewModel → Repository\n```\n\nThe ViewModel holds UI state and exposes functions for user actions. A login screen, profile screen, settings screen, or ordinary list screen is often a good fit.\n\n### MVI\nMVI is useful when a screen has many related states and actions. It follows a more explicit flow:\n```text\nUser action → Intent → ViewModel/business logic → New State → UI\n```\n\nFor example, a checkout screen may coordinate cart, address, coupon, payment method, total, loading, and error state. Each action produces a new state, which can make complex screens easier to reason about and debug.\n\n### MVI with Redux-style shared Store\nA Redux-style approach introduces a shared Store so multiple screens can use common state. For example, adding a product may update the product screen, cart badge, cart screen, and checkout total. This can help with genuinely shared app state, but adds concepts such as actions, reducers, store, and middleware.\n\n### When can MVI be over-engineering?\nFor a simple profile screen with a few fields and an edit action, MVVM may express the behavior with much less code. Use the simplest pattern that manages the screen's state clearly.\n\n### Immutable state and performance\nData-class `copy()` is a **shallow copy**: it creates a new outer state object but reuses unchanged nested references. That is usually inexpensive. More important is avoiding huge state updates at very high frequency; isolate frequently changing state so only UI that needs it observes it.\n\n:::summary\n**Easy interview answer:**\n> I use MVVM for most normal Android screens because it is simple. I use MVI when a screen has many related states and actions, because the explicit action-to-new-state flow is predictable. A Redux-style shared Store is useful when multiple screens need common state, but it adds complexity. I avoid MVI for trivial screens when MVVM is enough. Data-class `copy()` is shallow; the bigger performance concern is updating large state too frequently and triggering unnecessary recomposition.\n:::"},{"id":"android-repository-multilayer-caching","section":"Android","difficulty":"Senior","tags":["Repository Pattern","Caching","Room","Flow","TTL","Offline First"],"question":"Repository Pattern with Multi-Layer Caching","answer":"The **Repository is the single place that decides where data comes from**. The UI and ViewModel should not need to know whether data came from memory, disk/Room, or the network.\n\nA common cache priority is:\n```text\nMemory → Disk/Room → Network\nFastest                 Slowest\n```\n\nOn a cache miss or stale value, the Repository checks the next layer. Network results are saved to disk and memory before being returned. This avoids unnecessary network calls and lets repeated reads use faster data.\n\n### TTL and cache invalidation\nTTL (Time To Live) defines how long cached data is considered fresh. Different data can use different TTLs—for example, a news feed might be fresh for minutes while app configuration may last much longer.\n\nTTL is not the only invalidation strategy:\n- **Time-based:** refresh when TTL expires.\n- **Event-based:** invalidate or update after a known change, such as a profile edit.\n- **Manual refresh:** bypass freshness checks after pull-to-refresh.\n- **Server-based:** use versions, ETags, or Last-Modified metadata when available.\n\n### Room and Flow: stale-while-revalidate\nFor persistent application data, Room is often the source of truth. The UI observes Room through Flow. It can render cached data immediately while the Repository checks freshness and refreshes from the network. Saving the response to Room causes the Flow to emit the updated data to the UI.\n\n```text\nRoom cache → Flow → ViewModel → UI immediately\n                         ↑\nNetwork refresh → save to Room → Flow emits fresh data\n```\n\nA memory cache can sit above Room when profiling shows frequent reads benefit from it, but Room alone is sufficient for many use cases.\n\n### Network failures\nIf a refresh fails, keep showing existing cached data when appropriate and report the refresh error separately. Retry later rather than replacing useful offline data with an empty screen.\n\n:::summary\n**Easy interview answer:**\n> The Repository hides the data source and applies the cache policy. I check memory, then Room, then the network as needed. TTL and explicit events determine freshness, while Room can be the source of truth observed by the UI through Flow. The UI can show cached data immediately as the network refreshes Room, and a network failure does not have to discard cached content. I add memory caching only when measurement shows it helps.\n\n**Easy way to remember:**\nMemory → Room → Network.\nRoom emits → UI updates.\nRefresh failure → keep usable cached data.\n:::"},{"id":"android-classloader-dynamic-feature-runtime","section":"Android","difficulty":"Staff","tags":["ClassLoader","DEX","Dynamic Feature","Multi-Module"],"question":"How does the Android ClassLoader hierarchy work in a multi-module app? How do Dynamic Feature Modules load classes at runtime?","answer":"A **ClassLoader finds and loads a class when the app needs it**. Android app code is compiled into DEX files, which the application ClassLoader loads. A simplified view is that application class loading delegates to parent/platform class loaders for framework classes, then loads app code from the app's DEX files. You normally do not manage this hierarchy yourself.\n\n### Normal multi-module apps\nGradle modules such as `:feature-home`, `:feature-profile`, and `:core-network` are primarily **build-time boundaries**. They control source organization and dependency visibility, but they do not normally get separate ClassLoaders at runtime. Their code is packaged into the app and loaded through the app's class-loading setup.\n\n```text\nGradle modules → build/package → DEX → app ClassLoader\n```\n\n### Dynamic Feature Modules\nA Dynamic Feature differs because its code may not be installed with the base app initially. When requested, Play Feature Delivery installs the feature's split containing its DEX and resources. After installation completes, the app can use the feature's classes.\n\n```text\nBase app installed\n        ↓\nUser requests feature\n        ↓\nCheck/install Dynamic Feature\n        ↓\nFeature split and DEX become available\n        ↓\nNavigate to feature classes\n```\n\nThe base app must not assume a dynamic feature class is available before installation. Check installation state, request installation if needed, and only then navigate or load feature code.\n\n### How does this relate to DI?\nA Dynamic Feature may need dependencies owned by the base app, such as repositories or analytics. Expose only the needed dependencies through an agreed contract or DI EntryPoint. This is a dependency-injection boundary, not a separate Gradle module ClassLoader.\n\nThe key distinction is:\n```text\nGradle dependency → which module can access another at build time\nClassLoader       → where a class is found and loaded at runtime\n```\n\n:::summary\n**Easy interview answer:**\n> A ClassLoader loads classes at runtime from DEX. Normal Gradle modules are build-time boundaries and do not usually have separate ClassLoaders; their packaged code is loaded as app code. A Dynamic Feature may not be installed initially. After Android installs its split and DEX, its classes become available, so the app must wait for installation before using them.\n:::"},{"id":"android-lifecycle-process-death-saved-state","section":"Android","difficulty":"Senior","tags":["Lifecycle","Process Death","ViewModel","SavedStateHandle"],"question":"How does the Activity/Fragment lifecycle relate to process death? What is saved/restored, and how does SavedStateHandle differ from onSaveInstanceState?","answer":"The key distinction is:\n> **A ViewModel survives configuration changes, but it does not survive process death.**\n\n### Rotation versus process death\nDuring a configuration change such as rotation, the Activity and Fragment views are recreated, but the ViewModel is retained. If Android kills the app process, all in-memory objects are gone: Activity, Fragment, ViewModel, singletons, and memory caches. Returning to the app creates new instances.\n\n### What can Android restore?\nAndroid can restore saved View hierarchy state and small app-provided state, such as text or selection, Fragment arguments, and navigation/back-stack state. For custom Activity or Fragment state, use `onSaveInstanceState()` and restore from the saved Bundle:\n```kotlin\noverride fun onSaveInstanceState(outState: Bundle) {\n    outState.putString(\"query\", searchQuery)\n    super.onSaveInstanceState(outState)\n}\n\nval query = savedInstanceState?.getString(\"query\")\n```\n\nAndroid does not serialize the whole Activity, Fragment, ViewModel, repository, or in-memory object graph. After process death, FragmentManager may restore Fragment instances and back stack by creating new objects and restoring saved state; the old Fragment objects do not survive.\n\n### How `SavedStateHandle` fits\nA normal ViewModel property survives rotation with its ViewModel but is lost on process death. `SavedStateHandle` makes small saved values available inside a ViewModel:\n```kotlin\nclass SearchViewModel(\n    private val savedStateHandle: SavedStateHandle\n) : ViewModel() {\n    var query: String?\n        get() = savedStateHandle[\"query\"]\n        set(value) { savedStateHandle[\"query\"] = value }\n}\n```\n\nAfter process death, the old ViewModel is gone. Android creates a new ViewModel and restores the handle's saved values when saved state is available.\n\nThe main difference is where state is accessed: `onSaveInstanceState()` works with Activity/Fragment saved state, while `SavedStateHandle` exposes saved state to a ViewModel. Both are for small, restorable values.\n\n### What should we save?\nSave enough information to reconstruct the screen, such as a user or article ID, search query, selected tab, filter, or sort option. Avoid saving Bitmaps, huge lists, full API responses, or large object graphs. Restore an ID and reload the actual data from Room or the API. Use Room, DataStore, or files for durable data.\n\n:::summary\n**Easy interview answer:**\n> During rotation, the Activity and Fragment are recreated but the ViewModel survives. During process death, all in-memory objects, including the ViewModel, are destroyed. Android may restore small saved state. `onSaveInstanceState()` handles it at the Activity/Fragment level; `SavedStateHandle` exposes it to a ViewModel. After process death a new ViewModel is created with restored values. I save IDs and small UI state, then reload large data from persistent storage or the network.\n:::"},{"id":"modular-cross-feature-communication-patterns","section":"Multi-Module","difficulty":"Senior","tags":["Mediator","Interface Contracts","Event Bus","SharedFlow"],"question":"How do you handle cross-feature communication in a strictly modularized architecture without creating god-modules? Explain the mediator pattern, event bus trade-offs, and interface-based contracts.","answer":"In a strictly modularized app, **avoid direct feature-to-feature dependencies**. Prefer small, explicit communication contracts and put integration in an app/composition layer.\n\n### 1. Interface-based contracts\nIf Home needs to open Profile, Home should depend on a small contract, not on the Profile implementation:\n```kotlin\ninterface ProfileNavigator {\n    fun openProfile(userId: String)\n}\n\nclass HomeViewModel(\n    private val profileNavigator: ProfileNavigator\n) : ViewModel() {\n    fun onProfileClicked(userId: String) {\n        profileNavigator.openProfile(userId)\n    }\n}\n```\n\nA contract module defines `ProfileNavigator`; Home uses it; the app/integration layer implements it and connects to the Profile screen. Home does not need to know Profile's implementation. Keep these contracts small and domain-focused.\n\n### 2. Mediator pattern\nUse a mediator or coordinator when one workflow must coordinate multiple features. For example, payment success may refresh a subscription and then navigate to premium content. Payment calls one contract:\n```kotlin\ninterface PurchaseMediator {\n    suspend fun purchaseCompleted(purchaseId: String)\n}\n```\n\nThe app/integration layer implements the workflow and coordinates the required repositories or navigation contracts. This avoids making Payment depend directly on Subscription, Home, and Premium.\n\n> **The mediator knows the workflow; individual features do not need to know about each other.**\n\n### 3. Event bus / SharedFlow\nUse an event bus for genuinely broadcast-style notifications, such as `UserLoggedOut`, `SubscriptionChanged`, or `ThemeChanged`. A `SharedFlow` can publish an event to active collectors:\n```kotlin\nsealed interface AppEvent {\n    data object SubscriptionUpdated : AppEvent\n}\n\nclass AppEventBus {\n    private val _events = MutableSharedFlow\u003cAppEvent>()\n    val events = _events.asSharedFlow()\n\n    suspend fun send(event: AppEvent) {\n        _events.emit(event)\n    }\n}\n```\n\nThis reduces direct knowledge of listeners, but it can hide dependencies and ordering. With default `replay = 0`, events emitted while nobody is collecting may be missed. Define replay, buffering, lifecycle collection, and delivery expectations deliberately. Avoid using an event bus for every ordinary request/response interaction.\n\n### Avoid a god module\nDo not put every interface, repository, analytics service, database, and feature contract into one huge `core` module. Split shared code into focused modules such as `core-network`, `core-database`, `core-analytics`, `profile-contract`, and `payment-contract`. Share normal business data through an appropriate domain/data contract rather than broadcasting every state change.\n\n### Which approach should I use?\n- One feature needs a capability from another area → **interface contract**.\n- A workflow coordinates multiple features → **mediator/coordinator**.\n- Many independent listeners need the same notification → **event / SharedFlow**.\n- Shared business data → **focused domain/repository abstraction**.\n\n:::summary\n**Easy interview answer:**\n> I avoid direct feature-to-feature dependencies and define small interfaces in focused contract modules. The app or integration layer implements those contracts. I use a mediator for workflows spanning multiple features and SharedFlow only for true broadcast events, because event buses can hide dependencies and lose events when no collector is active. I keep shared modules domain-focused rather than creating one god module.\n:::"},{"id":"android-startactivity-process-launch","question":"What happens between calling startActivity() and the new Activity's onCreate()? Explain AMS, Zygote, and the application process.","section":"Android","difficulty":"Staff","tags":["Activity","AMS","ATMS","Zygote","Binder","ActivityThread","Android Internals"],"answer":"The key point is that `startActivity()` does **not directly create the Activity**. The request goes from the app process to Android's system process using Binder IPC.\n\n### 1. We call `startActivity()`\n```kotlin\nval intent = Intent(this, DetailActivity::class.java)\nstartActivity(intent)\n```\n\nThe current Activity does not call `DetailActivity()` itself. Android manages Activity creation:\n```text\nApp → startActivity() → Android System\n```\n\n### 2. The request goes to the Android system\nThe request crosses from the application process to the system process using **Binder IPC**. System-side Activity and task management processes it.\n\nOn modern Android, **ActivityTaskManagerService (ATMS)** handles much of Activity/task launch management, while **ActivityManagerService (AMS)** manages broader application and process lifecycle responsibilities. They are part of the system-server machinery.\n\n### 3. Android resolves the Activity\nThe system checks which Activity handles the Intent, whether it is allowed/exported, which task and launch mode apply, and which process should run it.\n\n### 4. If the application process already exists\nThe system reuses the running process; no new Zygote fork is needed:\n```text\nstartActivity() → Binder IPC → System Server / ATMS\n              → existing app process → ActivityThread → Activity launch\n```\n\n### 5. If the application process does not exist\nAndroid asks **Zygote**, a preloaded Android process, to fork a new application process. This is more efficient than starting every app process from scratch.\n```text\nZygote\n  ├── App Process\n  └── Another App Process\n```\n\n### 6. The application process starts\nThe new process initializes the application runtime. `ActivityThread` is the app-side controller that receives lifecycle instructions and works with the main thread and its Looper; despite its name, it is **not itself a Thread**. The Application is created and initialized before the requested Activity is launched.\n\n### 7. Android launches the Activity\nThe system sends the launch request to the app process. `ActivityThread` creates and attaches the Activity, then lifecycle callbacks run on the main thread:\n```text\nSystem Server → Binder → Application Process → ActivityThread\n             → create Activity → onCreate() → onStart() → onResume()\n```\n\n### Responsibilities\n- `startActivity()` requests an Activity launch.\n- Binder carries IPC between the app and Android system.\n- ATMS manages Activity/task launch decisions; AMS manages broader process lifecycle.\n- Zygote forks a process when the target app process is absent.\n- `ActivityThread` handles app-side launch and lifecycle instructions.\n- The main thread runs callbacks such as `onCreate()`. \n\n### Example: launching Gmail\nIf Gmail's process is absent, Android asks Zygote to create it, initializes the app, and then launches the requested Gmail Activity. If Gmail's process is already running, Android reuses it and launches the Activity without creating a new process.\n\n:::summary\n**Easy interview answer:**\n> `startActivity()` sends a request through Binder to Android's system services; it does not instantiate the Activity itself. The system resolves the Activity and checks whether its app process exists. If it does, that process is reused. If not, Zygote forks a new process. The app initializes through ActivityThread, then receives the Activity launch request. ActivityThread creates the Activity, and `onCreate()` runs on the main thread.\n:::"},{"id":"android-certificate-pinning-rotation","section":"Android","difficulty":"Senior","tags":["Security","Certificate Pinning","OkHttp","TLS"],"question":"How do you implement certificate pinning in Android? What's the difference between pin-based and hash-based approaches? How do you handle pin rotation without app updates?","answer":"### Easy interview points\n\n- Certificate pinning means the app verifies the server against a **known certificate/public-key pin** in addition to normal HTTPS validation.\n- In Android, we commonly implement it using **OkHttp `CertificatePinner`**.\n- The trusted pins are usually **bundled in the app**. That's okay because pins are not secrets.\n- Pinning the **whole certificate** is more fragile because certificates expire and change.\n- Prefer pinning the **SHA-256 hash of the public key/SPKI**.\n- For rotation, ship **current + backup pin**.\n- This lets the server rotate to the backup key without requiring an immediate app update.\n\n---\n\n## 1. How do you implement certificate pinning?\nWith OkHttp:\n\n```kotlin\nval certificatePinner = CertificatePinner.Builder()\n    .add(\n        \"api.example.com\",\n        \"sha256/CURRENT_PUBLIC_KEY_HASH\"\n    )\n    .add(\n        \"api.example.com\",\n        \"sha256/BACKUP_PUBLIC_KEY_HASH\"\n    )\n    .build()\n\nval client = OkHttpClient.Builder()\n    .certificatePinner(certificatePinner)\n    .build()\n```\n\nWhen connecting:\n\n```text\nApp\n ↓\nNormal HTTPS validation\n ↓\nGet server certificate\n ↓\nCalculate/check public-key hash\n ↓\nMatches Current OR Backup pin?\n     ↓\n YES     NO\n  ↓       ↓\nAllow   Reject\n```\n\nThe pins are normally shipped with the application.\n\nThey are **not passwords or private keys**, so they don't need to be secret.\n\n---\n\n## 2. Certificate pin vs hash/public-key pin\n\n### Certificate pinning\nYou trust a specific certificate.\n\n```text\nApp trusts\n    ↓\nCertificate A\n```\n\nSuppose that certificate expires:\n\n```text\nCertificate A\n     ↓\nExpires\n     ↓\nCertificate B\n     ↓\nOld pin may fail ❌\n```\n\nEven though the server is legitimate.\n\n### Public-key hash pinning\nInstead, pin the SHA-256 hash of the certificate's **public key/SPKI**.\n\n```text\nCertificate\n     ↓\nPublic Key\n     ↓\nSHA-256\n     ↓\nPin\n```\n\nIf the certificate is renewed using the same key:\n\n```text\nOld Certificate ──┐\n                  ├── Same Public Key\nNew Certificate ──┘\n                         ↓\n                     Same Pin ✅\n```\n\nThat's why public-key/SPKI hash pinning is generally preferred.\n\n---\n\n## 3. How do you rotate pins without an app update?\nDon't ship only one pin.\n\n### Bad\n\n```text\nApp trusts → A\n\nServer → A\n```\n\nIf the server changes to B:\n\n```text\nApp trusts → A\nServer     → B\n\nConnection fails ❌\n```\n\n### Better: Current + Backup\nShip:\n\n```text\nApp trusts:\n\nCurrent → A\nBackup  → B\n```\n\nInitially:\n\n```text\nApp    → A + B\nServer → A\n\n✅\n```\n\nLater backend rotates:\n\n```text\nApp    → A + B\nServer → B\n\n✅\n```\n\nNo immediate app update is needed because **B was already trusted by the installed app**.\n\nThen the next app release contains:\n\n```text\nApp V1 → A + B\n           ↓\nServer     B\n           ↓\nApp V2 → B + C\n```\n\nThis gives continuous rotation:\n\n```text\nA + B\n  ↓\nB + C\n  ↓\nC + D\n```\n\n---\n\n## Real-world example\nImagine our banking API uses public key **A**.\n\nWe release:\n\n```text\nBanking App v1\n\nCurrent Pin = A\nBackup Pin  = B\n```\n\nSix months later the certificate/key needs rotation.\n\nBackend changes:\n\n```text\nServer\n\nA → B\n```\n\nExisting users don't need to immediately update the app because:\n\n```text\nInstalled App → trusts A + B\nServer        → uses B\n\nConnection works ✅\n```\n\nThe next app version ships:\n\n```text\nCurrent = B\nBackup  = C\n```\n\nNow we're ready for the next rotation.\n\n---\n\n## Easy interview answer\n\n> **I can implement certificate pinning in Android using OkHttp's `CertificatePinner`. The app contains the expected server public-key hashes and rejects the connection if the server doesn't match one of those pins.**\n> \n> **I prefer pinning the SHA-256 hash of the public key/SPKI rather than the complete certificate because certificates can expire or be renewed.**\n> \n> **For rotation, I ship a current pin and a backup pin. For example, the app trusts A and B while the server uses A. Later the server can move to B without requiring an immediate app update. The next app version then ships B and C.**"}];

      id: "coroutine-context-state-machine",

      question: "What is Coroutine Context and State Machine? How do coroutines work internally?",
      answer: "**CoroutineContext is the configuration of a coroutine.** It tells the coroutine how to run and manages its lifecycle. It can also contain a name or an exception handler.\n\nCommon elements are:\n\n- `Job` — controls coroutine lifecycle and cancellation.\n- `CoroutineDispatcher` — determines where coroutine execution happens.\n- `CoroutineName` — gives the coroutine a name, useful for debugging.\n- `CoroutineExceptionHandler` — handles uncaught exceptions.\n\n### 2. What is a Continuation?\nA `Continuation` represents **where the coroutine should continue execution after suspension**.\n\nWhen a coroutine suspends, Kotlin needs to remember:\n\n- where execution stopped\n- local variables\n- what code should execute next\n- the coroutine's context\nThat information is represented through a **Continuation**.\n\n### 3. What is a Coroutine State Machine?\nA `suspend` function is transformed by the Kotlin compiler into a **state machine**.\n\nFor example:\n\n```\nsuspend fun loadData() {\n    val user = getUser()\n    val posts = getPosts(user)\n    show(posts)\n}\n```\n\nConceptually:\n\n```\nSTATE 0\n  ↓\ngetUser()\n  ↓\nSTATE 1\n  ↓\ngetPosts()\n  ↓\nSTATE 2\n  ↓\nshow()\n  ↓\nCOMPLETED\n```\n\nEach suspension point becomes a state.\n\n### 4. How does suspension work internally?\nWhen the coroutine reaches a suspension point:\n\n```\nExecute\n   ↓\nSuspension point\n   ↓\nSave state in Continuation\n   ↓\nReturn COROUTINE_SUSPENDED\n   ↓\nThread is free\n```\n\nThe important point is:\n\n> **The coroutine suspends, not the thread.**\nWhen the asynchronous operation finishes:\n\n```\nOperation completes\n   ↓\nContinuation.resume()\n   ↓\nDispatcher schedules execution\n   ↓\nState machine resumes\n   ↓\nContinue from where it stopped\n```\n\nFor example, inside a ViewModel:\n```kotlin\nviewModelScope.launch(Dispatchers.IO) {\n    fetchUser()\n}\n```\n\nHere:\n- `Dispatchers.IO` selects the dispatcher used to run the coroutine.\n- `Job` manages lifecycle and cancellation. `launch` creates a child Job, cancelled when `viewModelScope` is cancelled.\n- `CoroutineName` and `CoroutineExceptionHandler` are other possible context elements.\n\nNow suppose we have:\n```kotlin\nsuspend fun fetchUser() {\n    val user = api.getUser()      // suspension point\n    val posts = api.getPosts()    // suspension point\n    showData(user, posts)\n}\n```\n\nInternally, Kotlin converts this into a state machine:\n```text\nState 0: call getUser()\n         suspend\n\nState 1: user received; call getPosts()\n         suspend\n\nState 2: posts received; showData()\n```\n\nWhen `getUser()` is waiting for the network response, **the thread is not blocked**. The coroutine suspends, and Kotlin remembers:\n> I stopped after `getUser()`. When the result comes back, continue from here.\n\nA **Continuation** stores the current state and local values needed to resume. When the network response arrives, it resumes with the result or an exception.\n\n:::summary\n**Easy way to remember:**\n- **CoroutineContext** = how and where the coroutine runs.\n- **Continuation** = remembers where to resume.\n- **State Machine** = represents the different stages of the suspend function.\n- **Coroutine** = suspends instead of blocking the thread.\n:::\n\n**Extra interview point:** `suspend` alone does not switch threads. The dispatcher controls where coroutine code runs; use `withContext` when you need to change dispatchers."
    }, {
      id: "finite-state-machine-coroutines",

      question: "What is a Finite State Machine in coroutines?",
      answer: "A **Finite State Machine (FSM)** means something can be in a limited number of states and moves from one state to another based on an event.\n\nIn coroutines, the Kotlin compiler converts a `suspend` function into a state machine where **each suspension point represents a state**.\n\nFor example:\n```kotlin\nsuspend fun fetchData() {\n    val user = getUser()       // suspension point\n    val posts = getPosts(user) // suspension point\n    showData(posts)\n}\n```\n\nYou can imagine it as:\n```text\nState 0: call getUser()\n         suspend\n\nState 1: user received; call getPosts()\n         suspend\n\nState 2: posts received; call showData()\n         complete\n```\n\nThe coroutine's **Continuation remembers the current state**. If `getUser()` suspends, it resumes at the next state instead of starting the function again.\n\n:::summary\n**Easy way to remember:**\n**FSM = Kotlin breaks a suspend function into states so the coroutine knows where to continue after suspension.**\n:::"

      section: "Coroutines",

      question: "How does structured concurrency prevent resource leaks? What happens when a parent coroutine is cancelled?",
      answer: "**Structured concurrency** means child coroutines are tied to the lifecycle of their parent. A parent does not complete until its children complete, and cancelling the parent also cancels its children.\n\nFor example:\n```kotlin\nviewModelScope.launch {          // Parent\n    launch { fetchUser() }       // Child 1\n    launch { fetchArticles() }   // Child 2\n}\n```\n\nIf the ViewModel is cleared, cancellation flows down the Job hierarchy:\n```text\nviewModelScope cancelled\n        ↓\nParent Job cancelled\n        ↓\nChild 1 cancelled\nChild 2 cancelled\n```\n\nEvery coroutine has a `Job`, and child Jobs are linked to their parent. This ties work to the lifetime of the component that owns it, so requests and other work do not keep running after that component is gone.\n\nCancellation is **cooperative**. Suspending functions such as `delay()` check for cancellation and throw a `CancellationException`. A `finally` block can then release resources:\n```kotlin\nviewModelScope.launch {\n    try {\n        fetchData()\n    } finally {\n        closeResource()\n    }\n}\n```\n\n:::summary\n**Easy way to explain it:**\n> The parent owns its children and waits for them. Cancelling the parent propagates cancellation down the Job hierarchy. Children stop cooperatively, and `finally` blocks can clean up resources. This prevents work from outliving the component that started it.\n:::\n\nThink about it as a **parent with two children**:\n```text\nParent Coroutine\n   ├── Child A\n   └── Child B\n```\n\nThere are two different situations.\n\n### 1. Parent is cancelled → all children are cancelled\n```text\nParent ❌\n   ↓\n   ├── Child A ❌\n   └── Child B ❌\n```\n\nFor example:\n```kotlin\nviewModelScope.launch {\n    launch { fetchUser() }\n    launch { fetchArticles() }\n}\n```\n\nIf the parent is cancelled, both `fetchUser()` and `fetchArticles()` are cancelled. This is **downward cancellation**.\n\n### 2. A child fails → normally the whole family is cancelled\nSuppose Child A throws an exception:\n```text\nParent\n   ├── Child A 💥\n   └── Child B\n```\n\nWith a normal `Job`, Child A's failure propagates **up to the parent**. The parent gets cancelled, which then cancels Child B:\n```text\nChild A 💥\n    ↑\n Parent ❌\n    ↓\n Child B ❌\n```\n\n### What does `SupervisorJob` change?\nA `SupervisorJob` says:\n> **If one child fails, don't cancel the other children.**\n\n```text\nSupervisorJob\n   ├── Child A 💥\n   └── Child B ✅ keeps running\n```\n\nFor example:\n```kotlin\nsupervisorScope {\n    launch {\n        fetchUser()       // fails 💥\n    }\n\n    launch {\n        fetchArticles()   // keeps running ✅\n    }\n}\n```\n\nBut if the **supervisor itself is cancelled**, both children are still cancelled:\n```text\nSupervisor ❌\n     ↓\n ├── Child A ❌\n └── Child B ❌\n```\n\n### Easy interview explanation\n> **With a normal Job, if the parent is cancelled, all children are cancelled. If one child fails, that failure goes to the parent, which can cancel the other children as well.**\n>\n> **With SupervisorJob, one child's failure doesn't affect its siblings. But cancelling the parent still cancels all children.**\n\nSo remember:\n```text\nNormal Job\nChild fails → Parent cancelled → Siblings cancelled\n\nSupervisorJob\nChild fails → Other children continue\n\nBoth\nParent cancelled → All children cancelled\n```"
    });

endent UI operations benefit from supervision. `viewModelScope` already uses a `SupervisorJob`. Supervision changes failure propagation; it does not handle exceptions.\n:::"

      answer: "The simple difference is:\n> **`launch` is used when we don't need a result. `async` is used when we need a result.**\n\n### `launch`\n`launch` returns a `Job`:\n```kotlin\nlaunch {\n    throw Exception(\"Error\")\n}\n```\n\nIf an exception is not handled, it propagates to the parent. With a normal `Job`, the parent is cancelled, which can cancel sibling coroutines:\n```text\nChild 💥\n   ↓\nParent cancelled\n   ↓\nOther children cancelled\n```\n\n### `async`\n`async` returns a `Deferred`, which eventually contains a result or an exception. Calling `await()` returns the result or throws that exception:\n```kotlin\nval user = async {\n    getUser()\n}\n\ntry {\n    val result = user.await()\n} catch (e: Exception) {\n    // Handle the error\n}\n```\n\nA key senior-level point: even though `async` exposes the exception through `await()`, a failure in a normal parent scope can still cancel the parent and its other children:\n```kotlin\ncoroutineScope {\n    async { getUser() }     // fails\n    launch { getPosts() }   // can be cancelled\n}\n```\n\nWith `supervisorScope`, one child's failure does not automatically cancel its siblings:\n```kotlin\nsupervisorScope {\n    async { getUser() }     // fails\n    launch { getPosts() }   // continues\n}\n```\n\n:::summary\n**Easy interview answer:**\n> `launch` is for work without a result; `async` is for work that returns a result through `await()`. With a normal `Job`, a child failure can propagate to the parent and cancel sibling coroutines. With a `SupervisorJob`, one child's failure does not cancel its siblings.\n:::"

      question: "How does CoroutineDispatcher differ from Java's Executor?",
      answer: "Both decide **where work should run**, but `CoroutineDispatcher` is designed for coroutines.\n\nA Java `Executor` says, \"Run this task on one of my threads.\"\n```java\nexecutor.execute(() -> doSomething());\n```\n\nA `CoroutineDispatcher` says:\n> **“Run/resume this coroutine on the appropriate thread.”**\n\n```kotlin\nlaunch(Dispatchers.IO) {\n    doSomething()\n}\n```\n\nA coroutine can suspend and later resume, and its dispatcher determines where that continuation executes. An `Executor` runs tasks; it is not itself coroutine-aware, though an executor can be adapted to a dispatcher.\n\n### What is thread confinement?\nThread confinement means **restricting work to a particular thread**. Android UI updates must happen on the Main thread:\n```kotlin\nwithContext(Dispatchers.Main) {\n    textView.text = \"Hello\"\n}\n```\n\n### `Dispatchers.Main` vs. `Dispatchers.Main.immediate`\nIf execution is already on Main, `Dispatchers.Main` may dispatch the work through the Main queue. `Dispatchers.Main.immediate` can run it immediately instead of dispatching again:\n```kotlin\nwithContext(Dispatchers.Main.immediate) {\n    updateUI()\n}\n```\n\nIf execution is not on Main, both dispatch to the Main thread.\n\n:::summary\n**Easy interview answer:**\n> Java `Executor` executes tasks on threads. `CoroutineDispatcher` is coroutine-aware and determines where coroutine work runs and resumes after suspension. Thread confinement restricts work to a thread, such as UI work on Main. `Main.immediate` can skip an extra dispatch when already on Main.\n:::"

ther feature requests its contract.\n\n### Dependency structure\n```text\n                    Core / Navigation\n              HomeNavigator  ProfileNavigator\n                    ↑                 ↑\n                    |                 |\n             Feature Home       Feature Profile\n                    \                 /\n                     \               /\n                           App\n                       AppNavigator\n                 implements both contracts\n                      + Hilt bindings\n```\n\nThe Gradle dependencies point inward to Core; App depends on both features:\n```kotlin\n// app/build.gradle.kts\ndependencies {\n    implementation(project(\":feature-home\"))\n    implementation(project(\":feature-profile\"))\n    implementation(project(\":core-navigation\"))\n}\n```\n\nEach feature depends only on the navigation contract module:\n```kotlin\n// feature-home and feature-profile\ndependencies {\n    implementation(project(\":core-navigation\"))\n}\n```\n\nThere is no direct `Feature Home → Feature Profile` or `Feature Profile → Feature Home` dependency.\n\n:::summary\n**Easy interview answer:**\n> I don't make feature modules depend on each other. I define navigation contracts in a shared core/navigation module. Each feature depends only on those contracts, and the App module implements and binds them with Hilt because it knows about both features. The App then performs navigation. This breaks the circular dependency and keeps features independent.\n\n**Easy way to remember:**\nInterface in Core → Used by each Feature → Implemented by App → App opens the other Feature.\n:::"

    starterQuestions.push({
      id: "gradle-api-vs-implementation",
      section: "Multi-Module",
      difficulty: "Senior",
      tags: ["Gradle", "Build Performance"],
      question: "Explain api vs implementation dependency in Gradle. What are the build performance and encapsulation trade-offs? When does leaking a transitive dependency become dangerous?",
      answer: "The simplest difference is:\n> **`implementation` keeps a dependency private to my module. `api` also exposes it to modules using my module.**\n\nSuppose the dependency graph is:\n```text\nApp\n ↓\nFeature A\n ↓\nCore\n```\n\n### `implementation`\n```kotlin\n// Feature A\ndependencies {\n    implementation(project(\":core\"))\n}\n```\n\nFeature A can use Core, but App cannot access Core through Feature A. If App also needs Core, App should declare it directly. This gives better **encapsulation**.\n\n### `api`\n```kotlin\n// Feature A\ndependencies {\n    api(project(\":core\"))\n}\n```\n\nNow Core is exposed to consumers of Feature A, so App can use Core without declaring it directly.\n\n### Why prefer `implementation`?\nWith `implementation`, consumers don't see the dependency on their compile classpath. This hides internal details, reduces unnecessary compile classpath entries, and can improve build performance because internal dependency changes are less likely to trigger recompilation of consumers.\n\n### When should we use `api`?\nUse `api` when the dependency is intentionally part of the module's public API. For example, if a public Feature A function returns a `User` type from Core, consumers need to see that type:\n```kotlin\n// Core\ndata class User(val name: String)\n\n// Feature A public API\nclass UserRepository {\n    fun getUser(): User = TODO()\n}\n```\n\n### When is transitive dependency leakage dangerous?\nSuppose Feature A exposes Retrofit with `api`. App may start using Retrofit without declaring it directly. If Feature A later replaces Retrofit with Ktor, App can break because it depended on an implementation detail indirectly.\n\n:::summary\n**Easy interview answer:**\n> `implementation` keeps a dependency private, while `api` exposes it to consumers. I generally prefer `implementation` for encapsulation, a smaller compile classpath, and better build performance. I use `api` when dependency types are part of my public contract. Leakage is dangerous when a consumer starts relying on an indirectly exposed dependency, because changing that dependency can break the consumer.\n\n**Easy way to remember:**\n`implementation` = “This is my dependency.”\n`api` = “This is my dependency, and I'm exposing it to you too.”\n:::"
    });

      question: "How would you design a plugin-based architecture where feature modules can be loaded dynamically? What are the DI challenges?",
      answer: "I would design it so the **Base App can run independently**, and Dynamic Feature Modules are downloaded only when required.\n\nFor example, Chat is a Dynamic Feature:\n```text\n:core\n:app\n:feature-chat  ← Dynamic Feature\n```\n\nThe dependency direction is:\n```text\nfeature-chat → app → core\n```\n\nThe Base App must work without Chat. The user can install the App first and download Chat later. If App directly depended on Chat, it would expect Chat's code to be present as a normal dependency. Instead, the Dynamic Feature extends the already installed Base App and can use its code and resources.\n\n### Where do the classes live?\n```text\n:core\n├── Analytics interface\n├── UserRepository interface\n└── ApiService interface\n       ↑\n:app\n├── AnalyticsImpl\n├── UserRepositoryImpl\n├── ApiServiceImpl\n├── Main Hilt graph\n└── ChatDependencies EntryPoint\n       ↑\n:feature-chat\n├── ChatRepository\n├── ChatViewModel\n└── Chat UI\n```\n\nCore contains shared contracts. App contains common implementations and the main DI graph. The Dynamic Feature contains feature-specific code.\n\nFor example, Core defines a contract:\n```kotlin\ninterface Analytics {\n    fun track(event: String)\n}\n```\n\nApp provides the implementation and Hilt binding:\n```kotlin\nclass AnalyticsImpl @Inject constructor() : Analytics {\n    override fun track(event: String) {\n        // Send analytics event\n    }\n}\n\n@Module\n@InstallIn(SingletonComponent::class)\nabstract class AppModule {\n    @Binds\n    abstract fun bindAnalytics(impl: AnalyticsImpl): Analytics\n}\n```\n\n### Where does DI become difficult?\nChat may need App dependencies such as `Analytics`, `UserRepository`, and `Network`, but Chat might not be installed when App starts. Also, App cannot directly know about feature-specific classes such as `ChatRepository` or `ChatViewModel`. Chat needs dependencies from App, but App must not depend on Chat's classes.\n\n### Expose App dependencies through a Hilt EntryPoint\nDefine the EntryPoint in App and expose only what Chat needs:\n```kotlin\n@EntryPoint\n@InstallIn(SingletonComponent::class)\ninterface ChatDependencies {\n    fun analytics(): Analytics\n    fun userRepository(): UserRepository\n}\n```\n\nAfter Chat is installed, code in the feature can access the App graph:\n```kotlin\nval dependencies = EntryPointAccessors.fromApplication(\n    context.applicationContext,\n    ChatDependencies::class.java\n)\n\nval chatRepository = ChatRepository(\n    analytics = dependencies.analytics(),\n    userRepository = dependencies.userRepository()\n)\n```\n\nFor a larger feature, pass these dependencies into a feature-specific Dagger component instead of manually constructing every object. Dynamic Feature Modules are not regular Hilt injection targets, so use the EntryPoint as the boundary and create/inject feature objects through a supported Dagger component or factory.\n\n### Keep feature-specific dependencies inside the feature\nApp owns common dependencies such as Auth, Analytics, Network, and UserRepository. Chat owns ChatApi, ChatRepository, ChatViewModel, and its UI. Scope feature-specific objects to the feature lifecycle; do not make every feature dependency an application singleton.\n\nThe important distinction is:\n```text\nGradle dependency: Feature → App → Core\nRuntime DI access: App Hilt Graph → ChatDependencies → Dynamic Feature\n```\n\n:::summary\n**Easy interview answer:**\n> I use a Base App with Dynamic Feature Modules that can be downloaded on demand. The feature depends on the Base App, not the other way around. Shared contracts live in Core, and App owns their implementations and the main Hilt graph. Because App cannot depend on feature classes, the feature accesses required App dependencies through an App-defined Hilt EntryPoint, then creates its own feature-specific graph. I also scope feature dependencies to the feature lifecycle.\n\n**Easy way to remember:**\n`Chat → App → Core` for module dependencies; `App Hilt Graph → EntryPoint → Chat` for runtime DI.\n:::"

      question: "In a 50+ module project, how do you manage Gradle build times?",
      answer: "For a large project, I focus on **three main things**:\n```text\n1. Build avoidance\n2. Configuration Cache\n3. Module dependency graph\n```\n\n### 1. Build avoidance\nThe best way to make a build faster is to **not run work that doesn't need to run**. If I change only Feature Profile, ideally Gradle rebuilds that feature and only the downstream modules that actually need it—not unrelated features.\n\nI rely on incremental builds, task output caching/build cache, and up-to-date checks. Custom Gradle tasks and annotation/code-generation tools should be incremental and cacheable where possible.\n\n> **Don't make Gradle redo work whose inputs haven't changed.**\n\n### 2. Configuration Cache\nA Gradle build has a configuration phase, where it figures out projects, tasks, and dependencies, followed by task execution. In a 50+ module project, configuration itself can take time. Configuration Cache lets Gradle reuse the configuration result when nothing relevant has changed.\n\nEnable it in `gradle.properties`:\n```properties\norg.gradle.configuration-cache=true\n```\n\nPlugins and custom Gradle logic must be compatible with Configuration Cache.\n\n> **Configuration Cache avoids configuring the entire project again for every build.**\n\n### 3. Optimize the module dependency graph\nWith many modules, keep dependencies shallow and focused. Avoid long dependency chains, unnecessary feature-to-feature dependencies, and one huge shared module that causes many projects to recompile when it changes. Aim for changes to affect the smallest possible part of the graph.\n\nPrefer:\n```text\nFeature Home ───→ core-network\n             └──→ core-model\n\nFeature Profile → core-network\n                → core-user\n\nFeature Payment → core-payment\n```\n\n### `implementation` vs. `api`\nPrefer `implementation` unless a dependency is intentionally part of your module's public API:\n```kotlin\nimplementation(project(\":core-network\"))\n```\n\n`api` exposes a dependency to consumers, increasing coupling and potentially the compile impact of changes. Use it only when consumers need those types through your public API.\n\n### Staff-level approach\nI would **measure before changing settings**. Use build scans or profiling to find the biggest bottleneck:\n- Slow configuration → investigate Configuration Cache compatibility.\n- Repeated tasks → improve build or task caching.\n- Large recompilation → inspect the dependency graph and `api` exposure.\n- Slow code generation → examine KSP, processors, and plugins.\n- One oversized shared module → split its dependency boundaries.\n\nOptimize the largest measured bottleneck first.\n\n:::summary\n**Easy interview answer:**\n> In a 50+ module project, I avoid unnecessary work with incremental builds and caching, use Configuration Cache to reduce configuration time, and keep the dependency graph focused so changes affect as few modules as possible. I prefer `implementation` over `api` unless a dependency is part of the public API. At Staff level, I measure configuration, compilation, code generation, and graph costs first, then optimize based on data.\n\n**Easy way to remember:**\nDon't **run** unnecessary work → build avoidance/caching.\nDon't **configure** unnecessarily → Configuration Cache.\nDon't **rebuild** half the project → a focused module graph.\n:::"

      question: "What is a reified type in Kotlin?",
      answer: "Normally, generic type information is **not available at runtime** because of **type erasure**.\n\nFor example, this runtime check is not allowed for an ordinary generic type parameter:\n```kotlin\nfun <T> check(value: Any) {\n    if (value is T) { // Cannot check an erased type\n    }\n}\n```\n\nAt runtime, Kotlin/JVM does not know what `T` actually is.\n\n### Reified solves this\nIf the function is `inline` and `T` is `reified`, the compiler can use the actual type at the call site:\n```kotlin\ninline fun <reified T> check(value: Any) {\n    if (value is T) {\n        println(\"Correct type\")\n    }\n}\n\ncheck<String>(\"Hello\")\ncheck<Int>(100)\n```\n\nBecause the function is inlined, the compiler puts its code at the call site, where it knows the actual type.\n\nReified types also allow access to the type's `KClass`:\n```kotlin\ninline fun <reified T> typeName() {\n    println(T::class)\n}\n```\n\n### Why must it be `inline`?\nInlining lets the compiler substitute the actual type at each call site. Without that, the generic type would be erased at runtime.\n\n:::summary\n**Easy interview answer:**\n> Normally, generic types are erased at runtime, so I cannot do checks like `value is T` or access `T::class`. A reified type keeps the actual type available inside an inline function, allowing runtime type checks and access to the class of `T` without passing a `Class` or `KClass` manually.\n\n**Easy way to remember:**\nGeneric `T` → type erased.\n`inline` + `reified T` → actual type available at the call site.\n:::"

      answer: "The easiest way to understand scope functions is to ask two questions:\n1. How is the object accessed: `it` or `this`?\n2. What does the function return: the object itself or the lambda result?\n\nQuick guide:\n- `let` — uses `it`, returns the lambda result; useful for null checks and transformations.\n- `run` — uses `this`, returns the lambda result; useful for working with an object and computing a result.\n- `apply` — uses `this`, returns the same object; useful for configuring an object.\n- `also` — uses `it`, returns the same object; useful for side effects such as logging.\n- `with` — uses `this`, returns the lambda result; useful for multiple operations on an existing object.\n\n### `let` — null checks and transformations\n`let` gives the object as `it` and returns the lambda result. It is commonly used for null-safe operations:\n```kotlin\nuser?.let {\n    saveUser(it)\n}\n```\n\nIt can also transform a value:\n```kotlin\nval length = name.let {\n    it.length\n}\n```\n\nThink: **Let me do something with this value.**\n\n### `run` — work with an object and return a result\n`run` uses `this` and returns the lambda result:\n```kotlin\nval description = user.run {\n    validate()\n    loadProfile()\n    \"$name - $age\"\n}\n```\n\nThink: **Run operations on this object and give me the result.**\n\n### `apply` — configure an object\n`apply` uses `this` and returns the same object. It is commonly used when creating and configuring objects:\n```kotlin\nval intent = Intent(context, DetailActivity::class.java).apply {\n    putExtra(\"userId\", userId)\n    putExtra(\"source\", \"home\")\n}\n\nval user = User().apply {\n    name = \"Rahul\"\n    age = 30\n}\n```\n\nThink: **Apply these settings to this object.**\n\n### `also` — side effects\n`also` uses `it` and returns the same object. Use it for logging or debugging without changing the main flow:\n```kotlin\nval user = getUser().also {\n    Log.d(\"User\", \"Loaded ${it.name}\")\n}\n```\n\nThink: **Do this, and also do this extra thing.**\n\n### `with` — multiple operations on an existing object\n`with` uses `this` and returns the lambda result:\n```kotlin\nwith(binding) {\n    title.text = \"Hello\"\n    button.isEnabled = true\n    progressBar.isVisible = false\n}\n```\n\nThis avoids repeatedly writing `binding.` before each property.\n\n:::summary\n**Easy way to remember:**\n`let` / `also` → `it`\n`run` / `apply` / `with` → `this`\n\n`let` / `run` / `with` → return the lambda result.\n`apply` / `also` → return the original object.\n:::"

n}\n```\n\nThink: **Do this, and also do this extra thing.**\n\n### `with` — multiple operations on an existing object\n`with` uses `this` and returns the **lambda result**:\n```kotlin\nwith(binding) {\n    title.text = \"Hello\"\n    button.isEnabled = true\n    progressBar.isVisible = false\n}\n```\n\nThis avoids repeatedly writing `binding.` before each property.\n\nThink: **Do multiple things with this object.**\n\n### Similarities\n**`let` vs. `run`:** Both return the lambda result. `let` uses `it`; `run` uses `this`. Use `let` when an explicit argument is clearer, especially for null-safe operations. Use `run` when accessing several members of the same object.\n\n**`run` vs. `with`:** Both use `this` and return the lambda result. `run` is extension style (`user.run { ... }`); `with` is argument style (`with(user) { ... }`). `run` is convenient for chaining or nullable objects; `with` is useful for grouping operations on an existing object.\n\n**`apply` vs. `also`:** Both return the same object. `apply` uses `this` and is for configuration; `also` uses `it` and is for side effects.\n\n:::summary\n**Easy interview answer:**\n> `let` is useful for null-safe operations and transformations. It uses `it` and returns the lambda result. `run` performs operations on an object and returns a result using `this`. `apply` configures an object using `this` and returns the same object. `also` uses `it` for side effects and returns the same object. `with` uses `this` to perform operations on an existing object and returns the lambda result.\n\nThe important similarities are:\n- **`let` and `run`** → both return the lambda result; `let` uses `it`, `run` uses `this`.\n- **`run` and `with`** → both use `this` and return the lambda result; `run` is extension style, `with` is argument style.\n- **`apply` and `also`** → both return the original object; `apply` uses `this`, `also` uses `it`.\n:::"

      id: "kotlin-inline-noinline-crossinline",

      tags: ["Inline Functions"],
      question: "What are inline, noinline, and crossinline functions in Kotlin?",
      answer: "Before these keywords, understand two terms: **lambda** and **call site**.\n\nA **lambda** is a function that can be passed to another function as a value:\n```kotlin\nfun execute(action: () -> Unit) {\n    action()\n}\n\nexecute {\n    println(\"Hello\")\n}\n```\n\nThe code inside `{ ... }` is the lambda. In Android, a click listener is a common example:\n```kotlin\nbutton.setOnClickListener {\n    openProfile()\n}\n```\n\nA **call site** is the place where a function is called. In `execute { println(\"Hello\") }`, that expression is the call site.\n\n### `inline`\n`inline` is mainly useful for functions that accept lambdas. It allows the compiler to place the function body and eligible lambda code at the call site:\n```kotlin\ninline fun execute(action: () -> Unit) {\n    action()\n}\n\nexecute {\n    println(\"Hello\")\n}\n```\n\nThis can reduce lambda-object and function-call overhead for small higher-order functions. `inline` also enables features such as **reified types** and **non-local returns**.\n\n### Non-local return\nA return inside a lambda passed to an inline function can return from the outer function:\n```kotlin\ninline fun execute(action: () -> Unit) {\n    action()\n}\n\nfun loadData() {\n    execute {\n        return\n    }\n    println(\"Done\") // Not reached\n}\n```\n\nThis is called a **non-local return**.\n\n### `noinline`\nIn an inline function with multiple lambda parameters, `noinline` keeps a particular lambda as a normal function object:\n```kotlin\ninline fun execute(\n    action1: () -> Unit,\n    noinline action2: () -> Unit\n) {\n    val savedAction = action2\n    action1()\n}\n```\n\nUse `noinline` when you need to store that lambda or pass it around as a value.\n\n> **`noinline` means this lambda is not inlined.**\n\n### `crossinline`\n`crossinline` keeps the lambda eligible for inlining but prohibits non-local returns. It is useful when the lambda is invoked from another lambda or execution context:\n```kotlin\ninline fun execute(crossinline action: () -> Unit) {\n    val runnable = Runnable {\n        action()\n    }\n    runnable.run()\n}\n```\n\nBecause `action` runs inside `Runnable`, it cannot return from the outer caller. A labelled local return, such as `return@execute`, is still possible.\n\n> **`crossinline` means inline this lambda, but do not allow it to return from the outer function.**\n\n### `noinline` vs. `crossinline`\n- `noinline` → the lambda is not inlined; it can be stored or passed around.\n- `crossinline` → the lambda remains inline, but a non-local return is forbidden.\n\n:::summary\n**Easy interview answer:**\n> A lambda is a function passed as a value, and the call site is where the function is called. `inline` puts eligible function and lambda code at the call site. `noinline` keeps a particular lambda as a normal object so it can be stored or passed around. `crossinline` keeps it inline but prevents non-local returns, which is useful when it is called from another lambda or execution context.\n\n**Easy way to remember:**\n`inline` → inline code; non-local return allowed.\n`noinline` → do not inline this lambda.\n`crossinline` → inline it, but forbid non-local return.\n:::"
    });
