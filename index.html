      question: "How do inline functions increase the performance of lambdas?",
      answer: "When a lambda is passed to a function, Kotlin may need to create a **lambda object** and invoke it through a function call.\n\nFor example:\n```kotlin\nfun execute(action: () -> Unit) {\n    action()\n}\n\nfun loadData() {\n    execute {\n        println(\"Hello\")\n    }\n}\n```\n\nWithout `inline`, this can involve creating a lambda object, passing it to `execute`, and invoking it through `action()`.\n\n### What happens with `inline`?\n```kotlin\ninline fun execute(action: () -> Unit) {\n    action()\n}\n```\n\nThe compiler can place the function and eligible lambda code directly at the **call site**. Conceptually, `loadData()` can become:\n```kotlin\nfun loadData() {\n    println(\"Hello\")\n}\n```\n\nThis can avoid some lambda allocations and indirect function calls, especially for small higher-order functions called frequently. Kotlin's standard library uses inline functions in places such as `forEach`:\n```kotlin\nlist.forEach {\n    println(it)\n}\n```\n\n### Is `inline` always faster?\nNo. Inlining can increase generated code size because the function body may be copied to multiple call sites. It is most useful for **small higher-order functions with lambda parameters**, not something to apply everywhere.\n\n:::summary\n**Easy interview answer:**\n> Passing a lambda may require creating a lambda object and invoking it through a function call. An inline function lets the compiler place the function and lambda code at the call site, which can avoid some allocations and call overhead. This helps most with small, frequently used higher-order functions. The trade-off is larger generated code, so `inline` is not always faster.\n\n**Easy way to remember:**\nNormal lambda → create/pass/invoke.\nInline lambda → code at the call site, with less allocation/call overhead but potentially more code size.\n:::"

      answer: "A **sealed class** is useful when there is a **fixed set of possible states or types**, but each state may contain different data. A common Android example is UI state:\n```kotlin\nsealed class UiState {\n    data object Loading : UiState()\n\n    data class Success(\n        val data: List<User>\n    ) : UiState()\n\n    data class Error(\n        val message: String\n    ) : UiState()\n}\n```\n\nThe possible states are `Loading`, `Success(data)`, and `Error(message)`. We can handle them with `when`:\n```kotlin\nwhen (state) {\n    is UiState.Loading -> showLoading()\n    is UiState.Success -> showUsers(state.data)\n    is UiState.Error -> showError(state.message)\n}\n```\n\nBecause the compiler knows the possible subclasses, this `when` can be **exhaustive**. If a new state is added, Kotlin can require it to be handled.\n\n### How is this different from an enum?\nAn enum is also good for a fixed set of simple values:\n```kotlin\nenum class Direction {\n    NORTH, SOUTH, EAST, WEST\n}\n```\n\nEnum values share the same enum type and structure. A sealed class is better when cases carry different data:\n```kotlin\nsealed class Result {\n    data object Loading : Result()\n    data class Success(val data: User) : Result()\n    data class Error(val exception: Throwable) : Result()\n}\n```\n\nEach sealed subclass can have its own data, properties, functions, and behavior.\n\n### Common Android use cases\n- **UI state:** `Loading`, `Success(data)`, `Error(message)`.\n- **API result:** success data or an exception.\n- **Navigation:** destinations such as `Home`, `Profile(userId)`, and `Article(articleId)`.\n\n:::summary\n**Easy interview answer:**\n> A sealed class represents a restricted set of possible types. The compiler knows its subclasses, which makes it useful for UI states, API results, and navigation events, and enables exhaustive `when` expressions. Unlike an enum, each sealed subclass can carry different data and behavior. I use enums for simple fixed constants and sealed classes when cases need different data.\n\n**Easy way to remember:**\nEnum → fixed values, usually simple constants.\nSealed class → fixed types, each can carry different data.\n:::"

      answer: "A **data class is mainly used to represent data**. Kotlin generates useful functions from properties in its primary constructor:\n```text\nequals()\nhashCode()\ntoString()\ncopy()\ncomponentN()\n```\n\nFor example:\n```kotlin\ndata class User(\n    val name: String,\n    val age: Int\n)\n\nval user1 = User(\"Rahul\", 30)\nval user2 = User(\"Rahul\", 30)\n\nprintln(user1 == user2) // true\n```\n\nKotlin's `==` calls `equals()`. The generated `equals()` compares the primary-constructor properties, here `name` and `age`. A normal class does not generate value-based equality automatically.\n\n### `copy()`\n`copy()` creates a new instance with selected values changed; the original remains unchanged:\n```kotlin\nval user = User(\"Rahul\", 30)\nval updatedUser = user.copy(age = 31)\n```\n\nThis is useful for immutable UI state, such as `state.copy(isLoading = true)`.\n\n### `componentN()` and destructuring\nData classes generate component functions for primary-constructor properties:\n```kotlin\nval user = User(\"Rahul\", 30)\nval (name, age) = user\n```\n\nHere, `component1()` gives `name` and `component2()` gives `age`.\n\n### Can a data class be abstract or sealed?\nNo. A data class represents a concrete data object; an abstract class is an incomplete base type, and a sealed class defines a restricted hierarchy. Instead, use a sealed parent with data-class children:\n```kotlin\nsealed class Result\n\ndata class Success(val data: String) : Result()\ndata class Error(val message: String) : Result()\n```\n\nThe sealed class defines the possible types; each data class carries that case's data.\n\n### Can a data class be nested?\nYes. A data class can be declared inside another class:\n```kotlin\nclass UserManager {\n    data class User(val name: String, val age: Int)\n}\n\nval user = UserManager.User(\"Rahul\", 30)\n```\n\n### Why is at least one primary-constructor property required?\nA data class requires at least one `val` or `var` parameter in its primary constructor. Kotlin uses those properties to generate `equals()`, `hashCode()`, `toString()`, `copy()`, and `componentN()`.\n\nOnly primary-constructor properties participate in those generated functions. A property declared in the class body is excluded:\n```kotlin\ndata class User(val name: String) {\n    var age: Int = 0\n}\n\nval user1 = User(\"Rahul\").apply { age = 20 }\nval user2 = User(\"Rahul\").apply { age = 40 }\nprintln(user1 == user2) // true: equality compares only name\n```\n\n:::summary\n**Easy interview answer:**\n> A data class represents data. Kotlin generates `equals()`, `hashCode()`, `toString()`, `copy()`, and `componentN()` from its primary-constructor properties. A data class cannot be abstract or sealed, but it can be nested. It needs at least one `val` or `var` constructor property because those properties define the generated data behavior. For variants, use a sealed parent with data-class children.\n\n**Easy way to remember:**\n`data class` → concrete data; generated functions use constructor properties.\n`sealed class` → defines a hierarchy; data classes can represent its cases.\n:::"

      answer: "To understand `reified`, first understand **type erasure**.\n\nFor example:\n```kotlin\nfun <T> printValue(value: T) {\n    println(value)\n}\n\nprintValue<String>(\"Hello\")\nprintValue<Int>(100)\n```\n\nAt compile time, Kotlin knows the type arguments. On the JVM, generic type information is mostly erased at runtime. Conceptually, the method behaves more like it accepts `Object`, so inside a normal generic function the actual `T` is generally unavailable. That is why `value is T` and `T::class` are not allowed for an ordinary type parameter.\n\n### What does `reified` do?\nA reified type parameter lets an inline function use the actual type at its call site:\n```kotlin\ninline fun <reified T> check(value: Any) {\n    if (value is T) {\n        println(\"Correct type\")\n    }\n}\n\ncheck<String>(\"Hello\")\n```\n\nIt also allows access to the class:\n```kotlin\ninline fun <reified T> printType() {\n    println(T::class)\n}\n\nprintType<String>()\n```\n\n### Why must it be `inline`?\nWithout inlining, there would be one generic method at runtime, and type erasure would mean it could not tell whether `T` was `String`, `Int`, or `User`. With `inline`, the compiler can place the function code at the call site, where it knows the concrete type, and substitute that type into the generated code.\n\nConceptually, `check<String>(value)` makes `value is T` into `value is String`. At the JVM bytecode level, that can become a normal type check such as:\n```text\nINSTANCEOF java/lang/String\n```\n\nThe JVM does not need special knowledge of `reified`; the Kotlin compiler has already generated code using the actual type.\n\n### How can we do this without `reified`?\nPass the type explicitly as a `Class` or `KClass`:\n```kotlin\nfun <T : Any> printType(clazz: Class<T>) {\n    println(clazz)\n}\n\nprintType(String::class.java)\n```\n\nOr use `KClass<T>` and pass `String::class`.\n\n:::summary\n**Easy interview answer:**\n> On the JVM, generic types are normally erased at runtime, so an ordinary generic function cannot use `T::class` or check `value is T`. `reified` works with `inline`: the compiler specializes the function at the call site, where it knows the actual type. A check like `value is T` can become a regular bytecode instruction such as `INSTANCEOF java/lang/String`. Without reified, pass a `Class` or `KClass` explicitly.\n\n**Easy way to remember:**\nNormal `<T>` → erased at runtime.\n`inline` + `reified T` → compiler knows `T` at the call site and emits type-specific code.\n:::"

      question: "What is the difference between Nothing, Unit, and Void in Kotlin? How does Nothing enable the type system to express exhaustiveness?",
      answer: "The easiest way to understand them is:\n```text\nUnit    → function finishes, but returns no meaningful value\nNothing → function never finishes normally\nVoid    → Java interop type, rarely used in normal Kotlin\n```\n\n### `Unit` — no meaningful result\n`Unit` is similar to Java's `void`, but it is a real Kotlin type with one value: `Unit`. The function executes and returns normally:\n```kotlin\nfun showMessage(): Unit {\n    println(\"Hello\")\n}\n\n// Usually written without the explicit return type\nfun showMessage() {\n    println(\"Hello\")\n}\n```\n\nA lambda of type `() -> Unit` means the caller does not need a meaningful result:\n```kotlin\nval action: () -> Unit = {\n    println(\"Clicked\")\n}\n```\n\n### `Nothing` — never returns normally\n`Nothing` is different: a function with this return type cannot return to its caller normally. It might always throw or run forever:\n```kotlin\nfun fail(message: String): Nothing {\n    throw IllegalStateException(message)\n}\n```\n\n`Nothing` is Kotlin's **bottom type**, a subtype of every Kotlin type. A `throw` expression has type `Nothing`, so it can appear in a branch where another type is expected:\n```kotlin\nval name: String =\n    user.name ?: throw IllegalStateException(\"Name missing\")\n```\n\nThe successful branch produces a `String`; the other branch throws and never produces a value. `TODO()` also returns `Nothing`, which is why it can stand in for any expected return type while throwing `NotImplementedError`.\n\n### What about `Void`?\n`Void` usually refers to Java's `java.lang.Void` and is mainly relevant to Java interop. In ordinary Kotlin code, use `Unit` for a function that returns no meaningful value, not `Void`.\n\n```text\nJava void ≈ Kotlin Unit\n```\n\n### How does `Nothing` relate to exhaustiveness?\nA sealed hierarchy lets the compiler know all possible cases, so a `when` can be **exhaustive**. `Nothing` lets a branch express that it stops instead of producing the expression's result type:\n```kotlin\nsealed class Result\ndata class Success(val data: String) : Result()\ndata class Error(val message: String) : Result()\n\nfun handle(result: Result): String = when (result) {\n    is Success -> result.data\n    is Error -> throw IllegalStateException(result.message)\n}\n```\n\nThe `when` is exhaustive because the sealed hierarchy has only `Success` and `Error`. The error branch has type `Nothing`, so it does not need to produce a `String`. **`Nothing` itself does not make the `when` exhaustive; the sealed hierarchy does.**\n\n:::summary\n**Easy interview answer:**\n> `Unit` means a function completes normally without a meaningful result. `Nothing` means it never returns normally, such as when it throws; it is Kotlin's bottom type and can fit wherever a value is expected because it produces no value. `Void` is mainly Java interop. A sealed hierarchy makes `when` exhaustive, while `Nothing` lets a branch represent a path that stops instead of returning the result type.\n\n**Easy way to remember:**\n`Unit` → finished, no useful result.\n`Nothing` → never returns normally.\n`Void` → mostly Java interop.\n:::"

    starterQuestions.push({
      id: "kotlin-variance-in-out",
      section: "Kotlin",
      difficulty: "Senior",
      tags: ["Generics", "Variance"],
      question: "Explain variance in Kotlin: in, out, and invariant.",
      answer: "Variance describes **how generic types relate through inheritance**. Suppose `Dog` is a subtype of `Animal`; that does not automatically make `Box<Dog>` a subtype of `Box<Animal>`. Variance controls when that relationship is safe.\n\n### Invariant — the default\n```kotlin\nclass Box<T>\n\nval dogBox: Box<Dog> = Box()\n// val animalBox: Box<Animal> = dogBox // Does not compile\n```\n\n`Box<Dog>` is not a `Box<Animal>`. If a mutable box were allowed to widen this way, code could put a `Cat` into a box that is supposed to contain only `Dog`.\n\n### `out` — producer\nUse `out` when a type produces or returns `T`:\n```kotlin\ninterface Producer<out T> {\n    fun get(): T\n}\n\nval dogs: Producer<Dog> = DogProducer()\nval animals: Producer<Animal> = dogs\n```\n\nA producer of `Dog` is safe to use as a producer of `Animal`, because every `Dog` is an `Animal`. `out` means the type parameter is used in output positions.\n\n### `in` — consumer\nUse `in` when a type accepts `T`:\n```kotlin\ninterface Consumer<in T> {\n    fun consume(value: T)\n}\n\nval animalConsumer: Consumer<Animal> = AnimalConsumer()\nval dogConsumer: Consumer<Dog> = animalConsumer\n```\n\nA consumer that accepts any `Animal` can also accept a `Dog`. `in` means the type parameter is used in input positions.\n\n### When should a type stay invariant?\nIf an API both returns and accepts `T`, it generally needs to remain invariant:\n```kotlin\ninterface Repository<T> {\n    fun get(): T\n    fun save(value: T)\n}\n```\n\n### Declaration-site vs. use-site variance\n**Declaration-site variance** puts `in` or `out` on the class or interface, defining the rule once for all usages:\n```kotlin\ninterface Producer<out T> {\n    fun get(): T\n}\n```\n\n**Use-site variance** applies a projection only where it is needed. The original type can remain invariant:\n```kotlin\nclass Box<T>\n\nfun read(box: Box<out Animal>) {\n    // Read Animal values from this Box\n}\n```\n\n### Real-world example\nAn event source only produces events, so it can be covariant:\n```kotlin\ninterface EventSource<out T> {\n    fun getEvent(): T\n}\n\nopen class AppEvent\nclass LoginEvent : AppEvent()\n\nval loginEvents: EventSource<LoginEvent> = LoginEventSource()\nval appEvents: EventSource<AppEvent> = loginEvents\n```\n\nDeclaration-site variance makes this relationship part of the API design. Use-site projections can express similar relationships locally when changing the declaration is not appropriate.\n\n:::summary\n**Easy interview answer:**\n> Variance controls how generic types behave with inheritance. Kotlin generics are invariant by default, so `Box<Dog>` is not a `Box<Animal>`. `out` is for producers, allowing a producer of a subtype to be used as a producer of its supertype. `in` is for consumers, allowing a consumer of a supertype to be used as a consumer of its subtype. Declaration-site variance defines the rule on the type; use-site variance applies a projection at one usage.\n\n**Easy way to remember:**\n`out` → output → producer.\n`in` → input → consumer.\nNo `in`/`out` → invariant.\nDeclaration-site → define once.\nUse-site → define where needed.\n:::"

      question: "How do Kotlin contracts work? Write a custom contract that tells the compiler a variable is non-null after a function call.",
      answer: "Kotlin contracts give the **compiler extra information about what a function guarantees**.\n\nFor example, a validation function can throw when its nullable input is null:\n```kotlin\n@OptIn(ExperimentalContracts::class)\nfun validateUser(user: User?) {\n    contract {\n        returns() implies (user != null)\n    }\n\n    if (user == null) {\n        throw IllegalArgumentException(\"User cannot be null\")\n    }\n}\n```\n\nThe important line is:\n```kotlin\nreturns() implies (user != null)\n```\n\nIt means: **if this function returns normally, then `user` is not null**. The implementation must actually guarantee this by throwing when `user` is null.\n\nThen the compiler can smart-cast a stable local variable after the call:\n```kotlin\nval user: User? = getUser()\nvalidateUser(user)\nprintln(user.name) // Compiler knows user is non-null\n```\n\nWithout the contract, the compiler may still treat `user` as nullable after the call. With the contract, it knows normal return implies `user != null`.\n\nKotlin's standard library also uses contracts to describe behavior and help the compiler with smart casts and calls-in-place.\n\n### Important point\nA contract **does not perform validation**. It is a promise to the compiler. If the function returns normally when `user` is null, the contract is false and compiler assumptions can make the code unsafe.\n\n:::summary\n**Easy interview answer:**\n> Kotlin contracts let a function describe guarantees about its behavior to the compiler. `returns() implies (user != null)` says that if the function returns normally, `user` is non-null, so the compiler can smart-cast it after the call. The contract does not check the value; the implementation must uphold the promise.\n\n**Easy way to remember:**\nContract = promise to the compiler.\n`returns() implies (user != null)` = “If I return normally, user is not null.”\n:::"

      question: "What is @JvmInline value class and how does it differ from a data class? What are the boxing rules and when does boxing occur?",
      answer: "A **value class** creates a distinct type around one underlying value. On the JVM, Kotlin can often represent it using the underlying value directly, avoiding an extra wrapper object.\n\nFor example, separate IDs prevent accidentally passing an article ID where a user ID is expected:\n```kotlin\n@JvmInline\nvalue class UserId(val value: String)\n\n@JvmInline\nvalue class ArticleId(val value: String)\n\nfun loadUser(userId: UserId)\nfun loadArticle(articleId: ArticleId)\n\nval articleId = ArticleId(\"article-123\")\n// loadUser(articleId) // Type mismatch\n```\n\n### Value class vs. data class\nA data class is a regular object and can contain multiple constructor properties. A value class has one underlying property and may be represented directly by that value when possible:\n```kotlin\ndata class User(val name: String, val age: Int)\n\n@JvmInline\nvalue class UserId(val value: String)\n```\n\nValue classes provide **stronger type safety** and can reduce wrapper allocations, but they do not guarantee that a wrapper is never allocated.\n\n### What is boxing?\n**Unboxed** means using the underlying value directly. **Boxed** means creating a wrapper object that represents the value class.\n\nDirect use in a matching, non-generic context can often be unboxed:\n```kotlin\nfun loadUser(id: UserId) {\n    println(id.value)\n}\n```\n\nBoxing can be required when the JVM needs an object representation, including common cases such as:\n- **Generic use:** `List<UserId>` stores values through a generic object representation.\n- **Interface use:** treating `UserId` as an interface it implements requires an object that implements that interface.\n- **Nullable use:** `UserId?` may need a boxed representation to distinguish the underlying value from `null`.\n\nBoxing may add allocations and garbage-collection work, so measure performance-sensitive code rather than assuming value classes always eliminate allocations.\n\n### Real Android example\nUse distinct wrappers for different identifiers instead of passing every ID as a `String`:\n```kotlin\n@JvmInline\nvalue class UserId(val value: String)\n\n@JvmInline\nvalue class ArticleId(val value: String)\n\nfun openUser(id: UserId)\nfun openArticle(id: ArticleId)\n```\n\nThe compiler now catches accidentally passing a `UserId` to `openArticle`.\n\n:::summary\n**Easy interview answer:**\n> A `@JvmInline value class` gives a strongly typed wrapper around one value. Unlike a data class, it can often be represented by its underlying value without allocating a wrapper. Boxing happens when an object representation is required, commonly with generics, interface types, or nullable values. So value classes can reduce allocations, but do not guarantee zero allocations.\n\n**Easy way to remember:**\nDirect use → often unboxed.\nGeneric/interface/nullable use → may be boxed.\n:::"

      tags: ["Coroutines", "Continuation", "Bytecode", "State Machine"],
      question: "Explain the suspend keyword at the bytecode level. What does the Kotlin compiler generate for a suspend function, and what is Continuation?",
      answer: "` suspend ` allows a function to pause without blocking its thread and continue later from the same point.\n\nFor example:\n```kotlin\nsuspend fun loadUser(): User {\n    return api.getUser()\n}\n```\n\nAt the JVM level, the compiler lowers a suspend function roughly into a method with an extra `Continuation` parameter and an `Object` return type:\n```kotlin\nfun loadUser(continuation: Continuation<User>): Any?\n```\n\nConceptually, the generated method can return either the actual result or the special `COROUTINE_SUSPENDED` marker. The broad return type allows it to represent both outcomes.\n\n### What is `Continuation`?\nA `Continuation` represents how to continue after suspended work finishes. A simplified shape is:\n```kotlin\ninterface Continuation<T> {\n    val context: CoroutineContext\n    fun resumeWith(result: Result<T>)\n}\n```\n\nWhen a function suspends, the continuation carries the coroutine context and is resumed later with a result or exception.\n\n### Multiple suspension points become a state machine\n```kotlin\nsuspend fun loadData() {\n    val user = getUser()\n    val posts = getPosts(user)\n    showData(posts)\n}\n```\n\nThe compiler transforms the function into a state machine. Conceptually, a generated continuation object keeps a state label and any local values that must survive suspension:\n```text\nlabel 0 → call getUser(); save state; suspend\nlabel 1 → restore user; call getPosts(); save state; suspend\nlabel 2 → restore posts; call showData(); complete\n```\n\nIf a local such as `userId` is used after a suspension point, it must be saved in the generated state-machine object because the original JVM stack frame has returned. The compiler resumes at the saved label rather than starting the function over.\n\n### What happens at suspension and resumption?\nIf an operation cannot produce its result immediately, the lowered function returns `COROUTINE_SUSPENDED`. It has returned control; the thread is free to do other work. When the operation completes, its continuation is resumed, and the state machine continues from the saved state. Some suspend calls may complete synchronously without suspending.\n\n### Does `suspend` mean background thread?\nNo. `suspend` means the function can suspend and resume without blocking. It does not choose a thread. The dispatcher controls where coroutine code runs; use `withContext(Dispatchers.IO)` when work should run on IO.\n\n:::summary\n**Easy interview answer:**\n> At the JVM level, a suspend function is lowered with an extra `Continuation` parameter and an `Object` return type so it can return either the result or `COROUTINE_SUSPENDED`. The compiler builds a state machine that saves a label and local values across suspension points. The continuation is resumed when the operation completes, and execution continues from the saved state. `suspend` allows pause/resume without blocking; the dispatcher decides where the coroutine runs.\n\n**Easy way to remember:**\nContinuation = remembers how to resume.\nState machine = remembers where execution paused.\nDispatcher = decides where it resumes.\n:::"

      question: "What is the utility of the Use Case layer in Clean Architecture?",
      answer: "The **Use Case layer contains the business actions of the application**. A Use Case represents one thing the user or application wants to do, such as `LoginUser`, `GetArticles`, `SaveArticle`, or `SubscribeUser`.\n\nInstead of putting business logic in a ViewModel, move it into a Use Case. Without one, a ViewModel can end up fetching, filtering, and sorting data itself:\n```kotlin\nclass ArticleViewModel(\n    private val repository: ArticleRepository\n) : ViewModel() {\n    fun loadArticles() {\n        viewModelScope.launch {\n            val articles = repository.getArticles()\n            val filtered = articles\n                .filter { it.isPublished }\n                .sortedByDescending { it.publishDate }\n            // Update UI\n        }\n    }\n}\n```\n\nA Use Case can own that business rule:\n```kotlin\nclass GetPublishedArticlesUseCase(\n    private val repository: ArticleRepository\n) {\n    suspend operator fun invoke(): List<Article> {\n        return repository.getArticles()\n            .filter { it.isPublished }\n            .sortedByDescending { it.publishDate }\n    }\n}\n```\n\nThen the ViewModel focuses on UI state and events:\n```kotlin\nclass ArticleViewModel(\n    private val getPublishedArticles: GetPublishedArticlesUseCase\n) : ViewModel() {\n    fun loadArticles() {\n        viewModelScope.launch {\n            val articles = getPublishedArticles()\n            // Update UI\n        }\n    }\n}\n```\n\nThe responsibilities are:\n```text\nViewModel → UI state and events\nUse Case  → Business rules and application action\nRepository → Getting and saving data\n```\n\nA Use Case can also coordinate multiple repositories. For example, subscribing a user might check login and existing subscriptions, start a purchase, and refresh entitlements.\n\nBenefits include **thinner ViewModels**, reusable business logic, easier testing without Android UI, and clearer responsibilities.\n\n### Do we need a Use Case for every repository call?\nNo. If a Use Case only forwards a call to a repository and adds no business rule, orchestration, reuse, or useful boundary, it may be unnecessary boilerplate. Use Cases are most valuable when they express actual application behavior.\n\n:::summary\n**Easy interview answer:**\n> The Use Case layer represents business actions. It keeps business logic out of ViewModels and repositories, can coordinate multiple repositories, and makes rules reusable and easy to test. I don't necessarily create a Use Case for every repository call if it only adds boilerplate.\n\n**Easy way to remember:**\nViewModel → What should I show?\nUse Case → What should the app do?\nRepository → Where do I get or save the data?\n:::"

      id: "kotlin-flow-backpressure",
      section: "Kotlin",

      tags: ["Flow", "Coroutines", "Backpressure"],
      question: "What is Flow? What is backpressure in Flow?",
      answer: "A Kotlin `Flow` is a stream that can **produce multiple values over time**. A normal function usually returns one value, while a Flow can emit values as data changes, such as database rows, search results, or location updates.\n\nFor example, a producer emits values:\n```kotlin\nfun getNumbers(): Flow<Int> = flow {\n    emit(1)\n    emit(2)\n    emit(3)\n}\n```\n\nA consumer, or collector, receives them:\n```kotlin\ngetNumbers().collect { value ->\n    println(value)\n}\n```\n\nThink of it as:\n```text\nProducer → Flow → Consumer\n emit()             collect()\n```\n\nFor example, Room can expose `Flow<List<User>>`. When the database changes, the Flow can emit an updated list for the ViewModel to collect.\n\n### What is backpressure?\nBackpressure is the problem of a **producer emitting faster than a consumer can process values**. A normal Flow is sequential: `emit()` suspends until the collector finishes processing the current value, so the producer naturally waits.\n\nConceptually:\n```text\nemit(1) → collector processes 1 → collector finishes\nemit(2) → collector processes 2 → collector finishes\nemit(3) → collector processes 3\n```\n\n### What if the producer should not wait?\nUse `buffer()` to let upstream production continue while downstream processes values; pending values wait in a buffer:\n```kotlin\nflow\n    .buffer()\n    .collect { process(it) }\n```\n\nUse `conflate()` when only the latest value matters and intermediate values can be skipped:\n```kotlin\nflow\n    .conflate()\n    .collect { process(it) }\n```\n\nUse `collectLatest()` when new values make the current processing obsolete. It cancels the previous action and starts processing the latest value, which is useful for search queries:\n```kotlin\nsearchQuery.collectLatest { query ->\n    search(query)\n}\n```\n\n:::summary\n**Easy interview answer:**\n> Flow is a stream that emits multiple values over time. Backpressure happens when the producer is faster than the consumer. A normal Flow is sequential, so `emit()` suspends until collection can continue. Use `buffer()` to queue values, `conflate()` to skip outdated intermediate values, or `collectLatest()` to cancel old processing and handle the newest value.\n\n**Easy way to remember:**\nNormal Flow → wait.\n`buffer()` → queue.\n`conflate()` → keep the latest value.\n`collectLatest()` → cancel old work.\n:::"
    });

iveData can also work for Android lifecycle-aware observable data, while SharedFlow fits Flow-based event broadcasting.\n\n**Easy way to remember:**\n`StateFlow` → “What is the value now?” Keeps the latest value.\n`SharedFlow` → “Broadcast this to listeners.” Replay is configurable.\n:::"

      answer: "The simplest difference is:\n```text\nCold Flow → starts producing when someone starts collecting\nHot Flow  → exists independently of collectors\n```\n\n### Cold Flow\nA normal `flow {}` is cold. Nothing happens when it is created; it starts when `collect()` is called:\n```kotlin\nval numbers = flow {\n    println(\"Flow started\")\n    emit(1)\n    emit(2)\n    emit(3)\n}\n\nnumbers.collect {\n    println(it)\n}\n```\n\nEach collector normally starts its own execution. Collecting `numbers` twice runs the flow twice, so an API call inside a cold flow may run again for each collection.\n\n### Hot Flow\nA hot flow exists independently of collectors. `StateFlow` and `SharedFlow` are hot. A `StateFlow` can be updated even when nobody is collecting, and a new collector receives its latest value:\n```kotlin\nval state = MutableStateFlow(0)\nstate.value = 1\nstate.value = 2\n\nstate.collect {\n    println(it) // A new collector receives the current value, 2\n}\n```\n\nMultiple collectors observe the same hot flow rather than each restarting the producer. `StateFlow` holds the latest state; `SharedFlow` broadcasts values according to its replay and buffering configuration.\n\n### Real-world analogy\n- **Cold Flow is like Netflix:** each person starts their own playback.\n- **Hot Flow is like live TV or radio:** the broadcast exists, and listeners join what is being sent.\n\n:::summary\n**Easy interview answer:**\n> A cold Flow starts producing when collected, and each collector normally starts a separate execution. A hot Flow exists independently of collectors, and multiple collectors observe the same stream. A normal `flow {}` is cold; `StateFlow` and `SharedFlow` are hot.\n\n**Easy way to remember:**\nCold = Netflix; collection starts it.\nHot = live TV/radio; the broadcast exists independently.\n:::"

      answer: "The easiest way to remember is:\n```text\nStateFlow    → state\nChannel      → send values between coroutines\ncallbackFlow → convert callback APIs into Flow\n```\n\n### `StateFlow` — current state\nUse `StateFlow` when you need to represent a value that is always current, such as UI state, logged-in user, selected tab, article list, or loading state:\n```kotlin\nprivate val _uiState = MutableStateFlow(UiState())\nval uiState = _uiState.asStateFlow()\n```\n\nIt always has a current value, and a new collector immediately receives the latest state. Think: **“What is the value right now?”**\n\n### `Channel` — messages between coroutines\nA `Channel` is like a queue. One coroutine sends, and a receiver consumes an item:\n```kotlin\nval channel = Channel<String>()\nchannel.send(\"Hello\")\nval message = channel.receive()\n```\n\nUnlike a broadcast flow, a Channel is usually for delivering each item to a receiver. With multiple consumers, items are distributed among them rather than each consumer receiving every item. Typical uses include producer/consumer queues, background work, and passing messages between coroutines. A Channel can also be exposed as a Flow with `receiveAsFlow()`.\n\n### `callbackFlow` — adapt callback APIs\nUse `callbackFlow` to convert callback-based APIs, such as location, Bluetooth, sensors, or SDK listeners, into a `Flow`:\n```kotlin\nfun locations(): Flow<Location> = callbackFlow {\n    val listener = object : LocationListener {\n        override fun onLocationChanged(location: Location) {\n            trySend(location)\n        }\n    }\n\n    locationManager.addListener(listener)\n\n    awaitClose {\n        locationManager.removeListener(listener)\n    }\n}\n```\n\nCallers can collect the result as a Flow:\n```kotlin\nlocations().collect { location ->\n    // Use the location\n}\n```\n\n`callbackFlow` uses a channel internally. `trySend()` forwards callback values, and `awaitClose` is important for unregistering the listener when collection is cancelled or ends.\n\n### Quick comparison\n- **`StateFlow`** — holds current state; a new collector gets the latest value.\n- **`Channel`** — queues messages for receivers; items are consumed rather than broadcast to every collector.\n- **`callbackFlow`** — adapts an external callback API to a Flow and provides a place to clean up the callback.\n\n:::summary\n**Easy interview answer:**\n> I use `StateFlow` for current state, `Channel` to pass or queue messages between coroutines, and `callbackFlow` to adapt callback APIs into Flow. StateFlow provides the latest value to new collectors. A Channel delivers items to receivers rather than broadcasting them. In callbackFlow, I use `trySend()` for callback values and `awaitClose` to unregister the listener.\n\n**Easy way to remember:**\nStateFlow → “What is the state now?”\nChannel → “Send this to a receiver.”\ncallbackFlow → “Convert this callback into Flow.”\n:::"
    });

    starterQuestions.push({
      id: "kotlin-flow-statein-sharein",
      section: "Kotlin",
      difficulty: "Standard",
      tags: ["Flow", "StateFlow", "SharedFlow"],
      question: "How can we convert Flow to StateFlow or SharedFlow?",
      answer: "A normal `Flow` is usually **cold**, so its upstream work starts when it is collected. You can share or convert it with `stateIn()` or `shareIn()`.\n\n### Flow → `StateFlow` with `stateIn()`\n```kotlin\nval users: StateFlow<List<User>> = repository.getUsers()\n    .stateIn(\n        scope = viewModelScope,\n        started = SharingStarted.WhileSubscribed(5000),\n        initialValue = emptyList()\n    )\n```\n\nThe parameters mean:\n- `scope` → the scope that owns the sharing coroutine.\n- `started` → when collection of the upstream Flow starts and stops.\n- `initialValue` → the current state before the upstream emits.\n\nThe resulting StateFlow has a current value through `users.value`, gives new collectors the latest value, and can be shared by multiple collectors.\n\n### Flow → `SharedFlow` with `shareIn()`\n```kotlin\nval users: SharedFlow<List<User>> = repository.getUsers()\n    .shareIn(\n        scope = viewModelScope,\n        started = SharingStarted.WhileSubscribed(5000),\n        replay = 0\n    )\n```\n\n`replay` controls how many previous emissions a new collector receives. With `replay = 0`, a new collector gets no old emissions; with `replay = 1`, it gets the latest emission.\n\n### Why share a Flow?\nIf a cold Flow makes an API call, two independent collectors can trigger the upstream work twice. Sharing it lets active collectors observe one shared upstream collection, according to the selected `SharingStarted` policy:\n```kotlin\nval users = repository.getUsers()\n    .shareIn(\n        viewModelScope,\n        SharingStarted.WhileSubscribed(),\n        replay = 1\n    )\n```\n\n:::summary\n**Easy interview answer:**\n> Use `stateIn()` to convert a Flow to StateFlow when you need current state, an initial value, and access through `.value`. Use `shareIn()` to convert it to SharedFlow when multiple collectors should share one upstream collection. `replay` controls how many previous emissions new collectors receive.\n\n**Easy way to remember:**\nFlow → `stateIn()` → StateFlow.\nFlow → `shareIn()` → SharedFlow.\n:::"

    starterQuestions.push({
      id: "flow-conflate-buffer-conflated-collect-latest",
      section: "Kotlin",
      difficulty: "Senior",
      tags: ["Flow", "Backpressure", "Coroutines"],
      question: "What is the difference between conflate(), buffer(Channel.CONFLATED), and collectLatest?",
      answer: "The easiest difference is:\n```text\nconflate()                    → drop intermediate pending values\nbuffer(Channel.CONFLATED)     → same conflated buffering behavior\ncollectLatest()               → cancel previous processing when a new value arrives\n```\n\n### `conflate()`\nIf a producer emits quickly while the collector is slow, `conflate()` lets the collector finish its current value and keeps only the latest pending value:\n```kotlin\nflow\n    .conflate()\n    .collect { value ->\n        delay(1000)\n        println(value)\n    }\n```\n\nIf the collector is processing `1` while `2`, `3`, and `4` arrive, the pending `2` and `3` can be replaced by `4`. The collector then processes `1` and `4`. Use it when only the latest state matters, not when every value matters, such as transactions or analytics events.\n\n### `buffer(Channel.CONFLATED)`\nA normal buffer can queue values between producer and consumer. With `Channel.CONFLATED`, the buffer keeps only the latest pending value:\n```kotlin\nflow\n    .buffer(Channel.CONFLATED)\n    .collect { value ->\n        process(value)\n    }\n```\n\nThis is essentially the same conflated buffering behavior as `conflate()`, which is the convenient Flow operator for it.\n\n### `collectLatest()`\n`collectLatest()` is different: when a new value arrives, it cancels the collector action currently processing the previous value and starts the new action:\n```kotlin\nflow.collectLatest { value ->\n    process(value)\n}\n```\n\nThis is useful for search, where an older query becomes irrelevant:\n```kotlin\nsearchQuery.collectLatest { query ->\n    search(query)\n}\n```\n\nCancellation is cooperative, so the action must respond to cancellation to stop promptly. Be careful using `collectLatest` for operations that must finish, such as saving an order: a new value can cancel the previous action.\n\n### When should I use each?\n- Latest UI state → `conflate()` can be appropriate.\n- Slow consumer where only the latest pending value matters → `buffer(Channel.CONFLATED)`.\n- New input makes old processing useless → `collectLatest()`, such as search.\n- Payments, transactions, database writes, or analytics where every operation matters → process every value; do not conflate or cancel the work.\n\n:::summary\n**Easy interview answer:**\n> `conflate()` drops intermediate pending values and lets current processing finish. `buffer(Channel.CONFLATED)` provides essentially the same behavior. `collectLatest()` instead cancels the previous collector action when a new value arrives. I use conflation when intermediate states do not matter, and `collectLatest` when old work becomes obsolete, such as an earlier search. I avoid both when every operation must complete.\n\n**Easy way to remember:**\n`conflate()` → drop old pending values.\n`buffer(Channel.CONFLATED)` → keep the latest pending value.\n`collectLatest()` → cancel old processing.\n:::"
    });

      id: "hilt-qualifiers-same-type-dependencies",
      section: "Dependency Injection",
      difficulty: "Standard",
      tags: ["Hilt", "Qualifier"],
      question: "How do you differentiate two DI functions returning the same data type?",
      answer: "If two dependencies have the **same type**, DI cannot know which one to provide without a qualifier. For example, both API and image URLs are `String` values.\n\n### Use `@Qualifier`\nDefine a distinct qualifier for each dependency:\n```kotlin\n@Qualifier\n@Retention(AnnotationRetention.BINARY)\nannotation class ApiUrl\n\n@Qualifier\n@Retention(AnnotationRetention.BINARY)\nannotation class ImageUrl\n```\n\nAnnotate the providers:\n```kotlin\n@Provides\n@ApiUrl\nfun provideApiUrl(): String = \"https://api.example.com\"\n\n@Provides\n@ImageUrl\nfun provideImageUrl(): String = \"https://images.example.com\"\n```\n\nThen specify which one to inject:\n```kotlin\nclass Repository @Inject constructor(\n    @ApiUrl val apiUrl: String,\n    @ImageUrl val imageUrl: String\n)\n```\n\nHilt can now distinguish `@ApiUrl String` from `@ImageUrl String`.\n\n### Common example: dispatchers\nDifferent dispatchers share the `CoroutineDispatcher` type, so qualify them too:\n```kotlin\n@Qualifier\n@Retention(AnnotationRetention.BINARY)\nannotation class IoDispatcher\n\n@Qualifier\n@Retention(AnnotationRetention.BINARY)\nannotation class DefaultDispatcher\n\n@Provides\n@IoDispatcher\nfun provideIoDispatcher(): CoroutineDispatcher = Dispatchers.IO\n\n@Provides\n@DefaultDispatcher\nfun provideDefaultDispatcher(): CoroutineDispatcher = Dispatchers.Default\n```\n\nInject the required dispatcher with its qualifier:\n```kotlin\nclass Repository @Inject constructor(\n    @IoDispatcher private val dispatcher: CoroutineDispatcher\n)\n```\n\n:::summary\n**Easy interview answer:**\n> If two dependencies have the same type, Hilt cannot distinguish them by type alone. I use a custom `@Qualifier` to give each dependency a unique identity, then apply the matching qualifier at both the provider and injection point.\n\n**Easy way to remember:**\nSame type → DI needs a qualifier → each dependency gets a distinct identity.\n:::"

      id: "android-hilt-dagger-koin",
      section: "Dependency Injection",
      difficulty: "Standard",
      tags: ["Hilt", "Dagger", "Koin"],
      question: "Hilt vs Dagger 2 vs Koin. When should you use each?",
      answer: "The simplest difference is:\n```text\nDagger 2 → powerful DI, more manual setup\nHilt     → Dagger made easier for Android\nKoin     → Kotlin DSL, more runtime-oriented resolution\n```\n\n### Dagger 2\nDagger is a **compile-time dependency injection framework**. You define components and modules, and Dagger generates the dependency graph at compile time:\n```kotlin\n@Component(modules = [NetworkModule::class])\ninterface AppComponent {\n    fun inject(activity: MainActivity)\n}\n```\n\nIt provides compile-time validation, strong runtime performance, and detailed graph control. The trade-off is more setup and boilerplate.\n\n### Hilt\nHilt is built on Dagger and makes dependency injection easier for Android with predefined Android-aware components and scopes:\n```kotlin\n@HiltAndroidApp\nclass MyApplication : Application()\n\n@AndroidEntryPoint\nclass MainActivity : AppCompatActivity()\n\n@HiltViewModel\nclass HomeViewModel @Inject constructor(\n    private val repository: UserRepository\n) : ViewModel()\n```\n\nIt supports Android components such as Application, Activity, Fragment, ViewModel, and Service. Hilt still uses Dagger underneath, so dependency graph generation and validation are primarily compile-time.\n\n### Koin\nKoin defines dependencies with a Kotlin DSL and generally needs less setup:\n```kotlin\nval appModule = module {\n    single { UserRepository(get()) }\n    viewModel { HomeViewModel(get()) }\n}\n```\n\nDependency resolution is more runtime-oriented with the standard DSL, so some missing or incorrect definitions may only be discovered when resolving dependencies.\n\n### When would I use each?\n- **Hilt:** the usual choice for modern Android apps; it combines Dagger's generated graph with Android integration and less boilerplate.\n- **Dagger 2:** when maximum graph control is needed or the project already uses a complex Dagger setup.\n- **Koin:** when a simple Kotlin DSL and quick setup are priorities, and the team accepts more runtime-oriented resolution.\n\n:::summary\n**Easy interview answer:**\n> Dagger 2 is compile-time DI with strong control but more setup. Hilt builds on Dagger and provides standardized Android components and scopes, so I usually choose it for modern Android apps. Koin offers a simple Kotlin DSL and less setup, but dependency resolution is more runtime-oriented. I choose based on Android integration needs, graph control, and the team's trade-offs.\n\n**Easy way to remember:**\nDagger → powerful, more manual.\nHilt → Dagger with easier Android integration.\nKoin → simple Kotlin DSL, more runtime resolution.\n:::"
    });

      difficulty: "Senior",
      tags: ["Hilt", "AssistedInject", "SavedStateHandle"],
      question: "How do you inject dynamic parameters (runtime values) in Hilt?",
      answer: "Hilt is designed to provide dependencies it can create from the **DI graph**. Values known only at runtime—such as `userId`, `articleId`, `productId`, or navigation arguments—usually should not be injected as graph dependencies.\n\n### Simple case: pass runtime values as parameters\nInject the stable dependencies, then pass the runtime value to the operation that needs it:\n```kotlin\nclass UserRepository @Inject constructor(\n    private val api: UserApi\n) {\n    suspend fun getUser(userId: String): User {\n        return api.getUser(userId)\n    }\n}\n\nrepository.getUser(userId)\n```\n\n```text\nHilt → Api, Repository, Database\nRuntime → userId, articleId, productId\n```\n\n### Navigation arguments in a ViewModel\nFor a navigation argument such as `userId`, use `SavedStateHandle`:\n```kotlin\n@HiltViewModel\nclass UserViewModel @Inject constructor(\n    private val repository: UserRepository,\n    savedStateHandle: SavedStateHandle\n) : ViewModel() {\n    private val userId: String =\n        checkNotNull(savedStateHandle[\"userId\"])\n}\n```\n\nHilt provides the `SavedStateHandle`; the navigation runtime provides the argument value.\n\n### Constructing an object with runtime and injected dependencies\nIf an object needs both a runtime value and a Hilt dependency, use assisted injection:\n```kotlin\nclass UserSession @AssistedInject constructor(\n    @Assisted private val userId: String,\n    private val api: UserApi\n)\n\n@AssistedFactory\ninterface UserSessionFactory {\n    fun create(userId: String): UserSession\n}\n```\n\nInject the factory, then pass the runtime value when creating the object:\n```kotlin\nclass SomeClass @Inject constructor(\n    private val factory: UserSessionFactory\n) {\n    fun createSession(userId: String) {\n        val session = factory.create(userId)\n    }\n}\n```\n\nThe factory call supplies `userId` at runtime, while Hilt supplies `UserApi`.\n\n:::summary\n**Easy interview answer:**\n> Hilt injects dependencies known through its graph; runtime values like IDs are usually passed as function parameters. For navigation arguments in a ViewModel, use `SavedStateHandle`. If an object needs both runtime arguments and Hilt dependencies, use `@AssistedInject` with an `@AssistedFactory`.\n\n**Easy way to remember:**\nSimple runtime value → function parameter.\nNavigation argument → `SavedStateHandle`.\nRuntime value + Hilt dependency → `@AssistedInject` and a factory.\n:::"

      question: "How do you inject dynamic parameters (runtime values) in Dagger?",
      answer: "Dagger creates dependencies it knows about at compile time. Runtime values such as `userId`, `articleId`, `productId`, or `authToken` must be passed in when needed.\n\n### Simple case: pass the value normally\nIf a runtime value is needed only by a method, pass it as a method parameter rather than injecting it:\n```kotlin\nclass UserRepository @Inject constructor(\n    private val api: UserApi\n) {\n    fun getUser(userId: String) {\n        api.getUser(userId)\n    }\n}\n```\n\nHere, Dagger provides `UserApi`; the caller passes `userId` at runtime.\n\n### Add a runtime value to a component with `@BindsInstance`\nIf an object created by the graph needs the runtime value, bind it when creating the component:\n```kotlin\n@Component\ninterface UserComponent {\n    fun userSession(): UserSession\n\n    @Component.Factory\n    interface Factory {\n        fun create(\n            @BindsInstance userId: String\n        ): UserComponent\n    }\n}\n```\n\nCreate the component at runtime:\n```kotlin\nval component = DaggerUserComponent.factory()\n    .create(userId = \"123\")\n```\n\n`@BindsInstance` adds the runtime value to that component's dependency graph. Dagger can then combine it with graph-provided dependencies such as `UserApi` when creating `UserSession`.\n\nIf multiple runtime values have the same type, qualify them so Dagger can distinguish them:\n```kotlin\n@Qualifier\nannotation class UserId\n\n@Qualifier\nannotation class AuthToken\n```\n\nUse the qualifiers on the factory parameters, for example `@BindsInstance @UserId userId: String` and `@BindsInstance @AuthToken token: String`.\n\n### Use Assisted Injection for individual objects\nIf runtime values are needed each time an individual object is created, use assisted injection:\n```kotlin\nclass UserSession @AssistedInject constructor(\n    @Assisted private val userId: String,\n    private val api: UserApi\n)\n\n@AssistedFactory\ninterface UserSessionFactory {\n    fun create(userId: String): UserSession\n}\n```\n\nThe caller supplies the runtime value when invoking the factory, while Dagger supplies `UserApi`.\n\n:::summary\n**Easy interview answer:**\n> For a simple runtime value, pass it as a method parameter. If it should be available in a component's graph, use `@BindsInstance` in its Factory or Builder. If an individual object needs both runtime values and Dagger-provided dependencies, use Assisted Injection.\n\n**Easy way to remember:**\nSimple runtime value → parameter.\nRuntime value in a component graph → `@BindsInstance`.\nRuntime value plus injected dependencies to create an object → `@AssistedInject`.\n:::"

      id: "dagger-compile-time-code-generation",
      section: "Dependency Injection",
      difficulty: "Staff",
      tags: ["Dagger", "Code Generation", "Compile Time"],
      question: "How does Dagger generate code at compile time? How does @Inject lead to a Factory?",
      answer: "The main idea is:\n> **Dagger processes annotations during compilation, builds and validates a dependency graph, then generates code that creates and connects the objects.**\n\nSuppose a constructor is annotated with `@Inject`:\n```kotlin\nclass UserRepository @Inject constructor(\n    private val api: UserApi\n)\n```\n\nDuring compilation, Dagger's annotation-processing or KSP integration sees that creating `UserRepository` requires `UserApi`:\n```text\nUserRepository\n      ↓\n   UserApi\n```\n\n### Dagger generates a Factory\nFor the injected constructor, Dagger generates code conceptually similar to:\n```kotlin\nclass UserRepository_Factory(\n    private val apiProvider: Provider<UserApi>\n) : Factory<UserRepository> {\n    override fun get(): UserRepository {\n        return UserRepository(apiProvider.get())\n    }\n}\n```\n\nThe generated factory knows how to create a `UserRepository`. A `Provider<UserApi>` can supply the dependency when needed and participate in graph wiring and scopes. Actual generated code is usually Java and can vary by Dagger version and configuration.\n\n### Dagger processes the whole graph\nIf a `UserViewModel` requires `UserRepository`, which requires `UserApi`, and `UserApi` is provided by a module, Dagger follows and wires the full dependency graph.\n\nA `@Component` interface describes the graph entry points. Dagger generates its implementation, such as `DaggerAppComponent`, which connects the providers and factories and constructs requested objects.\n\nIf Dagger cannot find a binding for a dependency, graph validation fails during the build rather than waiting for a runtime lookup.\n\n### Why is runtime injection fast?\nThe dependency decisions were made during compilation. At runtime, generated code performs normal object creation and method calls, rather than using reflection to discover constructors and dependencies.\n\n:::summary\n**Easy Staff interview answer:**\n> Dagger processes `@Inject` constructors and other bindings at compile time. It builds and validates the dependency graph, generates factories for object creation, and generates the component implementation that wires the graph together. Missing bindings fail the build. At runtime, Dagger mostly executes generated code, so it does not need reflection to discover and connect dependencies.\n\n**Easy way to remember:**\n`@Inject` → graph → validation → generated Factory/Provider code → generated Component → normal object creation at runtime.\n:::"

      id: "offline-first-onboarding-many-apis",
      section: "System Design",
      difficulty: "Staff",
      tags: ["Offline First", "Room", "WorkManager", "Coroutines"],
      question: "Offline-first app: 30+ APIs during onboarding — how would you design it?",
      answer: "I would **not call all APIs sequentially from the UI**. I would build a sync system where the **database is the source of truth**:\n```text\nAPI → Repository → Room Database → Flow → UI\n```\n\nI would use Room for local storage, Retrofit/OkHttp for networking, coroutines for concurrency, WorkManager for durable retries, and a `SyncCoordinator` to schedule work and track progress.\n\n### Identify dependencies before parallelizing\nSome APIs depend on earlier results and must run in order, such as User → Subscriptions → Entitlements. Independent APIs, such as Articles, Categories, Authors, Settings, and Recommendations, can run in parallel. Group work into dependency stages rather than launching all requests indiscriminately.\n\n### Limit concurrency\nEven independent requests should not necessarily all run at once. Use a measured concurrency limit, perhaps a small number of in-flight requests, to avoid network congestion, server pressure, excessive writes, memory use, and battery use. Measure and tune the limit.\n\n### Persist each successful result and its status\nFor each successful response, map DTOs to entities and save them immediately, preferably transactionally:\n```kotlin\nval response = api.getArticles()\ndatabase.withTransaction {\n    articleDao.insertAll(response.toEntities())\n}\n```\n\nTrack each API's state—such as pending, running, success, or failed—in the database. If one request fails, keep successful results and retry only failed or pending work.\n\n### Handle network loss and retries\nIf connectivity disappears partway through, keep the data already stored in Room and schedule eligible work with WorkManager. Use a connected-network constraint and make sync operations safe to retry; do not assume one long-running worker will always remain alive. Persist checkpoints/status so work can continue after the process stops.\n\n### Keep the UI database-driven\nThe UI observes Room through Flow. As network responses update the database, Room emits new data and the UI updates. The UI should not wait directly on all network calls.\n\n> **Network updates the database. The database updates the UI.**\n\n### Don't block onboarding on every API\nSeparate **critical** data required to enter the app—such as authentication, entitlements, and required configuration—from optional data such as recommendations or older content. Fetch critical data first; let optional sync continue in the background. A failure in optional data should not block onboarding, while failure in required data may need an error or retry state.\n\n### Trade-offs\nThis provides offline behavior, bounded parallelism, independent retries, and reactive UI updates. It adds complexity for sync status, partial failures, migrations, stale data, consistency, and conflict resolution.\n\n:::summary\n**Easy interview answer:**\n> I make Room the source of truth: repositories fetch remote data and persist each successful result, while the UI observes Room through Flow. A SyncCoordinator groups dependent requests, runs independent work with limited concurrency, and tracks per-API status so failures can be retried without repeating successful work. WorkManager handles durable constrained retries. Onboarding waits only for critical data; optional data syncs in the background. I would measure concurrency and design retries, consistency, and conflict handling deliberately.\n\n**Easy way to remember:**\nDependency-aware sync → limited concurrency → save each result → track and retry failures → UI observes Room.\n:::"
    });

    starterQuestions.push({
      id: "banking-chat-e2ee-offline-first-system-design",
      section: "System Design",
      difficulty: "Staff",
      tags: ["E2E Encryption", "Offline First", "WebSocket", "Room", "Conflict Resolution"],
      question: "Design a real-time banking chat system with E2E encryption, offline queueing, and delivery receipts.",
      answer: "I would design it as an **offline-first chat system**. The core requirements are security (the server cannot read messages), offline sending, reliable delivery without duplicates, and consistent ordering.\n\nThe basic rule is: **encrypt on the sender's device; the server stores and transfers ciphertext only.** I would use an established end-to-end encryption protocol/library rather than designing cryptography myself. A server-side message record might contain a message ID, conversation ID, sender ID, encrypted payload, key version, and sequence number—but no plaintext or decryption key.\n\n### High-level architecture\n```text\nAndroid App\n├── Room Database\n├── Encryption Layer\n└── Sync Engine\n       │ WebSocket / HTTPS\n       ▼\nChat Server → Message Store / Queue / Push Service\n       ↓\nRecipient Device\n```\n\n### Room is the local source of truth\nWhen the user sends a message, generate a unique ID, encrypt it, save it in Room with `PENDING` status, and show it immediately. The UI observes Room through Flow; network responses update Room, and Room updates the UI.\n\n```text\nNetwork → Repository/Sync Engine → Room → Flow → ViewModel → UI\n```\n\n### Durable outbox and synchronization\nStore pending messages in a database-backed outbox, not only in memory. When connectivity returns, a sync worker reads pending work, sends it, and records acknowledgements. WorkManager can provide constrained background retries, but persist checkpoints because a worker may stop and restart. Save each successful API/message result immediately so a later failure does not discard earlier progress.\n\nDo not launch all 30 requests—or message operations—without limits. Identify dependencies, run independent work concurrently with a measured concurrency limit, and run dependent work in order.\n\n### Idempotency, receipts, and ordering\nGive every client message a stable unique ID. The server treats it as an idempotency key: if a retry arrives after the server saved the message but the client missed the ACK, return the existing acknowledgement instead of storing a duplicate.\n\nTrack message states such as:\n```text\nPENDING → SENT → DELIVERED → READ\n```\n\nDo not rely only on device timestamps for ordering. Use a local sequence for optimistic offline display, then have the server assign an authoritative per-conversation sequence when messages sync. All devices converge on that sequence.\n\n### Multi-device conflicts\nNormal messages are append-only. Model edits and deletes as new versioned operations rather than silently overwriting history. If multiple devices edit the same message, apply a deterministic server-side rule, such as the latest accepted server version winning. Preserve history where banking audit requirements require it.\n\n### Encryption and device lifecycle\nUse a protocol with secure key evolution and forward-secrecy properties. Rotate or update keys when devices are added or removed, membership changes, or policy requires it. Protect device private keys with platform facilities such as Android Keystore. Register and authenticate a new device, establish its keys securely, and make access to old history an explicit product/security decision.\n\n### Real-time and disconnected delivery\nUse WebSockets for live messages and receipts while connected. When disconnected, push can notify or wake the app; the app then fetches encrypted messages and decrypts them locally. Avoid placing sensitive plaintext in push payloads.\n\n:::summary\n**Easy Staff interview answer:**\n> Room is the local source of truth. I write an outgoing message to a durable outbox as pending, encrypt it on-device, and sync it over WebSocket or HTTPS. Stable message IDs make retries idempotent; per-message status tracks sent, delivered, and read. The client gives optimistic local ordering while offline, and the server assigns the final conversation sequence. I separate append-only messages from versioned edit/delete operations, use WorkManager for durable constrained retries, and use an established E2EE protocol with secure device-key management. The UI observes Room, so it works offline and updates as sync completes.\n\n**Easy way to remember:**\nRoom → source of truth.\nEncrypt → server stores ciphertext.\nOutbox + UUID → retry safely.\nLocal order → optimistic display; server sequence → final order.\nACKs → sent / delivered / read.\n:::"
    });

      answer: "Assume Fragment A is visible and navigation replaces it with Fragment B while adding A to the back stack. A's Fragment instance remains, but its View is destroyed.\n\n### Fragment A is initially visible\nA reaches the `RESUMED` state:\n```text\nonCreate()\nonCreateView()\nonViewCreated()\nonStart()\nonResume()\n```\n\n### Navigate from A to B\nFragment A moves off-screen and its View is destroyed, while the Fragment instance remains on the back stack:\n```text\nA: onPause() → onStop() → onDestroyView()\n```\n\nNormally, `onDestroy()` is not called for A at this point. Fragment B is attached, created, and made visible:\n```text\nB: onAttach() → onCreate() → onCreateView() → onViewCreated()\n   → onStart() → onResume()\n```\n\n### Pop B with Back\nB is removed completely, while A's Fragment instance is restored. B goes through:\n```text\nonPause() → onStop() → onDestroyView() → onDestroy() → onDetach()\n```\n\nA's old View is gone, so Android recreates it. Normally A does not receive another `onCreate()` because its Fragment instance was retained:\n```text\nonCreateView() → onViewCreated() → onStart() → onResume()\n```\n\nThe exact callbacks for A and B can interleave during the Fragment transaction, so focus on each Fragment's lifecycle rather than memorizing one global callback order.\n\n### Why `onDestroyView()` matters\nA Fragment lifecycle is separate from its View lifecycle. Clear ViewBinding when the View is destroyed so the retained Fragment does not keep a reference to the old View:\n```kotlin\noverride fun onDestroyView() {\n    super.onDestroyView()\n    _binding = null\n}\n```\n\n:::summary\n**Easy interview answer:**\n> When A is replaced by B and added to the back stack, A normally pauses, stops, and destroys its View, but the Fragment instance remains. B is created and resumes. When B is popped, B is destroyed and detached; A's View is recreated and A resumes without another `onCreate()`. I clear ViewBinding in `onDestroyView()`. Exact callbacks can interleave during the transaction.\n:::"

    starterQuestions.push({

      question: "What are the performance measures in Compose recomposition?",
      answer: "For Compose performance, I focus on **reducing unnecessary recompositions and keeping work during recomposition small**.\n\n### 1. Keep state at the right level\nOnly composables that need a state should read it. If only `Counter` needs `count`, keep the read there so unrelated UI does not depend on it:\n```kotlin\n@Composable\nfun Counter() {\n    var count by remember { mutableStateOf(0) }\n    Text(\"Count: $count\")\n}\n```\n\n### 2. Remember calculations\nCache calculations that should only be repeated when their inputs change:\n```kotlin\nval sortedUsers = remember(users) {\n    users.sortedBy { it.name }\n}\n```\n\nUse immutable inputs where possible; mutating the same collection instance may not invalidate a `remember` key as expected.\n\n### 3. Use `derivedStateOf` when appropriate\nUse it when source state changes more often than the UI needs to react. For example, a scrolling list changes its first visible index frequently, but a button only needs to show when the index is greater than zero:\n```kotlin\nval showButton by remember {\n    derivedStateOf { listState.firstVisibleItemIndex > 0 }\n}\n```\n\n### 4. Prefer stable, immutable UI models\nStable inputs make it easier for Compose to skip eligible work when values have not changed:\n```kotlin\n@Immutable\ndata class UserUiState(\n    val name: String,\n    val age: Int\n)\n```\n\nAvoid mutable objects or collections whose changes Compose cannot reliably observe. Stability annotations are promises; only use them when the type really follows the stated behavior.\n\n### 5. Keep expensive work out of composables\nMove business or expensive calculations to an appropriate layer, or cache UI-specific calculations with `remember` when valid.\n\n### 6. Use lazy layouts for large lists\n`LazyColumn` composes items as needed for the viewport. Stable keys help Compose preserve item identity when the list changes:\n```kotlin\nLazyColumn {\n    items(\n        items = users,\n        key = { it.id }\n    ) { user ->\n        UserItem(user)\n    }\n}\n```\n\n### 7. Avoid unnecessary state changes\nOnly update state when its value meaningfully changes. Also expose the smallest useful state to each composable instead of making every part observe one large state object when practical.\n\n### 8. Defer frequently changing state reads\nFor fast-changing values such as scrolling or animation, read state in a later phase when possible. For example, the lambda form of `Modifier.offset` can defer the read to layout:\n```kotlin\nModifier.offset {\n    IntOffset(0, scrollOffset.value)\n}\n```\n\nTreat this as a measured optimization, not a default rule.\n\n### 9. Measure before optimizing\nUse Layout Inspector and recomposition counts to investigate, Compose compiler stability reports to understand skipping, Macrobenchmark for user-visible flows such as startup and scrolling, and Perfetto/System Trace for frame timing. Test release or profileable builds because debug performance can be misleading. A high recomposition count alone is not necessarily a problem if the work is cheap.\n\n:::summary\n**Easy interview answer:**\n> I keep state close to where it is needed, use `remember` and `derivedStateOf` appropriately, prefer stable immutable UI models, use lazy layouts with stable keys, and avoid expensive work during composition. For frequently changing state I consider deferred reads. I profile with Layout Inspector, compiler stability reports, Macrobenchmark, and Perfetto before optimizing. Recomposition is normal; unnecessary or expensive work is the issue.\n:::"

      answer: "Consider this composable:\n```kotlin\n@Composable\nfun Greeting(name: String) {\n    Text(\"Hello $name\")\n}\n```\n\nThe main internal flow is:\n```text\nCompose Compiler → Composer → Slot Table → Snapshot State\n                 → Recomposition → Layout → Drawing\n```\n\n### 1. The Compose compiler transforms composables\nA `@Composable` function is not compiled exactly like an ordinary Kotlin function. The Compose compiler transforms it and adds runtime parameters for composition and change tracking. Conceptually, it may resemble:\n```kotlin\nfun Greeting(name: String, composer: Composer, changed: Int) {\n    Text(\"Hello $name\")\n}\n```\n\nThis is only a simplified model; actual generated code is more complex. The `Composer` helps track where a composable is in the composition, its inputs, whether they changed, and whether execution may be skipped.\n\n### 2. Initial composition and the Slot Table\nThe first time `Greeting(\"Rahul\")` runs, Compose executes it and emits `Text(\"Hello Rahul\")`. The runtime records composition structure and information in an internal structure called the **Slot Table**. Think of it as composition memory that also supports features such as `remember`.\n\n### 3. State changes trigger recomposition\nIf `name` comes from Compose state, the Snapshot State system tracks that read. When the state changes, Compose invalidates the affected scope and schedules recomposition. The composable can run again with the updated value, producing `Text(\"Hello Amit\")`. Compose updates the relevant composition rather than automatically destroying and recreating the whole screen.\n\n### 4. Skipping and UI phases\nIf relevant inputs have not changed, and the composable is eligible under Compose's stability and skipping rules, Compose may skip its execution.\n\nCompose UI work has three main phases:\n```text\nComposition → decide what UI exists\nLayout      → measure and position it\nDrawing     → render it\n```\n\nA state change does not necessarily require all phases to redo all their work.\n\n:::summary\n**Easy interview answer:**\n> The Compose compiler transforms composables so the runtime can track and manage them. During initial composition, the Composer executes the functions and records composition information in structures such as the Slot Table. Snapshot State tracks reads; when observed state changes, Compose invalidates the affected scope and schedules recomposition. Eligible composables can be skipped when inputs have not changed. The UI then performs the required layout and drawing work.\n\n**Easy way to remember:**\nCompiler transformation → composition/state tracking → recomposition when needed → layout → drawing.\n:::"

    starterQuestions.push({
      id: "compose-state-hoisting",

      difficulty: "Standard",
      tags: ["State Hoisting", "State", "UDF"],
      question: "What is State Hoisting in Compose?",
      answer: "**State hoisting means moving state out of a composable and passing the state and events through parameters.**\n\nWithout hoisting, a composable owns its own state, so a parent cannot easily control it:\n```kotlin\n@Composable\nfun NameInput() {\n    var name by remember { mutableStateOf(\"\") }\n    TextField(value = name, onValueChange = { name = it })\n}\n```\n\nWith state hoisting, the parent owns the state and passes it down. The child reports changes with a callback:\n```kotlin\n@Composable\nfun Screen() {\n    var name by remember { mutableStateOf(\"\") }\n    NameInput(name = name, onNameChange = { name = it })\n}\n\n@Composable\nfun NameInput(name: String, onNameChange: (String) -> Unit) {\n    TextField(value = name, onValueChange = onNameChange)\n}\n```\n\nThe data flow is unidirectional: **state flows down; events flow up**. The parent updates state, Compose recomposes, and the child receives the new value.\n\nState can also come from a ViewModel:\n```kotlin\n@Composable\nfun ProfileScreen(viewModel: ProfileViewModel) {\n    val uiState by viewModel.uiState.collectAsStateWithLifecycle()\n    NameInput(\n        name = uiState.name,\n        onNameChange = viewModel::onNameChange\n    )\n}\n```\n\nState hoisting makes composables easier to reuse, test, control, and connect to a ViewModel. Hoist state to the **lowest common owner that needs to read or change it**; small local UI state, such as whether a tooltip is expanded, can remain local.\n\n:::summary\n**Easy interview answer:**\n> State hoisting moves state out of a composable. The parent passes state down as parameters, and the child sends events back through callbacks. This supports unidirectional data flow and makes composables reusable and testable. Hoist state to its lowest common owner; not every UI state needs to live in a ViewModel.\n\n**Easy way to remember:**\nState down; events up.\n:::"

    starterQuestions.push({
      id: "android-viewmodel-orientation-change",
      section: "Android",
      difficulty: "Senior",
      tags: ["ViewModel", "ViewModelStore", "Configuration Change", "Lifecycle", "Internals"],
      question: "How does ViewModel survive an orientation change?",
      answer: "When the screen rotates, Android destroys the old Activity instance and creates a new one. The Activity does **not** survive, but its `ViewModel` can.\n\n### ViewModelStore owns the ViewModel\nAn Activity is a `ViewModelStoreOwner` and holds a `ViewModelStore`. `ViewModelProvider` checks the store: if the requested ViewModel is already there, it returns that instance; otherwise it creates and stores one.\n\n### What happens during rotation?\nAndroidX `ComponentActivity` retains the `ViewModelStore` across configuration changes using Android's non-configuration-instance mechanism, connected to `onRetainNonConfigurationInstance()`. The old Activity is destroyed, but the store and ViewModel remain in memory. The new Activity recovers the store, and `ViewModelProvider` returns the existing ViewModel rather than constructing another one.\n\n```text\nBefore rotation: Activity A → ViewModelStore X → ViewModel X\nAfter rotation:  Activity B → ViewModelStore X → ViewModel X\n```\n\n### When is the ViewModel cleared?\nWhen the Activity is destroyed, AndroidX distinguishes configuration change from a permanent finish. For a configuration change, it retains the store. When the Activity is actually finished, the store is cleared; its ViewModels are cleared and `onCleared()` is called. You do not call `onCleared()` yourself.\n\n`viewModelScope` belongs to the ViewModel, so it survives rotation too. When the ViewModel is cleared, its scope is cancelled.\n\n### Does it survive process death?\nNo. The ViewModel is retained in memory, not serialized. If Android kills the process, the ViewModel and its store are lost. Use `SavedStateHandle` for restorable UI state and persistent storage such as Room or DataStore for durable data.\n\n:::summary\n**Easy interview answer:**\n> A ViewModel survives rotation because it is held in a ViewModelStore, which AndroidX retains across configuration changes. The new Activity recovers that store, and ViewModelProvider returns the existing instance. When the Activity is permanently finished, the store is cleared, `onCleared()` runs, and `viewModelScope` is cancelled. A ViewModel does not survive process death.\n:::"
    });

    starterQuestions.push({
      id: "android-viewmodel-factory-purpose",
      section: "Android",
      difficulty: "Standard",
      tags: ["ViewModel", "ViewModelFactory", "Dependency Injection"],
      question: "Why do we use ViewModelFactory in ViewModel?",
      answer: "We use a **ViewModelFactory when a ViewModel needs constructor dependencies or custom creation logic**.\n\nFor example, this ViewModel needs a repository:\n```kotlin\nclass UserViewModel(\n    private val repository: UserRepository\n) : ViewModel()\n```\n\nAndroid cannot create it with `UserViewModel()` because it needs a `UserRepository`. A factory tells `ViewModelProvider` how to construct it:\n```kotlin\nclass UserViewModelFactory(\n    private val repository: UserRepository\n) : ViewModelProvider.Factory {\n    override fun <T : ViewModel> create(modelClass: Class<T>): T {\n        return UserViewModel(repository) as T\n    }\n}\n```\n\nThe Activity can pass the factory when requesting the ViewModel:\n```kotlin\nval factory = UserViewModelFactory(repository)\nval viewModel = ViewModelProvider(this, factory)[UserViewModel::class.java]\n```\n\n`ViewModelProvider` checks the `ViewModelStore` first. If the ViewModel already exists, it returns that instance. If not, it asks the factory to create one and stores it.\n\nThe responsibilities are different:\n```text\nViewModelFactory → creates the ViewModel\nViewModelStore   → stores/retains the ViewModel\nViewModelProvider → returns an existing one or asks the Factory to create it\n```\n\nAfter rotation, the new Activity's provider finds the retained ViewModel in the `ViewModelStore`; the factory does not create another one.\n\n### What about Hilt?\nWith Hilt, we normally do not write this factory manually:\n```kotlin\n@HiltViewModel\nclass UserViewModel @Inject constructor(\n    private val repository: UserRepository\n) : ViewModel()\n```\n\nHilt handles ViewModel creation and dependency injection.\n\n:::summary\n**Easy interview answer:**\n> A ViewModelFactory creates a ViewModel when it has constructor dependencies or custom creation logic. ViewModelProvider first checks the ViewModelStore; if an instance exists, it returns it, otherwise it uses the Factory and stores the result. The Factory creates, the ViewModelStore retains. With Hilt, creation and dependency injection are normally handled for us.\n:::"
    });

    starterQuestions.push({
