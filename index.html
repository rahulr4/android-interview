<!doctype html>
<html lang="en"><head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5f6f2">
  <title>Android Interview Prep</title>
  <style>
    :root {
      color-scheme: light;
      --canvas: #f5f6f2;
      --paper: #fff;
      --ink: #202720;
      --muted: #70786f;
      --line: #dce1d9;
      --forest: #285d46;
      --forest-pale: #e6efe8;
      --coral: #c4523c;
      --coral-pale: #f8e9e4;
      --gold: #a8781b;
      --gold-pale: #f5efd9;
      --shadow: 0 14px 40px rgba(32, 39, 32, .07);
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--canvas);
      color: var(--ink);
      font: 15px/1.5 "Avenir Next", Avenir, "Segoe UI", sans-serif;
    }
    button, input, select, textarea { font: inherit; }
    button { cursor: pointer; }
    .shell { min-height: 100vh; }
    .topbar {
      height: 66px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 34px;
      border-bottom: 1px solid var(--line);
      background: rgba(255, 255, 255, .76);
    }
    .brand { display: flex; align-items: center; gap: 11px; font-weight: 750; }
    .brand-mark {
      display: grid;
      width: 30px;
      height: 30px;
      place-items: center;
      background: var(--forest);
      color: white;
      font-family: Georgia, serif;
      font-size: 18px;
    }
    .top-meta { color: var(--muted); font-size: 12px; }
    .workspace {
      display: grid;
      grid-template-columns: 218px minmax(0, 1fr);
      min-height: calc(100vh - 66px);
      max-width: 1600px;
      margin: 0 auto;
    }
    .sidebar { padding: 28px 16px; border-right: 1px solid var(--line); }
    .side-label, .field-label {
      display: block;
      margin: 0 0 9px;
      color: var(--muted);
      font-size: 10px;
      font-weight: 750;
      letter-spacing: .09em;
      text-transform: uppercase;
    }
    .side-label { padding: 0 10px; }
    .nav-list { display: grid; gap: 3px; }
    .nav-item {
      display: flex;
      width: 100%;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 9px 10px;
      border: 0;
      background: transparent;
      color: var(--muted);
      text-align: left;
      border-radius: 4px;
      font-size: 13px;
    }
    .nav-item:hover { background: rgba(255, 255, 255, .75); color: var(--ink); }
    .nav-item.active { background: var(--forest-pale); color: var(--forest); font-weight: 700; }
    .nav-count { color: inherit; font-size: 11px; opacity: .7; }
    .side-divider { height: 1px; margin: 22px 8px; background: var(--line); }
    .sidebar-note { margin: 26px 10px 0; color: var(--muted); font-size: 11px; }
    .main { min-width: 0; padding: 38px clamp(20px, 4vw, 54px) 52px; }
    .eyebrow { color: var(--coral); font-size: 10px; font-weight: 800; letter-spacing: .13em; text-transform: uppercase; }
    h1 { margin: 7px 0 3px; font: 500 36px/1.15 Georgia, "Times New Roman", serif; letter-spacing: 0; }
    .subtitle { margin: 0; color: var(--muted); font-size: 13px; }
    .toolbar { display: flex; flex-wrap: wrap; gap: 9px; margin: 27px 0 20px; }
    .search-wrap { position: relative; flex: 1 1 210px; }
    .search-wrap span { position: absolute; left: 12px; top: 8px; color: var(--muted); }
    .search-wrap input { padding-left: 34px; }
    input, select, textarea {
      width: 100%;
      min-height: 38px;
      padding: 8px 10px;
      border: 1px solid var(--line);
      border-radius: 3px;
      outline: none;
      background: var(--paper);
      color: var(--ink);
    }
    input:focus, select:focus, textarea:focus { border-color: var(--forest); box-shadow: 0 0 0 2px rgba(40, 93, 70, .1); }
    .toolbar select { width: auto; min-width: 125px; }
    .list-heading { display: flex; justify-content: space-between; padding: 0 2px 9px; color: var(--muted); font-size: 11px; }
    .question-list { display: grid; gap: 8px; }
    .question-row {
      width: 100%;
      padding: 15px 16px;
      border: 1px solid var(--line);
      border-left: 3px solid transparent;
      border-radius: 4px;
      background: var(--paper);
      color: var(--ink);
      text-align: left;
      transition: border-color .16s ease, transform .16s ease, box-shadow .16s ease;
      animation: arrive .24s ease both;
    }
    .question-row:hover { transform: translateY(-1px); box-shadow: var(--shadow); }
    .question-row.selected { border-left-color: var(--coral); border-color: #e7c8bf; border-radius: 4px 4px 0 0; margin-bottom: 0; }
    .question-title { display: block; margin-bottom: 11px; font-weight: 650; line-height: 1.45; }
    .tags { display: flex; flex-wrap: wrap; gap: 6px; }
    .tag { padding: 3px 7px; border-radius: 3px; background: var(--forest-pale); color: var(--forest); font-size: 10px; font-weight: 700; }
    .tag.standard { background: var(--gold-pale); color: var(--gold); }
    .tag.easy { background: #e8edf5; color: #4d6485; }
    .tag.hard { background: var(--coral-pale); color: var(--coral); }
    .tag.senior { background: var(--coral-pale); color: var(--coral); }
    .tag.staff { background: var(--forest-pale); color: var(--forest); }
    .empty { padding: 28px 14px; border: 1px dashed #c7cec5; color: var(--muted); text-align: center; font-size: 13px; }
    .editor { padding: 28px 0 40px; border-top: 1px solid var(--line); background: transparent; }
    .editor.after-question { margin-top: -8px; padding: 20px 16px 28px; border: 1px solid #e7c8bf; border-top: 0; border-left: 3px solid var(--coral); border-radius: 0 0 4px 4px; background: var(--paper); }
    .editor-top { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 18px; }
    h2 { margin: 0; font: 500 23px/1.2 Georgia, "Times New Roman", serif; letter-spacing: 0; }
    .form-field { margin-bottom: 15px; }
    textarea { min-height: 100px; resize: vertical; }
    #answer { min-height: 145px; }
    .field-pair { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .primary, .secondary, .danger {
      min-height: 38px;
      padding: 8px 13px;
      border: 1px solid transparent;
      border-radius: 3px;
      font-size: 12px;
      font-weight: 700;
    }
    .primary { background: var(--forest); color: white; }
    .primary:hover { background: #1d4936; }
    .secondary { border-color: var(--line); background: var(--paper); color: var(--ink); }
    .secondary:hover { border-color: #aab5a9; }
    .danger { border-color: #e9c9c0; background: var(--coral-pale); color: var(--coral); }
    .form-actions { display: flex; gap: 8px; margin-top: 19px; }
    .form-actions .primary { flex: 1; }
    .detail-answer { color: #424a42; white-space: normal; font-size: 13px; }
    .detail-answer p { margin: 0 0 14px; }
    .detail-answer h3 { margin: 22px 0 10px; color: var(--ink); font: 600 15px/1.35 "Avenir Next", Avenir, "Segoe UI", sans-serif; }
    .detail-answer ul { margin: 0 0 16px; padding-left: 22px; }
    .detail-answer li { margin: 5px 0; }
    .detail-answer blockquote {
      margin: 14px 0;
      padding: 11px 14px;
      border-left: 3px solid var(--coral);
      background: var(--coral-pale);
      color: var(--ink);
    }
    .detail-answer p code, .detail-answer li code, .detail-answer blockquote code, .answer-summary code {
      padding: 2px 5px;
      border-radius: 3px;
      background: var(--forest-pale);
      color: var(--forest);
      font: 12px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    }
    .detail-answer .answer-summary {
      margin: 18px 0;
      padding: 14px 16px 5px;
      border-left: 3px solid var(--forest);
      border-radius: 3px;
      background: var(--forest-pale);
    }
    .detail-answer pre {
      overflow-x: auto;
      margin: 12px 0 18px;
      padding: 14px 16px;
      border-left: 3px solid var(--coral);
      border-radius: 3px;
      background: var(--ink);
      color: var(--canvas);
      font: 12px/1.65 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      white-space: pre;
    }
    .detail-question { margin: 0 0 16px; font: 500 20px/1.4 Georgia, "Times New Roman", serif; }
    .answer-label { margin: 24px 0 8px; color: var(--muted); font-size: 10px; font-weight: 750; letter-spacing: .09em; text-transform: uppercase; }
    .detail-actions { display: flex; gap: 8px; margin-top: 24px; }
    .detail-empty { padding-top: 35px; color: var(--muted); font-size: 13px; }
    .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0; }
    @keyframes arrive { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }

    @media (max-width: 980px) {
      .workspace { grid-template-columns: 190px minmax(0, 1fr); }
      .editor { border-top: 1px solid var(--line); }
    }
    @media (max-width: 620px) {
      .topbar { height: 58px; padding: 0 16px; }
      .top-meta { font-size: 10px; }
      .workspace { display: block; }
      .sidebar { padding: 13px 14px; border-right: 0; border-bottom: 1px solid var(--line); }
      .side-divider, .sidebar-note { display: none; }
      .nav-list { display: flex; overflow-x: auto; gap: 5px; }
      .nav-item { width: auto; min-width: max-content; padding: 7px 10px; }
      .main { padding: 26px 16px 30px; }
      h1 { font-size: 31px; }
      .toolbar select { flex: 1; }
      .editor { padding: 25px 16px 36px; border-top: 1px solid var(--line); }
      .editor.after-question { padding: 18px 12px 24px; border-top: 0; }
    }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { scroll-behavior: auto !important; animation-duration: .01ms !important; transition-duration: .01ms !important; } }
  </style>

        <div class="toolbar">
          <label class="search-wrap"><span aria-hidden="true">⌕</span><span class="sr-only">Search questions</span><input id="searchInput" type="search" placeholder="Search questions" autocomplete="off"></label>
          <button class="secondary" id="exportHtml" type="button">Export HTML</button>
          <button class="secondary" id="loadFileAnswers" type="button">Load file answers</button>

        <div class="list-heading"><span id="resultCount">Questions</span><span>SELECT TO REVIEW</span></div>

  <script>
    const storageKey = "android-interview-prep-questions-v1";
    const repositoryQuestions = [{"id":"coroutine-context-state-machine","question":"What is Coroutine Context and State Machine? How do coroutines work internally?","section":"Coroutines","difficulty":"Standard","tags":[],"answer":"**CoroutineContext is the configuration of a coroutine.** It tells the coroutine how to run and manages its lifecycle. It can also contain a name or an exception handler.\n\nCommon elements are:\n\n- `Job` — controls coroutine lifecycle and cancellation.\n- `CoroutineDispatcher` — determines where coroutine execution happens.\n- `CoroutineName` — gives the coroutine a name, useful for debugging.\n- `CoroutineExceptionHandler` — handles uncaught exceptions.\n\n### 2. What is a Continuation?\nA `Continuation` represents **where the coroutine should continue execution after suspension**.\n\nWhen a coroutine suspends, Kotlin needs to remember:\n\n- where execution stopped\n- local variables\n- what code should execute next\n- the coroutine's context\nThat information is represented through a **Continuation**.\n\n### 3. What is a Coroutine State Machine?\nA `suspend` function is transformed by the Kotlin compiler into a **state machine**.\n\nFor example:\n\n```\nsuspend fun loadData() {\n    val user = getUser()\n    val posts = getPosts(user)\n    show(posts)\n}\n```\n\nConceptually:\n\n```\nSTATE 0\n  ↓\ngetUser()\n  ↓\nSTATE 1\n  ↓\ngetPosts()\n  ↓\nSTATE 2\n  ↓\nshow()\n  ↓\nCOMPLETED\n```\n\nEach suspension point becomes a state.\n\n### 4. How does suspension work internally?\nWhen the coroutine reaches a suspension point:\n\n```\nExecute\n   ↓\nSuspension point\n   ↓\nSave state in Continuation\n   ↓\nReturn COROUTINE_SUSPENDED\n   ↓\nThread is free\n```\n\nThe important point is:\n\n> **The coroutine suspends, not the thread.**\nWhen the asynchronous operation finishes:\n\n```\nOperation completes\n   ↓\nContinuation.resume()\n   ↓\nDispatcher schedules execution\n   ↓\nState machine resumes\n   ↓\nContinue from where it stopped\n```\n\nFor example, inside a ViewModel:\n```kotlin\nviewModelScope.launch(Dispatchers.IO) {\n    fetchUser()\n}\n```\n\nHere:\n- `Dispatchers.IO` selects the dispatcher used to run the coroutine.\n- `Job` manages lifecycle and cancellation. `launch` creates a child Job, cancelled when `viewModelScope` is cancelled.\n- `CoroutineName` and `CoroutineExceptionHandler` are other possible context elements.\n\nNow suppose we have:\n```kotlin\nsuspend fun fetchUser() {\n    val user = api.getUser()      // suspension point\n    val posts = api.getPosts()    // suspension point\n    showData(user, posts)\n}\n```\n\nInternally, Kotlin converts this into a state machine:\n```text\nState 0: call getUser()\n         suspend\n\nState 1: user received; call getPosts()\n         suspend\n\nState 2: posts received; showData()\n```\n\nWhen `getUser()` is waiting for the network response, **the thread is not blocked**. The coroutine suspends, and Kotlin remembers:\n> I stopped after `getUser()`. When the result comes back, continue from here.\n\nA **Continuation** stores the current state and local values needed to resume. When the network response arrives, it resumes with the result or an exception.\n\n:::summary\n**Easy way to remember:**\n- **CoroutineContext** = how and where the coroutine runs.\n- **Continuation** = remembers where to resume.\n- **State Machine** = represents the different stages of the suspend function.\n- **Coroutine** = suspends instead of blocking the thread.\n:::\n\n**Extra interview point:** `suspend` alone does not switch threads. The dispatcher controls where coroutine code runs; use `withContext` when you need to change dispatchers."},{"id":"finite-state-machine-coroutines","section":"Coroutines","difficulty":"Standard","question":"What is a Finite State Machine in coroutines?","answer":"A **Finite State Machine (FSM)** means something can be in a limited number of states and moves from one state to another based on an event.\n\nIn coroutines, the Kotlin compiler converts a `suspend` function into a state machine where **each suspension point represents a state**.\n\nFor example:\n```kotlin\nsuspend fun fetchData() {\n    val user = getUser()       // suspension point\n    val posts = getPosts(user) // suspension point\n    showData(posts)\n}\n```\n\nYou can imagine it as:\n```text\nState 0: call getUser()\n         suspend\n\nState 1: user received; call getPosts()\n         suspend\n\nState 2: posts received; call showData()\n         complete\n```\n\nThe coroutine's **Continuation remembers the current state**. If `getUser()` suspends, it resumes at the next state instead of starting the function again.\n\n:::summary\n**Easy way to remember:**\n**FSM = Kotlin breaks a suspend function into states so the coroutine knows where to continue after suspension.**\n:::"},{"id":"unconfined-dispatcher-coroutines","question":"What is the Unconfined Dispatcher in coroutines?","section":"Coroutines","difficulty":"Standard","tags":[],"answer":"`Dispatchers.Unconfined` means the coroutine is **not confined to any specific thread**.\n\nFor example:\n\n```\nlaunch(Dispatchers.Unconfined) {\n    println(Thread.currentThread().name)\n\n    delay(1000)\n\n    println(Thread.currentThread().name)\n}\n```\n\nBefore `delay()`, the coroutine starts on the **current/caller thread**.\n\nAfter `delay()`, it may resume on a **different thread**, depending on the suspending function that resumes it.\n\nSo you might see:\n\n```\nmain\nkotlinx.coroutines.DefaultExecutor\n```\n\nThis is different from:\n\n```\nlaunch(Dispatchers.Main) { }\n```\n\nwhere the coroutine is dispatched back to the **Main thread**.\n\n**Easy way to remember:**\n`Unconfined` = **no fixed thread. It starts in the caller thread, but after suspension it may resume somewhere else.**\n\nIt is generally **not used for normal Android application code**, because thread execution becomes harder to predict."},{"id":"inject-dispatchers-clean-architecture","question":"Where should we define dispatchers in Clean Architecture?","section":"Clean Architecture","difficulty":"Standard","tags":[],"answer":"In Clean Architecture, we should generally **inject dispatchers instead of hardcoding them**.\n\nFor example, instead of:\n\n```\nclass UserRepository {\n    suspend fun getUsers() = withContext(Dispatchers.IO) {\n        api.getUsers()\n    }\n}\n```\n\nDefine a dispatcher provider:\n\n```\ninterface DispatcherProvider {\n    val io: CoroutineDispatcher\n    val default: CoroutineDispatcher\n    val main: CoroutineDispatcher\n}\n```\n\nImplementation:\n\n```\nclass DefaultDispatcherProvider : DispatcherProvider {\n    override val io = Dispatchers.IO\n    override val default = Dispatchers.Default\n    override val main = Dispatchers.Main\n}\n```\n\nThen inject it:\n\n```\nclass UserRepository(\n    private val dispatchers: DispatcherProvider\n) {\n    suspend fun getUsers() = withContext(dispatchers.io) {\n        api.getUsers()\n    }\n}\n```\n\nThe main reason is **testability**. In production we use `Dispatchers.IO`, but during unit tests we can replace it with a test dispatcher:\n\n```\nval testDispatcher = StandardTestDispatcher(testScheduler)\n\nval repository = UserRepository(\n    dispatchers = TestDispatcherProvider(testDispatcher)\n)\n```\n\nNow we can **control coroutine execution in tests** instead of depending on real background threads.\n\nAlso, the layer performing blocking or CPU-intensive work should choose the appropriate dispatcher, making its suspend functions **main-safe**.\n\n**Easy way to remember:**\n\n> **Don't hardcode dispatchers everywhere. Inject them so threading is centralized and, most importantly, easy to replace during testing.**"},{"id":"structured-concurrency-resource-leaks","question":"How does structured concurrency prevent resource leaks? What happens when a parent coroutine is cancelled?","section":"Coroutines","difficulty":"Senior","tags":[],"answer":"**Structured concurrency** means child coroutines are tied to the lifecycle of their parent. A parent does not complete until its children complete, and cancelling the parent also cancels its children.\n\nFor example:\n```kotlin\nviewModelScope.launch {          // Parent\n    launch { fetchUser() }       // Child 1\n    launch { fetchArticles() }   // Child 2\n}\n```\n\nIf the ViewModel is cleared, cancellation flows down the Job hierarchy:\n```text\nviewModelScope cancelled\n        ↓\nParent Job cancelled\n        ↓\nChild 1 cancelled\nChild 2 cancelled\n```\n\nThis prevents **resource leaks** because work doesn't continue after the scope that owns it is gone. For example, a network request or database operation shouldn't keep running after its screen/ViewModel is destroyed.\n\nCancellation works through the **Job hierarchy**. Every coroutine has a `Job`, and child jobs are linked to their parent's job.\n\n```\nParent Job\n   ├── Child Job 1\n   └── Child Job 2\n```\n\nWhen the parent is cancelled, cancellation propagates **downward** to all its children.\nCancellation is **cooperative**. Suspending functions such as `delay()` check for cancellation and throw a `CancellationException`. A `finally` block can then release resources:\n```kotlin\nviewModelScope.launch {\n    try {\n        fetchData()\n    } finally {\n        closeResource()\n    }\n}\n```\n\n:::summary\n**Easy way to explain it:**\n> The parent owns its children and waits for them. Cancelling the parent propagates cancellation down the Job hierarchy. Children stop cooperatively, and `finally` blocks can clean up resources. This prevents work from outliving the component that started it.\n:::\n\nThink about it as a **parent with two children**:\n```text\nParent Coroutine\n   ├── Child A\n   └── Child B\n```\n\nThere are two different situations.\n\n### 1. Parent is cancelled → all children are cancelled\n```text\nParent ❌\n   ↓\n   ├── Child A ❌\n   └── Child B ❌\n```\n\nFor example:\n```kotlin\nviewModelScope.launch {\n    launch { fetchUser() }\n    launch { fetchArticles() }\n}\n```\n\nIf the parent is cancelled, both `fetchUser()` and `fetchArticles()` are cancelled. This is **downward cancellation**.\n\n### 2. A child fails → normally the whole family is cancelled\nSuppose Child A throws an exception:\n```text\nParent\n   ├── Child A 💥\n   └── Child B\n```\n\nWith a normal `Job`, Child A's failure propagates **up to the parent**. The parent gets cancelled, which then cancels Child B:\n```text\nChild A 💥\n    ↑\n Parent ❌\n    ↓\n Child B ❌\n```\n\n### What does `SupervisorJob` change?\nA `SupervisorJob` says:\n> **If one child fails, don't cancel the other children.**\n\n```text\nSupervisorJob\n   ├── Child A 💥\n   └── Child B ✅ keeps running\n```\n\nFor example:\n```kotlin\nsupervisorScope {\n    launch {\n        fetchUser()       // fails 💥\n    }\n\n    launch {\n        fetchArticles()   // keeps running ✅\n    }\n}\n```\n\nBut if the **supervisor itself is cancelled**, both children are still cancelled:\n```text\nSupervisor ❌\n     ↓\n ├── Child A ❌\n └── Child B ❌\n```\n\n### Easy interview explanation\n> **With a normal Job, if the parent is cancelled, all children are cancelled. If one child fails, that failure goes to the parent, which can cancel the other children as well.**\n>\n> **With SupervisorJob, one child's failure doesn't affect its siblings. But cancelling the parent still cancels all children.**\n\nSo remember:\n```text\nNormal Job\nChild fails → Parent cancelled → Siblings cancelled\n\nSupervisorJob\nChild fails → Other children continue\n\nBoth\nParent cancelled → All children cancelled\n```"},{"id":"coroutine-scope-vs-supervisor-scope","section":"Coroutines","difficulty":"Senior","tags":["ViewModel"],"question":"Explain the difference between supervisorScope and coroutineScope. When would you use SupervisorJob in a ViewModel and what are the pitfalls?","answer":"The main difference is **what happens when one child coroutine fails**.\n\nWith `coroutineScope`, if one child fails, the **whole scope fails and the other children are cancelled**:\n```kotlin\ncoroutineScope {\n    launch { loadProfile() }           // fails\n    launch { loadRecommendations() }   // cancelled\n}\n```\n\nThink of it as:\n```text\nChild A 💥\n   ↓\nParent ❌\n   ↓\nChild B ❌\n```\n\nThis is useful when the tasks **depend on each other** and the overall operation should fail if any part fails.\n\nWith `supervisorScope`, one child's failure **doesn't automatically cancel its siblings**:\n```kotlin\nsupervisorScope {\n    launch { loadProfile() }          // fails\n    launch { loadRecommendations() }  // continues\n}\n```\n\n```text\nChild A 💥\n\nChild B ✅ continues\n```\n\nUse this when operations are **independent**.\n\n### What about `SupervisorJob` in a ViewModel?\nAndroid's `viewModelScope` already uses a `SupervisorJob`, so normally **you don't need to create another one**. This lets independent ViewModel operations fail separately:\n```kotlin\nviewModelScope.launch { loadProfile() }       // fails\nviewModelScope.launch { loadNotifications() }  // keeps running\n```\n\nOne operation failing should not necessarily cancel every other operation in the ViewModel.\n\n### What's the pitfall?\nThe biggest pitfall is thinking `SupervisorJob` **handles exceptions**. It does not. The exception still needs to be handled appropriately:\n```kotlin\nviewModelScope.launch {\n    try {\n        loadProfile()\n    } catch (e: Exception) {\n        // update UI or handle the error\n    }\n}\n```\n\nAlso, don't use supervision when tasks **must succeed or fail together**. In that situation, `coroutineScope` is usually the better choice.\n\n:::summary\n**Easy interview answer:**\n> `coroutineScope` is fail-fast: one child failure cancels the other children. `supervisorScope` isolates child failures so siblings can continue.\n>\n> In a ViewModel, independent UI operations benefit from supervision. `viewModelScope` already uses a `SupervisorJob`. Supervision changes failure propagation; it does not handle exceptions.\n:::"},{"id":"launch-async-exception-handling","question":"What is the difference between launch and async exception handling? How do uncaught exceptions propagate through the Job hierarchy?","section":"Coroutines","difficulty":"Senior","tags":["Exception Handling"],"answer":"The easiest way to remember is:\n\n> **`launch` → exception is thrown immediately.**\n> **`async` → exception is stored in `Deferred` and observed through `await()`.**\n\n### `launch`\n\n```\nviewModelScope.launch {\n    throw RuntimeException(\"Something went wrong\")\n}\n```\n\n`launch` returns a `Job`, so there is **no result to await**.\n\nIf the exception isn't handled, it propagates to the parent according to the Job hierarchy.\n\n```\nChild launch 💥\n      ↑\n    Parent ❌\n      ↓\n Other children ❌\n```\n\nWith a normal `Job`, a child's unhandled exception cancels its parent, which then cancels the other children.\n\n### `async`\n`async` is normally used when we expect a result:\n\n```\nval user = async {\n    getUser()\n}\n\nval result = user.await()\n```\n\nIf `getUser()` fails, the exception is captured by the `Deferred`.\n\nWhen we call:\n\n```\nuser.await()\n```\n\nthe exception is rethrown to the caller.\n\nSo we can handle it:\n\n```\ntry {\n    user.await()\n} catch (e: Exception) {\n    // handle error\n}\n```\n\n### Important senior-level detail\nA common misconception is:\n\n> \"`async` exceptions don't propagate until `await()`.\"\nThat's **not completely true**.\n\nIf `async` is a **child of a normal structured scope**, its failure still cancels its parent even if you haven't called `await()` yet.\n\n```\ncoroutineScope {\n\n    val user = async {\n        getUser() // 💥\n    }\n\n    // Parent scope can already be cancelled here\n\n    user.await()\n}\n```\n\n`await()` is how the caller **observes/rethrows the result exception**; it isn't necessarily what triggers parent cancellation.\n\nWith `supervisorScope`, the failure doesn't automatically cancel the supervisor or siblings:\n\n```\nsupervisorScope {\n\n    val user = async {\n        getUser() // 💥\n    }\n\n    // Other children can continue\n\n    try {\n        user.await()\n    } catch (e: Exception) {\n        // handle async failure\n    }\n}\n```\n\n### Easy interview answer\n\n> **`launch` is fire-and-forget and returns a Job. An uncaught exception is propagated through the coroutine hierarchy. `async` returns a Deferred and its exception is rethrown when we call `await()`.**\n> \n> **But with normal structured concurrency, a failing `async` child can still cancel its parent immediately. `await()` is how we receive that exception as the result. With supervision, child failures can be isolated.**"},{"id":"coroutine-dispatcher-vs-executor","question":"How does CoroutineDispatcher differ from Java's Executor?","section":"Coroutines","difficulty":"Senior","tags":["Threading"],"answer":"Both decide **where work should run**, but `CoroutineDispatcher` is designed for coroutines.\n\nA Java `Executor` says, \"Run this task on one of my threads.\"\n```java\nexecutor.execute(() -> doSomething());\n```\n\nA `CoroutineDispatcher` says:\n> **“Run/resume this coroutine on the appropriate thread.”**\n\n```kotlin\nlaunch(Dispatchers.IO) {\n    doSomething()\n}\n```\n\nA coroutine can suspend and later resume, and its dispatcher determines where that continuation executes. \n\n### What is thread confinement?\nThread confinement means **restricting work to a particular thread**. \nFor eg: Android UI updates must happen on the Main thread:\n```kotlin\nwithContext(Dispatchers.Main) {\n    textView.text = \"Hello\"\n}\n```\n\n### `Dispatchers.Main` vs. `Dispatchers.Main.immediate`\nSuppose we're **already on the Main thread**:\n\n```\nwithContext(Dispatchers.Main) {\n    updateUI()\n}\n```\n\n`Dispatchers.Main` may **schedule/dispatch** the work onto the Main thread's queue.\n\nBut:\n\n```\nwithContext(Dispatchers.Main.immediate) {\n    updateUI()\n}\n```\n\nIf we're **already on the Main thread**, `Main.immediate` can execute it **immediately instead of dispatching it again**.\n\nThink of it like:\n\n```\nAlready on Main Thread\n\nDispatchers.Main\n      ↓\nMain queue\n      ↓\nExecute later\n\nDispatchers.Main.immediate\n      ↓\nExecute now\n```\n\nIf you're **not** on the Main thread, both dispatch to the Main thread.\n\n:::summary\n**Easy interview answer:**\n> Java `Executor` executes tasks on threads. `CoroutineDispatcher` is coroutine-aware and determines where a coroutine runs and resumes after suspension. \nThread confinement restricts work to a thread, such as UI work on Main.\n`Main.immediate` is an optimized version of `Main`: if I'm already on the Main thread, it can execute immediately instead of dispatching the work again.\n:::"},{"id":"continuation-interceptor-dispatchers","question":"What is ContinuationInterceptor and how does it relate to Dispatchers?","section":"Coroutines","difficulty":"Staff","tags":["Internals"],"answer":"Think of it this way:\n- **Continuation** knows **where the coroutine should continue**.\n- **ContinuationInterceptor** gets a chance to intercept it before it continues.\n- **Dispatcher** uses that interception to decide **which thread should run it**.\n\nExample:\n```kotlin\nlaunch(Dispatchers.IO) {\n    val user = getUser()  // suspends here\n    showUser(user)\n}\n```\n\nWhen `getUser()` finishes:\n```text\ngetUser() completes\n       ↓\nContinuation says: \"I need to continue\"\n       ↓\nDispatcher intercepts it\n       ↓\nSchedules it on its thread\n       ↓\nshowUser(user) continues\n```\nSo `Dispatchers.IO` can essentially say:\n\n> \"Before this continuation resumes, I'll make sure it's scheduled on the thread/executor I manage.\"\n\n`CoroutineDispatcher` internally implements `ContinuationInterceptor`.\n```\nabstract class CoroutineDispatcher :\n    AbstractCoroutineContextElement(ContinuationInterceptor),\n    ContinuationInterceptor\n```\n\nThat's also why the dispatcher is part of the `CoroutineContext`.\n\n\n:::summary\n**Easy interview answer:**\n> Continuation remembers where the coroutine needs to continue. ContinuationInterceptor allows that continuation to be intercepted, and CoroutineDispatcher uses it to decide where the coroutine should resume.\n>\n> Simply: **Continuation = what to resume, Dispatcher = where to resume it.**\n:::"},{"id":"feature-module-interaction","section":"Multi-Module","difficulty":"Standard","tags":["Architecture","Dependency Injection"],"question":"In a multi-module project, how do two feature modules interact with each other?","answer":"Ideally, **feature modules should not directly depend on each other**.\n\nFor example:\n```text\nfeature-home\nfeature-profile\n```\n\nAvoid a direct dependency:\n```text\nfeature-home → feature-profile\n```\n\nInstead, they can communicate through a **shared contract/interface** or the **app/navigation layer**. For example, Home wants to open Profile:\n```kotlin\ninterface ProfileNavigator {\n    fun openProfile(userId: String)\n}\n```\n\n`feature-home` only knows this interface:\n```kotlin\nclass HomeViewModel(\n    private val profileNavigator: ProfileNavigator\n) {\n    fun onProfileClick(userId: String) {\n        profileNavigator.openProfile(userId)\n    }\n}\n```\n\nThe app/navigation module provides the actual implementation and opens the Profile feature:\n```text\nFeature Home\n     ↓\nInterface / Contract\n     ↓\nApp / Navigation\n     ↓\nFeature Profile\n```\n\nFor sharing data, both features can depend on a common `domain` or `core` module:\n```text\nFeature Home ──→ Domain/Core ←── Feature Profile\n```\n\n:::summary\n**Easy interview answer:**\n> Feature modules should ideally be independent and shouldn't directly depend on each other. For navigation, use an interface or navigation contract implemented by the app/navigation layer. For shared data or business logic, both features depend on a common core/domain module.\n:::\n\nThis avoids **circular dependencies** and keeps features loosely coupled."},{"id":"feature-access-app-implementation","section":"Multi-Module","difficulty":"Standard","tags":["Dependency Injection"],"question":"If an implementation is written in the app module, how do you access it from a feature module?","answer":"A feature module **cannot directly access the app module**, because the app already depends on the feature.\n\n```text\nApp → Feature\n```\n\nIf Feature also depends on App, it creates a **circular dependency**:\n```text\nApp → Feature → App ❌\n```\n\nInstead, put an **interface in a shared/core module**:\n```kotlin\n// core module\ninterface Analytics {\n    fun track(event: String)\n}\n```\n\nThe feature depends only on this interface:\n```kotlin\n// feature-home module\nclass HomeViewModel(\n    private val analytics: Analytics\n) {\n    fun onClick() {\n        analytics.track(\"button_clicked\")\n    }\n}\n```\n\nThe implementation stays in the app module:\n```kotlin\n// app module\nclass AnalyticsImpl : Analytics {\n    override fun track(event: String) {\n        // Firebase / Amplitude etc.\n    }\n}\n```\n\nThe Hilt binding also stays in the app module:\n```kotlin\n@Module\n@InstallIn(SingletonComponent::class)\nabstract class AnalyticsModule {\n    @Binds\n    abstract fun bindAnalytics(\n        impl: AnalyticsImpl\n    ): Analytics\n}\n```\n\nThe dependency structure is:\n```text\n              Core\n         Analytics interface\n            ↑         ↑\n            |         |\n        Feature      App\n        uses it       |\n                 AnalyticsImpl\n                 + DI binding\n```\n\nHilt connects the interface and implementation at runtime.\n\n:::summary\n**Easy interview answer:**\n> The feature should not access the app module directly. Put an interface in a shared/core module. The feature depends on that interface, while the app module contains the implementation and DI binding. Hilt injects the app implementation into the feature. This avoids circular dependencies and keeps the feature independent.\n:::"},{"id":"circular-feature-navigation-dependency","section":"Multi-Module","difficulty":"Senior","tags":["Navigation","Hilt","Architecture"],"question":"How do you handle a circular dependency between two feature modules that need to navigate to each other?","answer":"Ideally, **one feature module should not directly depend on another feature module**.\n\nAvoid this circular dependency:\n```text\nFeature Home → Feature Profile\n      ↑                   |\n      └───────────────────┘\n```\n\nInstead, use **navigation contracts** in a shared `core` or `navigation` module.\n\n### 1. Define the interfaces in Core\n```kotlin\n// core/navigation\ninterface HomeNavigator {\n    fun openHome()\n}\n\ninterface ProfileNavigator {\n    fun openProfile(userId: String)\n}\n```\n\n### 2. Feature Home uses the interface\n```kotlin\n// feature-home\nclass HomeViewModel(\n    private val profileNavigator: ProfileNavigator\n) : ViewModel() {\n    fun onProfileClick(userId: String) {\n        profileNavigator.openProfile(userId)\n    }\n}\n```\n\nHome knows only about `ProfileNavigator`; it does not know about the Profile feature.\n\n### 3. Feature Profile uses the other interface\n```kotlin\n// feature-profile\nclass ProfileViewModel(\n    private val homeNavigator: HomeNavigator\n) : ViewModel() {\n    fun onHomeClick() {\n        homeNavigator.openHome()\n    }\n}\n```\n\nProfile does not know about the Home feature.\n\n### 4. The App module implements both contracts\nThe App module depends on both features, so it can connect them:\n```kotlin\n// app module\nclass AppNavigator @Inject constructor() :\n    HomeNavigator,\n    ProfileNavigator {\n\n    override fun openHome() {\n        // Navigate to Home\n    }\n\n    override fun openProfile(userId: String) {\n        // Navigate to Profile\n    }\n}\n```\n\n### 5. Bind both interfaces with Hilt in App\n```kotlin\n@Module\n@InstallIn(SingletonComponent::class)\nabstract class NavigationModule {\n    @Binds\n    @Singleton\n    abstract fun bindHomeNavigator(\n        impl: AppNavigator\n    ): HomeNavigator\n\n    @Binds\n    @Singleton\n    abstract fun bindProfileNavigator(\n        impl: AppNavigator\n    ): ProfileNavigator\n}\n```\n\nHilt provides `AppNavigator` whenever either feature requests its contract.\n\n### Dependency structure\n```text\n                    Core / Navigation\n              HomeNavigator  ProfileNavigator\n                    ↑                 ↑\n                    |                 |\n             Feature Home       Feature Profile\n                                     /\n                                    /\n                           App\n                       AppNavigator\n                 implements both contracts\n                      + Hilt bindings\n```\n\nThe Gradle dependencies point inward to Core; App depends on both features:\n```kotlin\n// app/build.gradle.kts\ndependencies {\n    implementation(project(\":feature-home\"))\n    implementation(project(\":feature-profile\"))\n    implementation(project(\":core-navigation\"))\n}\n```\n\nEach feature depends only on the navigation contract module:\n```kotlin\n// feature-home and feature-profile\ndependencies {\n    implementation(project(\":core-navigation\"))\n}\n```\n\nThere is no direct `Feature Home → Feature Profile` or `Feature Profile → Feature Home` dependency.\n\n:::summary\n**Easy interview answer:**\n> I don't make feature modules depend on each other. I define navigation contracts in a shared core/navigation module. Each feature depends only on those contracts, and the App module implements and binds them with Hilt because it knows about both features. The App then performs navigation. This breaks the circular dependency and keeps features independent.\n\n**Easy way to remember:**\nInterface in Core → Used by each Feature → Implemented by App → App opens the other Feature.\n:::"},{"id":"gradle-api-vs-implementation","section":"Multi-Module","difficulty":"Senior","tags":["Gradle","Build Performance"],"question":"Explain api vs implementation dependency in Gradle. What are the build performance and encapsulation trade-offs? When does leaking a transitive dependency become dangerous?","answer":"The simplest difference is:\n> **`implementation` keeps a dependency private to my module. `api` also exposes it to modules using my module.**\n\nSuppose the dependency graph is:\n```text\nApp\n ↓\nFeature A\n ↓\nCore\n```\n\n### `implementation`\n```kotlin\n// Feature A\ndependencies {\n    implementation(project(\":core\"))\n}\n```\n\nFeature A can use Core, but App cannot access Core through Feature A. If App also needs Core, App should declare it directly. This gives better **encapsulation**.\n\n### `api`\n```kotlin\n// Feature A\ndependencies {\n    api(project(\":core\"))\n}\n```\n\nNow Core is exposed to consumers of Feature A, so App can use Core without declaring it directly.\n\n### Why prefer `implementation`?\nWith `implementation`, consumers don't see the dependency on their compile classpath. This hides internal details, reduces unnecessary compile classpath entries, and can improve build performance because internal dependency changes are less likely to trigger recompilation of consumers.\n\n### When should we use `api`?\nUse `api` when the dependency is intentionally part of the module's public API. For example, if a public Feature A function returns a `User` type from Core, consumers need to see that type:\n```kotlin\n// Core\ndata class User(val name: String)\n\n// Feature A public API\nclass UserRepository {\n    fun getUser(): User = TODO()\n}\n```\n\n### When is transitive dependency leakage dangerous?\nSuppose Feature A exposes Retrofit with `api`. App may start using Retrofit without declaring it directly. If Feature A later replaces Retrofit with Ktor, App can break because it depended on an implementation detail indirectly.\n\n:::summary\n**Easy interview answer:**\n> `implementation` keeps a dependency private, while `api` exposes it to consumers. I generally prefer `implementation` for encapsulation, a smaller compile classpath, and better build performance. I use `api` when dependency types are part of my public contract. Leakage is dangerous when a consumer starts relying on an indirectly exposed dependency, because changing that dependency can break the consumer.\n\n**Easy way to remember:**\n`implementation` = “This is my dependency.”\n`api` = “This is my dependency, and I'm exposing it to you too.”\n:::"},{"id":"dynamic-feature-di-architecture","section":"Multi-Module","difficulty":"Staff","tags":["Dynamic Feature","Hilt","Dependency Injection"],"question":"How would you design a plugin-based architecture where feature modules can be loaded dynamically? What are the DI challenges?","answer":"I would design it so the **Base App can run independently**, and Dynamic Feature Modules are downloaded only when required.\n\nFor example, Chat is a Dynamic Feature:\n```text\n:core\n:app\n:feature-chat  ← Dynamic Feature\n```\n\nThe dependency direction is:\n```text\nfeature-chat → app → core\n```\n\nThe Base App must work without Chat. The user can install the App first and download Chat later. If App directly depended on Chat, it would expect Chat's code to be present as a normal dependency. Instead, the Dynamic Feature extends the already installed Base App and can use its code and resources.\n\n### Where do the classes live?\n```text\n:core\n├── Analytics interface\n├── UserRepository interface\n└── ApiService interface\n       ↑\n:app\n├── AnalyticsImpl\n├── UserRepositoryImpl\n├── ApiServiceImpl\n├── Main Hilt graph\n└── ChatDependencies EntryPoint\n       ↑\n:feature-chat\n├── ChatRepository\n├── ChatViewModel\n└── Chat UI\n```\n\nCore contains shared contracts. App contains common implementations and the main DI graph. The Dynamic Feature contains feature-specific code.\n\nFor example, Core defines a contract:\n```kotlin\ninterface Analytics {\n    fun track(event: String)\n}\n```\n\nApp provides the implementation and Hilt binding:\n```kotlin\nclass AnalyticsImpl @Inject constructor() : Analytics {\n    override fun track(event: String) {\n        // Send analytics event\n    }\n}\n\n@Module\n@InstallIn(SingletonComponent::class)\nabstract class AppModule {\n    @Binds\n    abstract fun bindAnalytics(impl: AnalyticsImpl): Analytics\n}\n```\n\n### Where does DI become difficult?\nChat may need App dependencies such as `Analytics`, `UserRepository`, and `Network`, but Chat might not be installed when App starts. Also, App cannot directly know about feature-specific classes such as `ChatRepository` or `ChatViewModel`. Chat needs dependencies from App, but App must not depend on Chat's classes.\n\n### Expose App dependencies through a Hilt EntryPoint\nDefine the EntryPoint in App and expose only what Chat needs:\n```kotlin\n@EntryPoint\n@InstallIn(SingletonComponent::class)\ninterface ChatDependencies {\n    fun analytics(): Analytics\n    fun userRepository(): UserRepository\n}\n```\n\nAfter Chat is installed, code in the feature can access the App graph:\n```kotlin\nval dependencies = EntryPointAccessors.fromApplication(\n    context.applicationContext,\n    ChatDependencies::class.java\n)\n\nval chatRepository = ChatRepository(\n    analytics = dependencies.analytics(),\n    userRepository = dependencies.userRepository()\n)\n```\n\nFor a larger feature, pass these dependencies into a feature-specific Dagger component instead of manually constructing every object. Dynamic Feature Modules are not regular Hilt injection targets, so use the EntryPoint as the boundary and create/inject feature objects through a supported Dagger component or factory.\n\n### Keep feature-specific dependencies inside the feature\nApp owns common dependencies such as Auth, Analytics, Network, and UserRepository. Chat owns ChatApi, ChatRepository, ChatViewModel, and its UI. Scope feature-specific objects to the feature lifecycle; do not make every feature dependency an application singleton.\n\nThe important distinction is:\n```text\nGradle dependency: Feature → App → Core\nRuntime DI access: App Hilt Graph → ChatDependencies → Dynamic Feature\n```\n\n:::summary\n**Easy interview answer:**\n> I use a Base App with Dynamic Feature Modules that can be downloaded on demand. The feature depends on the Base App, not the other way around. Shared contracts live in Core, and App owns their implementations and the main Hilt graph. Because App cannot depend on feature classes, the feature accesses required App dependencies through an App-defined Hilt EntryPoint, then creates its own feature-specific graph. I also scope feature dependencies to the feature lifecycle.\n\n**Easy way to remember:**\n`Chat → App → Core` for module dependencies; `App Hilt Graph → EntryPoint → Chat` for runtime DI.\n:::"},{"id":"gradle-performance-large-project","section":"Multi-Module","difficulty":"Staff","tags":["Gradle","Build Performance"],"question":"In a 50+ module project, how do you manage Gradle build times?","answer":"For a large project, I focus on **three main things**:\n```text\n1. Build avoidance\n2. Configuration Cache\n3. Module dependency graph\n```\n\n### 1. Build avoidance\nThe best way to make a build faster is to **not run work that doesn't need to run**. If I change only Feature Profile, ideally Gradle rebuilds that feature and only the downstream modules that actually need it—not unrelated features.\n\nI rely on incremental builds, task output caching/build cache, and up-to-date checks. Custom Gradle tasks and annotation/code-generation tools should be incremental and cacheable where possible.\n\n> **Don't make Gradle redo work whose inputs haven't changed.**\n\n### 2. Configuration Cache\nA Gradle build has a configuration phase, where it figures out projects, tasks, and dependencies, followed by task execution. In a 50+ module project, configuration itself can take time. Configuration Cache lets Gradle reuse the configuration result when nothing relevant has changed.\n\nEnable it in `gradle.properties`:\n```properties\norg.gradle.configuration-cache=true\n```\n\nPlugins and custom Gradle logic must be compatible with Configuration Cache.\n\n> **Configuration Cache avoids configuring the entire project again for every build.**\n\n### 3. Optimize the module dependency graph\nWith many modules, keep dependencies shallow and focused. Avoid long dependency chains, unnecessary feature-to-feature dependencies, and one huge shared module that causes many projects to recompile when it changes. Aim for changes to affect the smallest possible part of the graph.\n\nPrefer:\n```text\nFeature Home ───→ core-network\n             └──→ core-model\n\nFeature Profile → core-network\n                → core-user\n\nFeature Payment → core-payment\n```\n\n### `implementation` vs. `api`\nPrefer `implementation` unless a dependency is intentionally part of your module's public API:\n```kotlin\nimplementation(project(\":core-network\"))\n```\n\n`api` exposes a dependency to consumers, increasing coupling and potentially the compile impact of changes. Use it only when consumers need those types through your public API.\n\n### Staff-level approach\nI would **measure before changing settings**. Use build scans or profiling to find the biggest bottleneck:\n- Slow configuration → investigate Configuration Cache compatibility.\n- Repeated tasks → improve build or task caching.\n- Large recompilation → inspect the dependency graph and `api` exposure.\n- Slow code generation → examine KSP, processors, and plugins.\n- One oversized shared module → split its dependency boundaries.\n\nOptimize the largest measured bottleneck first.\n\n:::summary\n**Easy interview answer:**\n> In a 50+ module project, I avoid unnecessary work with incremental builds and caching, use Configuration Cache to reduce configuration time, and keep the dependency graph focused so changes affect as few modules as possible. I prefer `implementation` over `api` unless a dependency is part of the public API. At Staff level, I measure configuration, compilation, code generation, and graph costs first, then optimize based on data.\n\n**Easy way to remember:**\nDon't **run** unnecessary work → build avoidance/caching.\nDon't **configure** unnecessarily → Configuration Cache.\nDon't **rebuild** half the project → a focused module graph.\n:::"},{"id":"kotlin-reified-type","section":"Kotlin","difficulty":"Standard","tags":["Generics"],"question":"What is a reified type in Kotlin?","answer":"Normally, generic type information is **not available at runtime** because of **type erasure**.\n\nFor example, this runtime check is not allowed for an ordinary generic type parameter:\n```kotlin\nfun \u003cT> check(value: Any) {\n    if (value is T) { // Cannot check an erased type\n    }\n}\n```\n\nAt runtime, Kotlin/JVM does not know what `T` actually is.\n\n### Reified solves this\nIf the function is `inline` and `T` is `reified`, the compiler can use the actual type at the call site:\n```kotlin\ninline fun \u003creified T> check(value: Any) {\n    if (value is T) {\n        println(\"Correct type\")\n    }\n}\n\ncheck\u003cString>(\"Hello\")\ncheck\u003cInt>(100)\n```\n\nBecause the function is inlined, the compiler puts its code at the call site, where it knows the actual type.\n\nReified types also allow access to the type's `KClass`:\n```kotlin\ninline fun \u003creified T> typeName() {\n    println(T::class)\n}\n```\n\n### Why must it be `inline`?\nInlining lets the compiler substitute the actual type at each call site. Without that, the generic type would be erased at runtime.\n\n:::summary\n**Easy interview answer:**\n> Normally, generic types are erased at runtime, so I cannot do checks like `value is T` or access `T::class`. A reified type keeps the actual type available inside an inline function, allowing runtime type checks and access to the class of `T` without passing a `Class` or `KClass` manually.\n\n**Easy way to remember:**\nGeneric `T` → type erased.\n`inline` + `reified T` → actual type available at the call site.\n:::"},{"id":"kotlin-it-scope-functions","section":"Kotlin","difficulty":"Standard","tags":["Scope Functions"],"question":"Why do we use it in scope functions?","answer":"`it` is **not an operator**. It is Kotlin's default name for a **single lambda parameter**.\n\nFor example:\n```kotlin\nval name = \"Rahul\"\n\nname.let {\n    println(it)\n}\n```\n\nHere, `it` refers to `name`. This is a shorter version of naming the parameter yourself:\n```kotlin\nname.let { value ->\n    println(value)\n}\n```\n\nIn short:\n```text\nit = object passed into the lambda\n```\n\n### Which scope functions use `it`?\n`let` and `also` provide the object as a lambda argument, so we normally access it with `it`:\n```kotlin\nuser.let {\n    println(it.name)\n}\n\nuser.also {\n    println(it.name)\n}\n```\n\n`run`, `apply`, and `with` use the object as a **receiver**. We can use `this` or access its properties directly:\n```kotlin\nuser.apply {\n    name = \"John\"\n    age = 30\n}\n```\n\nThis is equivalent to explicitly using `this`:\n```kotlin\nuser.apply {\n    this.name = \"John\"\n}\n```\n\n:::summary\n**Easy interview answer:**\n> `it` is Kotlin's default name for a single lambda parameter. In `let` and `also`, the object is passed as an argument, so we can use `it`. In `apply`, `run`, and `with`, the object is the receiver, so we use `this` or access its properties directly.\n\n**Easy way to remember:**\n`let` / `also` → `it`\n`apply` / `run` / `with` → `this`\n:::"},{"id":"kotlin-scope-functions-when-to-use","section":"Kotlin","difficulty":"Standard","tags":["Scope Functions"],"question":"What are the use cases for let, run, also, apply, and with in Kotlin? When should you use each?","answer":"The easiest way to understand scope functions is to check two things:\n1. How is the object accessed: **`it` or `this`**?\n2. What is returned: **the object itself or the lambda result**?\n\nQuick guide:\n- `let` → `it`; returns the lambda result; null checks and transformations.\n- `run` → `this`; returns the lambda result; work with an object and return a result.\n- `apply` → `this`; returns the same object; configure an object.\n- `also` → `it`; returns the same object; side effects such as logging.\n- `with` → `this`; returns the lambda result; perform multiple operations on an object.\n\n### `let` — null checks and transformations\n`let` gives the object as `it` and returns the **lambda result**. It is commonly used for null-safe operations:\n```kotlin\nuser?.let {\n    saveUser(it)\n}\n```\n\nIt can also transform a value:\n```kotlin\nval length = name.let {\n    it.length\n}\n```\n\nThink: **Let me do something with this value.**\n\n### `run` — work with an object and return a result\n`run` uses `this` and returns the **lambda result**:\n```kotlin\nval description = user.run {\n    validate()\n    loadProfile()\n    \"$name - $age\"\n}\n```\n\nYou can access `name`, `age`, and `validate()` directly without repeatedly writing `user.`.\n\nThink: **Run some operations on this object and give me the result.**\n\n### `apply` — configure an object\n`apply` uses `this` and returns the **same object**. It is commonly used when creating or configuring objects:\n```kotlin\nval intent = Intent(context, DetailActivity::class.java).apply {\n    putExtra(\"userId\", userId)\n    putExtra(\"source\", \"home\")\n}\n\nval user = User().apply {\n    name = \"Rahul\"\n    age = 30\n}\n```\n\nThink: **Apply these settings to this object.**\n\n### `also` — side effects\n`also` uses `it` and returns the **same object**. Use it for logging or debugging without changing the main flow:\n```kotlin\nval user = getUser().also {\n    Log.d(\"User\", \"Loaded ${it.name}\")\n}\n```\n\nThink: **Do this, and also do this extra thing.**\n\n### `with` — multiple operations on an existing object\n`with` uses `this` and returns the **lambda result**:\n```kotlin\nwith(binding) {\n    title.text = \"Hello\"\n    button.isEnabled = true\n    progressBar.isVisible = false\n}\n```\n\nThis avoids repeatedly writing `binding.` before each property.\n\nThink: **Do multiple things with this object.**\n\n### Similarities\n**`let` vs. `run`:** Both return the lambda result. `let` uses `it`; `run` uses `this`. Use `let` when an explicit argument is clearer, especially for null-safe operations. Use `run` when accessing several members of the same object.\n\n**`run` vs. `with`:** Both use `this` and return the lambda result. `run` is extension style (`user.run { ... }`); `with` is argument style (`with(user) { ... }`). `run` is convenient for chaining or nullable objects; `with` is useful for grouping operations on an existing object.\n\n**`apply` vs. `also`:** Both return the same object. `apply` uses `this` and is for configuration; `also` uses `it` and is for side effects.\n\n:::summary\n**Easy interview answer:**\n> `let` is useful for null-safe operations and transformations. It uses `it` and returns the lambda result. `run` performs operations on an object and returns a result using `this`. `apply` configures an object using `this` and returns the same object. `also` uses `it` for side effects and returns the same object. `with` uses `this` to perform operations on an existing object and returns the lambda result.\n\nThe important similarities are:\n- **`let` and `run`** → both return the lambda result; `let` uses `it`, `run` uses `this`.\n- **`run` and `with`** → both use `this` and return the lambda result; `run` is extension style, `with` is argument style.\n- **`apply` and `also`** → both return the original object; `apply` uses `this`, `also` uses `it`.\n:::"},{"id":"kotlin-inline-noinline-crossinline","section":"Kotlin","difficulty":"Senior","tags":["Inline Functions"],"question":"What are inline, noinline, and crossinline functions in Kotlin?","answer":"Before these keywords, understand two terms: **lambda** and **call site**.\n\nA **lambda** is a function that can be passed to another function as a value:\n```kotlin\nfun execute(action: () -> Unit) {\n    action()\n}\n\nexecute {\n    println(\"Hello\")\n}\n```\n\nThe code inside `{ ... }` is the lambda. In Android, a click listener is a common example:\n```kotlin\nbutton.setOnClickListener {\n    openProfile()\n}\n```\n\nA **call site** is the place where a function is called. In `execute { println(\"Hello\") }`, that expression is the call site.\n\n### `inline`\n`inline` is mainly useful for functions that accept lambdas. It allows the compiler to place the function body and eligible lambda code at the call site:\n```kotlin\ninline fun execute(action: () -> Unit) {\n    action()\n}\n\nexecute {\n    println(\"Hello\")\n}\n```\n\nThis can reduce lambda-object and function-call overhead for small higher-order functions. `inline` also enables features such as **reified types** and **non-local returns**.\n\n### Non-local return\nA return inside a lambda passed to an inline function can return from the outer function:\n```kotlin\ninline fun execute(action: () -> Unit) {\n    action()\n}\n\nfun loadData() {\n    execute {\n        return\n    }\n    println(\"Done\") // Not reached\n}\n```\n\nThis is called a **non-local return**.\n\n### `noinline`\nIn an inline function with multiple lambda parameters, `noinline` keeps a particular lambda as a normal function object:\n```kotlin\ninline fun execute(\n    action1: () -> Unit,\n    noinline action2: () -> Unit\n) {\n    val savedAction = action2\n    action1()\n}\n```\n\nUse `noinline` when you need to store that lambda or pass it around as a value.\n\n> **`noinline` means this lambda is not inlined.**\n\n### `crossinline`\n`crossinline` keeps the lambda eligible for inlining but prohibits non-local returns. It is useful when the lambda is invoked from another lambda or execution context:\n```kotlin\ninline fun execute(crossinline action: () -> Unit) {\n    val runnable = Runnable {\n        action()\n    }\n    runnable.run()\n}\n```\n\nBecause `action` runs inside `Runnable`, it cannot return from the outer caller. A labelled local return, such as `return@execute`, is still possible.\n\n> **`crossinline` means inline this lambda, but do not allow it to return from the outer function.**\n\n### `noinline` vs. `crossinline`\n- `noinline` → the lambda is not inlined; it can be stored or passed around.\n- `crossinline` → the lambda remains inline, but a non-local return is forbidden.\n\n:::summary\n**Easy interview answer:**\n> A lambda is a function passed as a value, and the call site is where the function is called. `inline` puts eligible function and lambda code at the call site. `noinline` keeps a particular lambda as a normal object so it can be stored or passed around. `crossinline` keeps it inline but prevents non-local returns, which is useful when it is called from another lambda or execution context.\n\n**Easy way to remember:**\n`inline` → inline code; non-local return allowed.\n`noinline` → do not inline this lambda.\n`crossinline` → inline it, but forbid non-local return.\n:::"},{"id":"kotlin-inline-lambda-performance","section":"Kotlin","difficulty":"Standard","tags":["Lambda","Inline Functions"],"question":"How do inline functions increase the performance of lambdas?","answer":"When a lambda is passed to a function, Kotlin may need to create a **lambda object** and invoke it through a function call.\n\nFor example:\n```kotlin\nfun execute(action: () -> Unit) {\n    action()\n}\n\nfun loadData() {\n    execute {\n        println(\"Hello\")\n    }\n}\n```\n\nWithout `inline`, this can involve creating a lambda object, passing it to `execute`, and invoking it through `action()`.\n\n### What happens with `inline`?\n```kotlin\ninline fun execute(action: () -> Unit) {\n    action()\n}\n```\n\nThe compiler can place the function and eligible lambda code directly at the **call site**. Conceptually, `loadData()` can become:\n```kotlin\nfun loadData() {\n    println(\"Hello\")\n}\n```\n\nThis can avoid some lambda allocations and indirect function calls, especially for small higher-order functions called frequently. Kotlin's standard library uses inline functions in places such as `forEach`:\n```kotlin\nlist.forEach {\n    println(it)\n}\n```\n\n### Is `inline` always faster?\nNo. Inlining can increase generated code size because the function body may be copied to multiple call sites. It is most useful for **small higher-order functions with lambda parameters**, not something to apply everywhere.\n\n:::summary\n**Easy interview answer:**\n> Passing a lambda may require creating a lambda object and invoking it through a function call. An inline function lets the compiler place the function and lambda code at the call site, which can avoid some allocations and call overhead. This helps most with small, frequently used higher-order functions. The trade-off is larger generated code, so `inline` is not always faster.\n\n**Easy way to remember:**\nNormal lambda → create/pass/invoke.\nInline lambda → code at the call site, with less allocation/call overhead but potentially more code size.\n:::"},{"id":"kotlin-sealed-classes-vs-enums","section":"Kotlin","difficulty":"Standard","tags":["Sealed Class","Enum"],"question":"What are sealed classes and what are their benefits over enums?","answer":"A **sealed class** is useful when there is a **fixed set of possible states or types**, but each state may contain different data. A common Android example is UI state:\n```kotlin\nsealed class UiState {\n    data object Loading : UiState()\n\n    data class Success(\n        val data: List\u003cUser>\n    ) : UiState()\n\n    data class Error(\n        val message: String\n    ) : UiState()\n}\n```\n\nThe possible states are `Loading`, `Success(data)`, and `Error(message)`. We can handle them with `when`:\n```kotlin\nwhen (state) {\n    is UiState.Loading -> showLoading()\n    is UiState.Success -> showUsers(state.data)\n    is UiState.Error -> showError(state.message)\n}\n```\n\nBecause the compiler knows the possible subclasses, this `when` can be **exhaustive**. If a new state is added, Kotlin can require it to be handled.\n\n### How is this different from an enum?\nAn enum is also good for a fixed set of simple values:\n```kotlin\nenum class Direction {\n    NORTH, SOUTH, EAST, WEST\n}\n```\n\nEnum values share the same enum type and structure. A sealed class is better when cases carry different data:\n```kotlin\nsealed class Result {\n    data object Loading : Result()\n    data class Success(val data: User) : Result()\n    data class Error(val exception: Throwable) : Result()\n}\n```\n\nEach sealed subclass can have its own data, properties, functions, and behavior.\n\n### Common Android use cases\n- **UI state:** `Loading`, `Success(data)`, `Error(message)`.\n- **API result:** success data or an exception.\n- **Navigation:** destinations such as `Home`, `Profile(userId)`, and `Article(articleId)`.\n\n:::summary\n**Easy interview answer:**\n> A sealed class represents a restricted set of possible types. The compiler knows its subclasses, which makes it useful for UI states, API results, and navigation events, and enables exhaustive `when` expressions. Unlike an enum, each sealed subclass can carry different data and behavior. I use enums for simple fixed constants and sealed classes when cases need different data.\n\n**Easy way to remember:**\nEnum → fixed values, usually simple constants.\nSealed class → fixed types, each can carry different data.\n:::"},{"id":"kotlin-data-classes-properties","section":"Kotlin","difficulty":"Standard","tags":["Data Class"],"question":"What are data classes? Can data classes be abstract, nested, or sealed? Why is at least one parameter required?","answer":"A **data class is mainly used to represent data**. Kotlin generates useful functions from properties in its primary constructor:\n```text\nequals()\nhashCode()\ntoString()\ncopy()\ncomponentN()\n```\n\nFor example:\n```kotlin\ndata class User(\n    val name: String,\n    val age: Int\n)\n\nval user1 = User(\"Rahul\", 30)\nval user2 = User(\"Rahul\", 30)\n\nprintln(user1 == user2) // true\n```\n\nKotlin's `==` calls `equals()`. The generated `equals()` compares the primary-constructor properties, here `name` and `age`. A normal class does not generate value-based equality automatically.\n\n### `copy()`\n`copy()` creates a new instance with selected values changed; the original remains unchanged:\n```kotlin\nval user = User(\"Rahul\", 30)\nval updatedUser = user.copy(age = 31)\n```\n\nThis is useful for immutable UI state, such as `state.copy(isLoading = true)`.\n\n### `componentN()` and destructuring\nData classes generate component functions for primary-constructor properties:\n```kotlin\nval user = User(\"Rahul\", 30)\nval (name, age) = user\n```\n\nHere, `component1()` gives `name` and `component2()` gives `age`.\n\n### Can a data class be abstract or sealed?\nNo. A data class represents a concrete data object; an abstract class is an incomplete base type, and a sealed class defines a restricted hierarchy. Instead, use a sealed parent with data-class children:\n```kotlin\nsealed class Result\n\ndata class Success(val data: String) : Result()\ndata class Error(val message: String) : Result()\n```\n\nThe sealed class defines the possible types; each data class carries that case's data.\n\n### Can a data class be nested?\nYes. A data class can be declared inside another class:\n```kotlin\nclass UserManager {\n    data class User(val name: String, val age: Int)\n}\n\nval user = UserManager.User(\"Rahul\", 30)\n```\n\n### Why is at least one primary-constructor property required?\nA data class requires at least one `val` or `var` parameter in its primary constructor. Kotlin uses those properties to generate `equals()`, `hashCode()`, `toString()`, `copy()`, and `componentN()`.\n\nOnly primary-constructor properties participate in those generated functions. A property declared in the class body is excluded:\n```kotlin\ndata class User(val name: String) {\n    var age: Int = 0\n}\n\nval user1 = User(\"Rahul\").apply { age = 20 }\nval user2 = User(\"Rahul\").apply { age = 40 }\nprintln(user1 == user2) // true: equality compares only name\n```\n\n:::summary\n**Easy interview answer:**\n> A data class represents data. Kotlin generates `equals()`, `hashCode()`, `toString()`, `copy()`, and `componentN()` from its primary-constructor properties. A data class cannot be abstract or sealed, but it can be nested. It needs at least one `val` or `var` constructor property because those properties define the generated data behavior. For variants, use a sealed parent with data-class children.\n\n**Easy way to remember:**\n`data class` → concrete data; generated functions use constructor properties.\n`sealed class` → defines a hierarchy; data classes can represent its cases.\n:::"},{"id":"kotlin-reified-bytecode-type-erasure","section":"Kotlin","difficulty":"Senior","tags":["Generics","Reified","JVM Internals"],"question":"Explain type erasure in Kotlin/JVM. How does reified work at the bytecode level and why can it only be used with inline functions?","answer":"To understand `reified`, first understand **type erasure**.\n\nFor example:\n```kotlin\nfun \u003cT> printValue(value: T) {\n    println(value)\n}\n\nprintValue\u003cString>(\"Hello\")\nprintValue\u003cInt>(100)\n```\n\nAt compile time, Kotlin knows the type arguments. On the JVM, generic type information is mostly erased at runtime. Conceptually, the method behaves more like it accepts `Object`, so inside a normal generic function the actual `T` is generally unavailable. That is why `value is T` and `T::class` are not allowed for an ordinary type parameter.\n\n### What does `reified` do?\nA reified type parameter lets an inline function use the actual type at its call site:\n```kotlin\ninline fun \u003creified T> check(value: Any) {\n    if (value is T) {\n        println(\"Correct type\")\n    }\n}\n\ncheck\u003cString>(\"Hello\")\n```\n\nIt also allows access to the class:\n```kotlin\ninline fun \u003creified T> printType() {\n    println(T::class)\n}\n\nprintType\u003cString>()\n```\n\n### Why must it be `inline`?\nWithout inlining, there would be one generic method at runtime, and type erasure would mean it could not tell whether `T` was `String`, `Int`, or `User`. With `inline`, the compiler can place the function code at the call site, where it knows the concrete type, and substitute that type into the generated code.\n\nConceptually, `check\u003cString>(value)` makes `value is T` into `value is String`. At the JVM bytecode level, that can become a normal type check such as:\n```text\nINSTANCEOF java/lang/String\n```\n\nThe JVM does not need special knowledge of `reified`; the Kotlin compiler has already generated code using the actual type.\n\n### How can we do this without `reified`?\nPass the type explicitly as a `Class` or `KClass`:\n```kotlin\nfun \u003cT : Any> printType(clazz: Class\u003cT>) {\n    println(clazz)\n}\n\nprintType(String::class.java)\n```\n\nOr use `KClass\u003cT>` and pass `String::class`.\n\n:::summary\n**Easy interview answer:**\n> On the JVM, generic types are normally erased at runtime, so an ordinary generic function cannot use `T::class` or check `value is T`. `reified` works with `inline`: the compiler specializes the function at the call site, where it knows the actual type. A check like `value is T` can become a regular bytecode instruction such as `INSTANCEOF java/lang/String`. Without reified, pass a `Class` or `KClass` explicitly.\n\n**Easy way to remember:**\nNormal `\u003cT>` → erased at runtime.\n`inline` + `reified T` → compiler knows `T` at the call site and emits type-specific code.\n:::"},{"id":"kotlin-nothing-unit-void","section":"Kotlin","difficulty":"Senior","tags":["Type System","Nothing","Unit"],"question":"What is the difference between Nothing, Unit, and Void in Kotlin? How does Nothing enable the type system to express exhaustiveness?","answer":"The easiest way to understand them is:\n```text\nUnit    → function finishes, but returns no meaningful value\nNothing → function never finishes normally\nVoid    → Java interop type, rarely used in normal Kotlin\n```\n\n### `Unit` — no meaningful result\n`Unit` is similar to Java's `void`, but it is a real Kotlin type with one value: `Unit`. The function executes and returns normally:\n```kotlin\nfun showMessage(): Unit {\n    println(\"Hello\")\n}\n\n// Usually written without the explicit return type\nfun showMessage() {\n    println(\"Hello\")\n}\n```\n\nA lambda of type `() -> Unit` means the caller does not need a meaningful result:\n```kotlin\nval action: () -> Unit = {\n    println(\"Clicked\")\n}\n```\n\n### `Nothing` — never returns normally\n`Nothing` is different: a function with this return type cannot return to its caller normally. It might always throw or run forever:\n```kotlin\nfun fail(message: String): Nothing {\n    throw IllegalStateException(message)\n}\n```\n\n`Nothing` is Kotlin's **bottom type**, a subtype of every Kotlin type. A `throw` expression has type `Nothing`, so it can appear in a branch where another type is expected:\n```kotlin\nval name: String =\n    user.name ?: throw IllegalStateException(\"Name missing\")\n```\n\nThe successful branch produces a `String`; the other branch throws and never produces a value. `TODO()` also returns `Nothing`, which is why it can stand in for any expected return type while throwing `NotImplementedError`.\n\n### What about `Void`?\n`Void` usually refers to Java's `java.lang.Void` and is mainly relevant to Java interop. In ordinary Kotlin code, use `Unit` for a function that returns no meaningful value, not `Void`.\n\n```text\nJava void ≈ Kotlin Unit\n```\n\n### How does `Nothing` relate to exhaustiveness?\nA sealed hierarchy lets the compiler know all possible cases, so a `when` can be **exhaustive**. `Nothing` lets a branch express that it stops instead of producing the expression's result type:\n```kotlin\nsealed class Result\ndata class Success(val data: String) : Result()\ndata class Error(val message: String) : Result()\n\nfun handle(result: Result): String = when (result) {\n    is Success -> result.data\n    is Error -> throw IllegalStateException(result.message)\n}\n```\n\nThe `when` is exhaustive because the sealed hierarchy has only `Success` and `Error`. The error branch has type `Nothing`, so it does not need to produce a `String`. **`Nothing` itself does not make the `when` exhaustive; the sealed hierarchy does.**\n\n:::summary\n**Easy interview answer:**\n> `Unit` means a function completes normally without a meaningful result. `Nothing` means it never returns normally, such as when it throws; it is Kotlin's bottom type and can fit wherever a value is expected because it produces no value. `Void` is mainly Java interop. A sealed hierarchy makes `when` exhaustive, while `Nothing` lets a branch represent a path that stops instead of returning the result type.\n\n**Easy way to remember:**\n`Unit` → finished, no useful result.\n`Nothing` → never returns normally.\n`Void` → mostly Java interop.\n:::"},{"id":"kotlin-variance-in-out","section":"Kotlin","difficulty":"Senior","tags":["Generics","Variance"],"question":"Explain variance in Kotlin: in, out, and invariant.","answer":"Variance describes **how generic types relate through inheritance**. Suppose `Dog` is a subtype of `Animal`; that does not automatically make `Box\u003cDog>` a subtype of `Box\u003cAnimal>`. Variance controls when that relationship is safe.\n\n### Invariant — the default\n```kotlin\nclass Box\u003cT>\n\nval dogBox: Box\u003cDog> = Box()\n// val animalBox: Box\u003cAnimal> = dogBox // Does not compile\n```\n\n`Box\u003cDog>` is not a `Box\u003cAnimal>`. If a mutable box were allowed to widen this way, code could put a `Cat` into a box that is supposed to contain only `Dog`.\n\n### `out` — producer\nUse `out` when a type produces or returns `T`:\n```kotlin\ninterface Producer\u003cout T> {\n    fun get(): T\n}\n\nval dogs: Producer\u003cDog> = DogProducer()\nval animals: Producer\u003cAnimal> = dogs\n```\n\nA producer of `Dog` is safe to use as a producer of `Animal`, because every `Dog` is an `Animal`. `out` means the type parameter is used in output positions.\n\n### `in` — consumer\nUse `in` when a type accepts `T`:\n```kotlin\ninterface Consumer\u003cin T> {\n    fun consume(value: T)\n}\n\nval animalConsumer: Consumer\u003cAnimal> = AnimalConsumer()\nval dogConsumer: Consumer\u003cDog> = animalConsumer\n```\n\nA consumer that accepts any `Animal` can also accept a `Dog`. `in` means the type parameter is used in input positions.\n\n### When should a type stay invariant?\nIf an API both returns and accepts `T`, it generally needs to remain invariant:\n```kotlin\ninterface Repository\u003cT> {\n    fun get(): T\n    fun save(value: T)\n}\n```\n\n### Declaration-site vs. use-site variance\n**Declaration-site variance** puts `in` or `out` on the class or interface, defining the rule once for all usages:\n```kotlin\ninterface Producer\u003cout T> {\n    fun get(): T\n}\n```\n\n**Use-site variance** applies a projection only where it is needed. The original type can remain invariant:\n```kotlin\nclass Box\u003cT>\n\nfun read(box: Box\u003cout Animal>) {\n    // Read Animal values from this Box\n}\n```\n\n### Real-world example\nAn event source only produces events, so it can be covariant:\n```kotlin\ninterface EventSource\u003cout T> {\n    fun getEvent(): T\n}\n\nopen class AppEvent\nclass LoginEvent : AppEvent()\n\nval loginEvents: EventSource\u003cLoginEvent> = LoginEventSource()\nval appEvents: EventSource\u003cAppEvent> = loginEvents\n```\n\nDeclaration-site variance makes this relationship part of the API design. Use-site projections can express similar relationships locally when changing the declaration is not appropriate.\n\n:::summary\n**Easy interview answer:**\n> Variance controls how generic types behave with inheritance. Kotlin generics are invariant by default, so `Box\u003cDog>` is not a `Box\u003cAnimal>`. `out` is for producers, allowing a producer of a subtype to be used as a producer of its supertype. `in` is for consumers, allowing a consumer of a supertype to be used as a consumer of its subtype. Declaration-site variance defines the rule on the type; use-site variance applies a projection at one usage.\n\n**Easy way to remember:**\n`out` → output → producer.\n`in` → input → consumer.\nNo `in`/`out` → invariant.\nDeclaration-site → define once.\nUse-site → define where needed.\n:::"},{"id":"kotlin-contracts-non-null-smart-cast","section":"Kotlin","difficulty":"Staff","tags":["Contracts","Smart Cast","Compiler"],"question":"How do Kotlin contracts work? Write a custom contract that tells the compiler a variable is non-null after a function call.","answer":"Kotlin contracts give the **compiler extra information about what a function guarantees**.\n\nFor example, a validation function can throw when its nullable input is null:\n```kotlin\n@OptIn(ExperimentalContracts::class)\nfun validateUser(user: User?) {\n    contract {\n        returns() implies (user != null)\n    }\n\n    if (user == null) {\n        throw IllegalArgumentException(\"User cannot be null\")\n    }\n}\n```\n\nThe important line is:\n```kotlin\nreturns() implies (user != null)\n```\n\nIt means: **if this function returns normally, then `user` is not null**. The implementation must actually guarantee this by throwing when `user` is null.\n\nThen the compiler can smart-cast a stable local variable after the call:\n```kotlin\nval user: User? = getUser()\nvalidateUser(user)\nprintln(user.name) // Compiler knows user is non-null\n```\n\nWithout the contract, the compiler may still treat `user` as nullable after the call. With the contract, it knows normal return implies `user != null`.\n\nKotlin's standard library also uses contracts to describe be
